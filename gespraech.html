<!doctype html>
<html lang="de">

<title>Gespräch</title>
<!-- Gespräche im Besprechungsraum (10.10.2026, Sam): Leertaste im Raum öffnet dieses Fenster. Läuft im Raum schon ein Gespräch,
     schreibt man dort mit; sonst Art wählen (Feedback, Meeting-Notizen, Mandantengespräch …) oder „Gespräch nachtragen“.
     Alle im Raum sehen dasselbe (alle 2,5 s abgeglichen, je Feld gewinnt die letzte Eingabe). Server: routes/gespraeche.js. -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#0f766e; color:#fff; padding:12px 14px; }
  header h1 { margin:0; font-size:17px; } header .u { font-size:12.5px; opacity:.85; margin-top:2px; }
  main { padding:12px 14px 30px; }
  .box { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:10px; }
  .arten { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:7px; }
  .arten button { text-align:left; background:#fff; color:#0f172a; border:1.5px solid #e2e8f0; border-radius:10px; padding:9px 10px; cursor:pointer; font:inherit; }
  .arten button:hover { border-color:#0d9488; } .arten b { display:block; font-size:13.5px; } .arten span { font-size:11.5px; color:#64748b; }
  .arten .lt { font-size:10.5px; color:#a16207; }
  h3 { font-size:13px; margin:12px 0 6px; color:#334155; }
  label { display:block; font-size:12px; font-weight:700; color:#475569; margin:10px 0 4px; }
  input, select, textarea { font:inherit; font-size:13.5px; padding:7px 9px; border:1.5px solid #cbd5e1; border-radius:8px; background:#fff; color:#0f172a; width:100%; }
  textarea { min-height:70px; resize:vertical; }
  button.k { font:inherit; font-size:13px; font-weight:700; border-radius:8px; padding:8px 12px; cursor:pointer; border:1.5px solid #0d9488; background:#0d9488; color:#fff; }
  button.k.leicht { background:#fff; color:#0f766e; } button.k.rot { background:#fff; color:#b91c1c; border-color:#b91c1c; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; align-items:center; } .chip { background:#ccfbf1; color:#115e59; border-radius:999px; padding:2px 9px; font-size:12px; }
  .noten { display:grid; grid-template-columns:1fr auto; gap:5px 10px; align-items:center; font-size:12.5px; }
  .noten .n { display:flex; gap:3px; } .noten .n button { width:28px; height:26px; border-radius:6px; border:1.5px solid #cbd5e1; background:#fff; cursor:pointer; font:inherit; font-weight:700; }
  .noten .n button.an { background:#0d9488; border-color:#0d9488; color:#fff; }
  .auf { display:grid; grid-template-columns:minmax(0,1fr) 140px 130px 28px; gap:5px; margin-bottom:5px; } @media (max-width:560px) { .auf { grid-template-columns:1fr 1fr; } }
  .fehler { color:#b91c1c; font-size:13px; font-weight:600; margin-top:6px; } .leer { color:#64748b; font-size:13px; }
  .hin { font-size:11.5px; color:#64748b; margin-top:4px; } .ok { color:#047857; font-weight:700; }
  .themen { display:flex; flex-wrap:wrap; gap:6px; } .themen button { font:inherit; font-size:13px; padding:6px 11px; border-radius:999px; border:1.5px solid #cbd5e1; background:#fff; color:#334155; cursor:pointer; }
  /* Layout A (13.10.2026, Sam): Gewähltes mit dickem Rahmen + Haken, darunter „Gewählt: …“, Start-Knopf nennt das Thema */
  .themen button.an { background:#e1f5ee; border:2.5px solid #0f766e; color:#085041; font-weight:700; padding:5px 10px; } .themen button.an::before { content:"✓ "; }
  .themen button:disabled { cursor:default; }
  .gewaehlt { margin-top:12px; font-size:13px; padding:8px 10px; border-radius:8px; background:#e1f5ee; color:#085041; } .gewaehlt.leer { background:#f1f5f9; color:#64748b; }
  .chip.mdt { display:inline-flex; gap:6px; align-items:center; border:1.5px solid #0d9488; padding:4px 10px; font-size:13px; font-weight:600; }
  button.k:disabled { background:#e2e8f0; border-color:#e2e8f0; color:#64748b; cursor:default; }
  html.glas .themen button.an { background:rgba(45,212,191,.22) !important; border-color:#5eead4 !important; color:#fff !important; }
  html.glas .gewaehlt { background:rgba(45,212,191,.16); color:#ccfbf1; } html.glas .gewaehlt.leer { background:rgba(255,255,255,.07); color:rgba(255,255,255,.65); }
  .zeit { font-variant-numeric:tabular-nums; font-weight:700; color:#047857; font-size:14px; } .zeit.stop { color:#b45309; }
  html.glas .themen button:not(.an) { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.2); color:#f1f5f9; } html.glas .zeit { color:#6ee7b7; } html.glas .zeit.stop { color:#fcd34d; }
  html.glas .box, html.glas .arten button { background:rgba(255,255,255,.07) !important; border-color:rgba(255,255,255,.15) !important; color:#f1f5f9 !important; }
  html.glas label, html.glas h3 { color:rgba(255,255,255,.75) !important; } html.glas .arten span, html.glas .leer, html.glas .hin { color:rgba(255,255,255,.65) !important; }
</style>

<body>
<header><h1 id="titel">💬 Gespräch</h1><div class="u" id="unter"></div></header>
<main id="inhalt"><div class="leer">Lädt …</div></main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
// Dieselbe Datei liegt auch im SW-internen Portal (app/frontend/public/gespraech.html): dort mit SW-Portal-Anmeldung statt Büro-Ausweis
const IM_DASHBOARD = location.hostname === "swdigitaltest.de";
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = IM_DASHBOARD ? "/api" : "https://swdigitaltest.de/buero-praesenz/gesp";
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), RAUM = q.get("raum") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
const heute = () => new Date().toLocaleDateString("sv-SE"), dDE = s => s ? String(s).split("-").reverse().join(".") : "";
async function api(pfad, opt = {}) {
  const r = await fetch(API + pfad, IM_DASHBOARD ? { ...opt, credentials: "include", headers: { "Content-Type": "application/json" } }
    : { ...opt, headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Fehler " + r.status); return d;
}
let G = null, ARTEN = [], PERSONEN = [], fokus = null, takt = null, warteSpeichern = {}, zeigtStand = 0;
// Kurzgespräch im Büro (12.10.2026, Sam: Layout A + C): ?zimmer=1 = Start-Karte im Büro eines Kollegen, ?abschluss=1 = Abschlusskarte
// beim Rausgehen (stoppt die Zeit), ?fokus=protokoll|aufgabe aus der Live-Leiste. Die Leiste selbst: zimmer-leiste.html.
const ZIMMER = q.get("zimmer") === "1", ABSCHLUSS = q.get("abschluss") === "1", FOKUS = q.get("fokus") || "";
let uhrVersatz = 0, uhr = null;
const mitWem = () => RAUM.replace(/^Büro\s+/i, "");
function buero(aktion) { try { if (typeof WA !== "undefined") WA.player.state.saveVariable("swAktion", { ...aktion, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); } }
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return (h ? h + ":" + String(m).padStart(2, "0") : String(m)) + ":" + String(s % 60).padStart(2, "0"); };
function uhrStellen() {
  clearInterval(uhr); uhr = null; if (!G || !G.artDef || !G.artDef.zeit || G.nachgetragen || !G.start) return;
  const tick = () => { const el = $("zeit"); if (!el) return; const ende = G.zeitEnde ? Date.parse(G.zeitEnde) : Date.now() + uhrVersatz;
    el.textContent = "⏱ " + mmss(ende - Date.parse(G.start)) + (G.zeitEnde || G.status === "fertig" ? " · Zeit gestoppt" : " · läuft"); el.classList.toggle("stop", !!G.zeitEnde); };
  tick(); if (!G.zeitEnde && G.status === "laeuft") uhr = setInterval(tick, 1000);
}

// ---------- Start-Karte im Büro eines Kollegen (Layout A) ----------
function zimmerStart() {
  const art = ARTEN.find(a => a.k === "zimmer");
  $("titel").textContent = "💬 Gespräch" + (mitWem() ? " mit " + mitWem() : ""); $("unter").textContent = RAUM + " · die Zeit läuft ab Start, bis einer das Büro verlässt";
  if (!art) { $("inhalt").innerHTML = '<div class="box">Kurzgespräche sind für dich nicht freigegeben (Einstellungen › Gesprächsarten).</div>'; return; }
  const themen = art.felder.find(f => f.k === "thema").optionen;
  let thema = "", mandant = null;
  const malen = () => {
    $("inhalt").innerHTML = `<div class="box"><label style="margin-top:0">Worum geht es?</label><div class="themen">${themen.map(t => `<button data-th="${esc(t)}" class="${t === thema ? "an" : ""}">${esc(t)}</button>`).join("")}</div>
      <label>Mandant (optional)</label>${mandant ? `<div class="chips"><span class="chip mdt">✓ ${esc(mandant.nr ? mandant.nr + " · " : "")}${esc(mandant.name)}</span><a href="#" id="mWeg" style="font-size:12px">ändern</a></div>` : '<input id="mSuche" placeholder="Name oder Mandantennummer …"><div id="mTreffer"></div>'}
      <div class="gewaehlt${thema ? "" : " leer"}">${thema ? `Gewählt: <b>${esc(thema)}</b>${mandant ? " · " + esc(mandant.name) : " · ohne Mandant"}` : "Noch nichts gewählt – bitte oben antippen, worum es geht."}</div>
      <div class="fehler" id="sFe"></div><div style="display:flex;gap:6px;margin-top:12px;align-items:center"><button class="k" id="sOk"${thema ? "" : " disabled"}>${thema ? "▶ " + esc(thema) + "-Gespräch starten · Zeit läuft" : "Erst auswählen, worum es geht"}</button><span style="flex:1"></span><a href="#" id="anders" style="font-size:12px">anderes Gespräch …</a></div></div>`;
    document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { thema = b.dataset.th; malen(); });
    if ($("mWeg")) $("mWeg").onclick = ev => { ev.preventDefault(); mandant = null; malen(); };
    if ($("mSuche")) $("mSuche").oninput = async () => { const s = $("mSuche").value; if (s.length < 2) return $("mTreffer").innerHTML = "";
      try { const l = await api("/gespraeche/mandanten?q=" + encodeURIComponent(s)); $("mTreffer").innerHTML = l.map((m, i) => `<div><a href="#" data-mi="${i}">${esc(m.nr ? m.nr + " · " : "")}${esc(m.name)}</a></div>`).join("") || '<div class="leer">kein Treffer</div>';
        document.querySelectorAll("[data-mi]").forEach(a => a.onclick = ev => { ev.preventDefault(); mandant = l[+a.dataset.mi]; malen(); }); } catch (e) { $("mTreffer").textContent = e.message; } };
    $("anders").onclick = ev => { ev.preventDefault(); auswahl(false); };
    $("sOk").onclick = async () => {
      if (!thema) return $("sFe").textContent = "Bitte wählen, worum es geht.";
      $("sOk").disabled = true;
      try { G = await api("/gespraeche", { method: "POST", body: JSON.stringify({ art: "zimmer", raum: RAUM, felder: { thema }, mandantId: mandant ? mandant.id : "" }) }); zurLeiste(); }
      catch (e) { $("sFe").textContent = e.message; $("sOk").disabled = false; }
    };
  };
  malen();
}
// Läuft das Gespräch: großes Fenster zu, unten die kleine Leiste mit der Zeit (das Büro-Skript macht beides und sagt es den anderen im Raum)
function zurLeiste() {
  if (typeof WA === "undefined" || IM_DASHBOARD) { zeichnen(); starteTakt(); return; }
  $("inhalt").innerHTML = '<div class="box">▶ Läuft – die Zeit siehst du unten in der Leiste.</div>';
  buero({ was: "zimmerLeiste", id: G.id, raum: RAUM });
}

// ---------- Auswahl ----------
async function auswahl(nach) {
  $("titel").textContent = nach ? "📝 Gespräch nachtragen" : "💬 Gespräch starten"; $("unter").textContent = nach ? "Für ein Gespräch, das schon stattgefunden hat" : (RAUM ? RAUM + " · wer hier steht, wird Teilnehmer" : "");
  let h = '<div class="box"><b>Was für ein Gespräch?</b><div class="hin">Gespräche hier sind immer intern – der Mandant ist nicht dabei. Mit Mandant verknüpft, stehen sie in seiner Akte unter „Gespräche intern“.</div><div class="arten" style="margin-top:8px">' + ARTEN.map(a => `<button data-art="${a.k}"><b>${a.icon} ${esc(a.name)}</b><span>${esc(a.felder.map(f => f.label.split(" (")[0]).slice(0, 3).join(", "))}</span>${a.leitung ? '<div class="lt">nur Leitung</div>' : ""}</button>`).join("") + "</div></div>";
  h += nach ? '<button class="k leicht" id="zurueck">← zurück</button>' : '<button class="k leicht" id="nachtragen">📝 Gespräch nachtragen (hat schon stattgefunden)</button>';
  $("inhalt").innerHTML = h;
  document.querySelectorAll("[data-art]").forEach(b => b.onclick = () => startFormular(ARTEN.find(a => a.k === b.dataset.art), nach));
  if ($("nachtragen")) $("nachtragen").onclick = () => auswahl(true); if ($("zurueck")) $("zurueck").onclick = () => auswahl(false);
}
async function startFormular(art, nach) {
  const betroffene = art.betrifft ? await api("/gespraeche/personen?betroffene=1") : [];
  const opt = l => l.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("");
  let h = `<div class="box"><b>${art.icon} ${esc(art.name)}${nach ? " nachtragen" : ""}</b>`;
  if (art.betrifft) h += `<label>Mit wem?</label><select id="sBetr"><option value="">– bitte wählen –</option>${opt(betroffene)}</select>`;
  if (nach) h += `<label>Wann war das Gespräch?</label><input id="sDatum" type="date" max="${heute()}" value="${heute()}"><label>Weitere Teilnehmer (Strg/Cmd für mehrere)</label><select id="sTeil" multiple size="6">${opt(PERSONEN)}</select>`;
  h += `<div class="fehler" id="sFe"></div><div style="display:flex;gap:6px;margin-top:10px"><button class="k" id="sOk">${nach ? "Weiter" : "Gespräch starten"}</button><button class="k leicht" id="sAb">Abbrechen</button></div></div>`;
  $("inhalt").innerHTML = h;
  $("sAb").onclick = () => auswahl(nach);
  $("sOk").onclick = async () => {
    const b = { art: art.k, raum: RAUM, nachgetragen: nach, mandantId: q.get("mandant") || "" };
    if (art.betrifft) { b.betrifftId = $("sBetr").value; if (!b.betrifftId) return $("sFe").textContent = "Bitte wählen, mit wem das Gespräch ist."; }
    if (nach) { b.datum = $("sDatum").value; b.teilnehmerIds = [...$("sTeil").selectedOptions].map(o => o.value); }
    $("sOk").disabled = true;
    try { G = await api("/gespraeche", { method: "POST", body: JSON.stringify(b) }); zeichnen(); starteTakt(); } catch (e) { $("sFe").textContent = e.message; $("sOk").disabled = false; }
  };
}

// ---------- Gesprächsfenster ----------
function feldHtml(f, v, darf) {
  const dis = darf ? "" : " disabled";
  if (f.typ === "noten") return `<label>${esc(f.label)}</label><div class="noten">${f.optionen.map(([k, t]) => `<span>${esc(t)}</span><span class="n" data-noten="${f.k}" data-kat="${k}">${[1, 2, 3, 4, 5].map(n => `<button${dis} data-n="${n}" class="${(v || {})[k] === n ? "an" : ""}">${n}</button>`).join("")}</span>`).join("")}</div>`;
  if (f.typ === "checkliste") return `<label>${esc(f.label)}</label>${f.optionen.map(o => `<label style="display:flex;gap:7px;font-weight:400;margin:3px 0;color:inherit"><input type="checkbox"${dis} data-cl="${f.k}" value="${esc(o)}" style="width:auto"${(v || []).includes(o) ? " checked" : ""}> ${esc(o)}</label>`).join("")}`;
  if (f.typ === "auswahl" && G && G.artDef && G.artDef.zeit) return `<label>${esc(f.label)}</label><div class="themen" data-wahl="${f.k}">${f.optionen.map(o => `<button${dis} data-o="${esc(o)}" class="${v === o ? "an" : ""}">${esc(o)}</button>`).join("")}</div>`;
  if (f.typ === "auswahl") return `<label>${esc(f.label)}</label><select data-f="${f.k}"${dis}><option value="">–</option>${f.optionen.map(o => `<option${v === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  if (f.typ === "datum") return `<label>${esc(f.label)}</label><input type="date" data-f="${f.k}" value="${esc(v || "")}"${dis} style="max-width:180px">`;
  if (f.typ === "text") return `<label>${esc(f.label)}</label><input data-f="${f.k}" value="${esc(v || "")}"${dis}>`;
  return `<label>${esc(f.label)}</label><textarea data-f="${f.k}"${dis}>${esc(v || "")}</textarea>`;
}
function zeichnen() {
  const g = G, a = g.artDef, darf = g.darfBearbeiten && g.status === "laeuft" || (g.darfBearbeiten && g.status === "fertig" && g.istLeitung);
  $("titel").textContent = `${a.icon} ${a.name}${g.betrifft ? " · " + g.betrifft.name : ""}${g.mandant ? " · " + g.mandant.name : ""}`;
  $("unter").textContent = (g.status === "fertig" ? "✓ abgeschlossen · " : g.nachgetragen ? "nachgetragen · " : "läuft · ") + dDE(g.datum) + (g.raum ? " · " + g.raum : "") + (a.sicht === "leitung" ? " · nur für die Leitung sichtbar" : a.sicht === "team" ? " · nach dem Abschluss für das ganze Team sichtbar" : "");
  const zeit = a.zeit && !g.nachgetragen, gestoppt = zeit && g.status === "laeuft" && !!g.zeitEnde;
  if (gestoppt) $("unter").textContent = $("unter").textContent.replace(/^läuft · /, "Zeit gestoppt · ");
  if (zeit && g.status === "laeuft") $("titel").textContent = (gestoppt ? "✓ Gespräch beendet" : "💬 Gespräch") + " · " + (g.felder.thema || a.name) + (g.mandant ? " · " + g.mandant.name : "");
  let h = (gestoppt ? '<div class="box" style="border-color:#f59e0b"><b>Kurz festhalten und speichern</b><div class="hin">Die Zeit ist gestoppt. Protokoll und Aufgaben ergänzen – „Speichern“ legt die Aufgaben in der Aufgaben Box an. Ohne Speichern wird es nach 30 Min automatisch abgelegt.</div></div>' : "")
    + `<div class="box">${zeit ? '<div class="zeit" id="zeit" style="margin-bottom:8px"></div>' : ""}<div class="chips"><b style="font-size:12.5px;margin-right:4px">Teilnehmer:</b>${g.teilnehmer.map(t => `<span class="chip">${esc(t.name)}${t.id === g.gestartetVon.id ? " (führt)" : ""}</span>`).join("")}
    </div>`; // 15.10.2026 abends (Sam): nur wer wirklich im Gespräch ist – niemand von Hand hinzufügen/entfernen
  if (a.mandant) h += `<label>${g.art === "mandant" ? "Mandant" : "Mandant (optional – dann steht es beim Mandanten unter „Gespräche intern“)"}</label>${g.mandant ? `<div class="chips"><span class="chip">${esc(g.mandant.nr ? g.mandant.nr + " · " : "")}${esc(g.mandant.name)}</span>${darf ? '<a href="#" id="mWeg" style="font-size:12px">ändern</a>' : ""}</div>` : (darf ? '<input id="mSuche" placeholder="Name oder Mandantennummer …"><div id="mTreffer"></div>' : '<div class="leer">–</div>')}`;
  h += a.felder.map(f => feldHtml(f, (g.felder || {})[f.k], darf)).join("") + "</div>";
  h += kiHtml(g, darf);
  if (a.aufgaben) {
    h += `<div class="box"><b>Aufgaben</b> <span class="hin">→ landen beim Abschließen in der Aufgaben Box</span><div id="aufL" style="margin-top:8px">` + (g.aufgaben || []).map((x, i) => `<div class="auf"><input data-a="${i}" data-ak="text" value="${esc(x.text)}"${darf && !x.ticketNr ? "" : " disabled"}>
      <select data-a="${i}" data-ak="bearbeiterId"${darf && !x.ticketNr ? "" : " disabled"}><option value="">wer?</option>${g.teilnehmer.concat(PERSONEN.filter(p => !g.teilnehmer.some(t => t.id === p.id))).map(p => `<option value="${esc(p.id)}"${p.id === x.bearbeiterId ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      <input type="date" data-a="${i}" data-ak="frist" value="${esc(x.frist)}"${darf && !x.ticketNr ? "" : " disabled"}>${x.ticketNr ? `<span class="hin" title="in der Aufgaben Box">${esc(x.ticketNr)}</span>` : darf ? `<button class="k leicht" data-aweg="${i}" style="padding:4px">✕</button>` : "<span></span>"}</div>`).join("")
      + `</div>${darf ? '<button class="k leicht" id="aufNeu">+ Aufgabe</button>' : ""}</div>`;
  }
  if (g.status === "laeuft" && g.darfBearbeiten) h += `<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="k" id="fertig">${zeit ? "✓ Speichern" : "✓ Gespräch abschließen"}</button>${zeit && !gestoppt ? '<button class="k leicht" id="zStop">■ Beenden (Zeit stoppen)</button>' : ""}<span style="flex:1"></span>${g.gestartetVon.id === g.ich ? '<button class="k rot" id="weg">Verwerfen</button>' : ""}</div>`;
  else if (g.status === "fertig") h += `<div class="box"><span class="ok">✓ Abgeschlossen</span> – alle Teilnehmer haben eine Meldung bekommen und finden es im Profil unter „Gespräche“.${g.istLeitung && g.darfBearbeiten ? " Du kannst die Angaben weiter ändern." : ""}<div style="margin-top:8px"><button class="k leicht" id="neu">Neues Gespräch</button></div></div>`;
  h += '<div class="fehler" id="fe"></div><div class="hin" id="stand"></div>';
  $("inhalt").innerHTML = h; verdrahten(darf); kiVerdrahten(); zeigtStand = g.version || 0;
  if (g.jetzt) uhrVersatz = Date.parse(g.jetzt) - Date.now();
  uhrStellen();
}
// ---------- Mitschrift + Zusammenfassung (12.10.2026, Sam: Layout A) ----------
// Ist eine Mitschrift da: am Ende fasst Claude zusammen (Zusammenfassung, Beschlüsse, erkannte Aufgaben). „Übernehmen“ schreibt es ins
// Protokoll und legt die angehakten Aufgaben in die Aufgaben-Liste — beim Speichern gehen sie wie gewohnt in die Aufgaben Box.
let kiLaeuft = false, kiAutoVersucht = false, kiFehler = "";
function kiHtml(g, darf) {
  const m = g.mitschrift || {}, k = g.ki; if (!m.anzahl && !k) return "";
  const mitschrift = m.anzahl ? `<details style="margin-top:8px"><summary class="hin" style="cursor:pointer">Mitschrift ansehen (${m.anzahl} Sätze${m.anzahl > (m.zeilen || []).length ? ", die letzten " + m.zeilen.length : ""})</summary><div style="max-height:220px;overflow:auto;font-size:12.5px;line-height:1.5;margin-top:6px">${(m.zeilen || []).map(z => `<div><b>${esc(z.name)}:</b> ${esc(z.text)}</div>`).join("")}</div></details>` : "";
  if (!k) return `<div class="box"><b>🧠 Zusammenfassung</b><div class="hin">${kiLaeuft ? "Claude fasst das Gespräch zusammen …" : kiFehler ? esc(kiFehler) : "Aus der Mitschrift Zusammenfassung, Beschlüsse und Aufgaben machen (kostet ein paar Cent)."}</div>${darf && !kiLaeuft ? '<button class="k" id="kiMach" style="margin-top:8px">🧠 Zusammenfassen</button>' : ""}${mitschrift}</div>`;
  const auf = (k.aufgaben || []).map((a, i) => `<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:4px 0"><input type="checkbox" data-kia="${i}" checked${k.uebernommen || !darf ? " disabled" : ""} style="width:auto;margin-top:3px"><span>${esc(a.text)}<span class="hin"> · ${esc(a.bearbeiterName || "wer?")}${a.frist ? " · bis " + esc(dDE(a.frist)) : ""}</span></span></label>`).join("");
  return `<div class="box" style="border-color:#1d9e75"><b>🧠 Zusammenfassung</b>${k.uebernommen ? ' <span class="ok">✓ übernommen</span>' : ""}<div style="margin-top:6px;line-height:1.5">${esc(k.zusammenfassung)}</div>`
    + ((k.beschluesse || []).length ? `<div style="margin-top:8px"><b style="font-size:12.5px">Beschlüsse</b><ul style="margin:4px 0 0 18px;padding:0">${k.beschluesse.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>` : "")
    + ((k.aufgaben || []).length ? `<div style="margin-top:8px"><b style="font-size:12.5px">${k.aufgaben.length} Aufgabe${k.aufgaben.length === 1 ? "" : "n"} erkannt</b>${auf}</div>` : '<div class="hin" style="margin-top:6px">Keine Aufgaben erkannt.</div>')
    + (k.mandant && !g.mandant ? `<div class="hin" style="margin-top:6px">Genannter Mandant: ${esc(k.mandant)} – oben unter „Mandant“ eintragen.</div>` : "")
    + (darf && !k.uebernommen ? '<div style="display:flex;gap:6px;margin-top:8px"><button class="k" id="kiNimm">✓ Übernehmen</button><button class="k leicht" id="kiNeu">↻ Neu zusammenfassen</button></div>' : "")
    + (kiFehler ? `<div class="fehler">${esc(kiFehler)}</div>` : "") + mitschrift + "</div>";
}
async function kiMachen(neu) {
  if (kiLaeuft) return; kiLaeuft = true; kiFehler = ""; zeichnen();
  try { G = await api("/gespraeche/" + G.id + "/zusammenfassung", { method: "POST", body: JSON.stringify({ neu: !!neu }) }); } catch (e) { kiFehler = e.message; }
  kiLaeuft = false; zeichnen();
}
function kiVerdrahten() {
  if ($("kiMach")) $("kiMach").onclick = () => kiMachen(false);
  if ($("kiNeu")) $("kiNeu").onclick = () => kiMachen(true);
  if ($("kiNimm")) $("kiNimm").onclick = async () => { const auswahl = [...document.querySelectorAll("[data-kia]:checked")].map(x => +x.dataset.kia);
    try { G = await api("/gespraeche/" + G.id + "/ki-uebernehmen", { method: "POST", body: JSON.stringify({ auswahl }) }); zeichnen(); } catch (e) { kiFehler = e.message; zeichnen(); } };
  // Abschlusskarte: Gespräch beendet, Mitschrift da, noch keine Zusammenfassung → einmal automatisch anstoßen
  const m = G && G.mitschrift; if (G && G.darfBearbeiten && G.zeitEnde && m && m.anzahl && !G.ki && !kiAutoVersucht) { kiAutoVersucht = true; setTimeout(() => kiMachen(false), 50); }
}
function speichern(teil, sofort) {
  Object.assign(warteSpeichern, teil); clearTimeout(speichern.t);
  speichern.t = setTimeout(async () => { const b = warteSpeichern; warteSpeichern = {};
    try { const neu = await api("/gespraeche/" + G.id, { method: "PUT", body: JSON.stringify(b) }); G = neu; zeigtStand = neu.version; $("stand") && ($("stand").textContent = "gespeichert " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" })); if (b.teilnehmerIds || b.mandantId !== undefined || b.aufgaben && sofort) zeichnen(); }
    catch (e) { $("fe") && ($("fe").textContent = e.message); } }, sofort ? 0 : 600);
}
function felderStand() { const f = {}; G.artDef.felder.forEach(d => { f[d.k] = (G.felder || {})[d.k]; }); return f; }
function verdrahten(darf) {
  if ($("neu")) $("neu").onclick = () => { stoppeTakt(); G = null; auswahl(false); };
  if (!darf) return;
  document.querySelectorAll("[data-f]").forEach(el => { el.onfocus = () => fokus = el; el.onblur = () => fokus = null;
    el.oninput = el.onchange = () => { G.felder[el.dataset.f] = el.value; speichern({ felder: { [el.dataset.f]: el.value } }); }; });
  document.querySelectorAll("[data-noten] button").forEach(b => b.onclick = () => { const s = b.parentElement, k = s.dataset.noten, kat = s.dataset.kat, n = +b.dataset.n;
    const v = { ...(G.felder[k] || {}) }; v[kat] = v[kat] === n ? undefined : n; G.felder[k] = v; s.querySelectorAll("button").forEach(x => x.classList.toggle("an", +x.dataset.n === v[kat])); speichern({ felder: { [k]: v } }); });
  document.querySelectorAll("[data-wahl] button").forEach(b => b.onclick = () => { const k = b.parentElement.dataset.wahl; G.felder[k] = b.dataset.o;
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("an", x === b)); speichern({ felder: { [k]: b.dataset.o } }); });
  if ($("zStop")) $("zStop").onclick = async () => { try { G = await api("/gespraeche/" + G.id + "/zeit", { method: "POST", body: JSON.stringify({ stop: true }) }); zeichnen(); buero({ was: "zimmerLeisteZu", id: G.id }); } catch (e) { $("fe").textContent = e.message; } };
  document.querySelectorAll("[data-cl]").forEach(c => c.onchange = () => { const k = c.dataset.cl; G.felder[k] = [...document.querySelectorAll(`[data-cl="${k}"]:checked`)].map(x => x.value); speichern({ felder: { [k]: G.felder[k] } }); });
  if ($("plus")) $("plus").onchange = () => { if (!$("plus").value) return; speichern({ teilnehmerIds: [...G.teilnehmer.map(t => t.id), $("plus").value] }, true); };
  if ($("mWeg")) $("mWeg").onclick = ev => { ev.preventDefault(); speichern({ mandantId: "" }, true); };
  if ($("mSuche")) $("mSuche").oninput = async () => { const s = $("mSuche").value; if (s.length < 2) return $("mTreffer").innerHTML = "";
    try { const l = await api("/gespraeche/mandanten?q=" + encodeURIComponent(s)); $("mTreffer").innerHTML = l.map(m => `<div><a href="#" data-m="${esc(m.id)}">${esc(m.nr ? m.nr + " · " : "")}${esc(m.name)}</a></div>`).join("") || '<div class="leer">kein Treffer</div>';
      document.querySelectorAll("[data-m]").forEach(a => a.onclick = ev => { ev.preventDefault(); speichern({ mandantId: a.dataset.m }, true); }); } catch (e) { $("mTreffer").textContent = e.message; } };
  const aufStand = () => (G.aufgaben || []).map(x => ({ ...x }));
  document.querySelectorAll("[data-a]").forEach(el => { el.onfocus = () => fokus = el; el.onblur = () => fokus = null;
    el.oninput = el.onchange = () => { const l = aufStand(); l[+el.dataset.a][el.dataset.ak] = el.value; G.aufgaben = l; speichern({ aufgaben: l }); }; });
  document.querySelectorAll("[data-aweg]").forEach(b => b.onclick = () => { const l = aufStand(); l.splice(+b.dataset.aweg, 1); G.aufgaben = l; speichern({ aufgaben: l }, true); zeichnen(); });
  if ($("aufNeu")) $("aufNeu").onclick = () => { G.aufgaben = [...aufStand(), { text: "", bearbeiterId: "", frist: "" }]; zeichnen(); const l = document.querySelectorAll('[data-ak="text"]'); if (l.length) l[l.length - 1].focus(); };
  if ($("fertig")) $("fertig").onclick = async () => {
    if (!G.artDef.zeit && !confirm("Gespräch abschließen? Alle Teilnehmer bekommen eine Meldung" + (G.artDef.aufgaben ? ", Aufgaben gehen in die Aufgaben Box." : "."))) return;
    clearTimeout(speichern.t); if (Object.keys(warteSpeichern).length) { const b = warteSpeichern; warteSpeichern = {}; try { await api("/gespraeche/" + G.id, { method: "PUT", body: JSON.stringify(b) }); } catch {} }
    try { G = await api("/gespraeche/" + G.id + "/abschliessen", { method: "POST" }); stoppeTakt(); zeichnen(); if (G.artDef.zeit) buero({ was: "zimmerLeisteZu", id: G.id }); } catch (e) { $("fe").textContent = e.message; } };
  if ($("weg")) $("weg").onclick = async () => { if (!confirm("Gespräch verwerfen? Alles Eingetragene wird gelöscht.")) return;
    try { await api("/gespraeche/" + G.id, { method: "DELETE" }); stoppeTakt(); G = null; auswahl(false); } catch (e) { $("fe").textContent = e.message; } };
}
// Abgleich mit den anderen im Raum: neue Fassung übernehmen, aber nicht das Feld, in dem man gerade tippt
function starteTakt() { stoppeTakt(); takt = setInterval(async () => {
  if (!G || G.status !== "laeuft" || Object.keys(warteSpeichern).length) return;
  try { const neu = await api("/gespraeche/" + G.id); if ((neu.version || 0) <= zeigtStand && neu.status === G.status) return;
    const f = fokus, k = f && (f.dataset.f || (f.dataset.a + "|" + f.dataset.ak)), v = f && f.value, pos = f && f.selectionStart;
    G = neu; zeichnen();
    if (k) { const el = f.dataset.f ? document.querySelector(`[data-f="${f.dataset.f}"]`) : document.querySelector(`[data-a="${f.dataset.a}"][data-ak="${f.dataset.ak}"]`); if (el) { el.value = v; el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } }
  } catch (e) { if (/nicht gefunden/.test(e.message)) { stoppeTakt(); G = null; $("inhalt").innerHTML = '<div class="box">Das Gespräch wurde verworfen.</div>'; } }
}, 2500); }
function stoppeTakt() { clearInterval(takt); takt = null; }

// Anmelden im Fenster (14.10.2026, Leutrim): Büro-PIN/Passwort oder Code per E-Mail → Büro-Ausweis, danach geht es direkt weiter
function anmelden(meldung) {
  const B = "https://swdigitaltest.de/buero-praesenz";
  let ben = ""; try { ben = localStorage.getItem("swSchlossBenutzer") || localStorage.getItem("swSchlossMail") || ""; } catch {}
  $("inhalt").innerHTML = `<div class="box"><b>Kurz anmelden</b><div style="font-size:12.5px;opacity:.8;margin:2px 0 8px">Damit das Gespräch dir zugeordnet wird.</div>
    <label>Benutzername oder E-Mail</label><input id="aBen" value="${esc(ben)}" autocomplete="username">
    <label>Büro-PIN, Passwort oder Code aus der E-Mail</label><input id="aPin" type="password" autocomplete="current-password">
    <div class="fehler" id="aFe" style="color:#b91c1c;font-size:13px;margin-top:6px">${esc(meldung || "")}</div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="k" id="aLos">Weiter</button><button class="k" id="aMail" style="background:#3f4651;border-color:#3f4651;color:#fff">✉️ Code per E-Mail</button></div></div>`;
  const fe = t => { $("aFe").textContent = t; };
  $("aMail").onclick = async () => { const m = $("aBen").value.trim(); if (!/@/.test(m)) return fe("Für den Code bitte oben deine dienstliche E-Mail eintragen.");
    try { const r = await fetch(B + "/ausweis/mailcode", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: m }) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Fehler");
      fe(""); $("aFe").style.color = "#047857"; $("aFe").textContent = "Code an " + m + " geschickt – unten eintragen."; $("aPin").focus(); } catch (e) { $("aFe").style.color = "#b91c1c"; fe(e.message); } };
  $("aLos").onclick = async () => { $("aLos").disabled = true;
    try { const r = await fetch(B + "/ausweis", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: $("aBen").value.trim(), pin: $("aPin").value, pause: true }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || (r.status === 429 ? "Zu viele Versuche – bitte 15 Minuten warten." : "Fehler"));
      try { localStorage.setItem("swBueroAusweis", d.token); } catch {} start(); }
    catch (e) { $("aFe").style.color = "#b91c1c"; fe(e.message); $("aLos").disabled = false; } };
}
async function start() {
  if (!IM_DASHBOARD && !ausweis()) return anmelden(); // 14.10.2026: direkt hier anmelden statt Sackgasse
  try {
    [ARTEN, PERSONEN] = await Promise.all([api("/gespraeche/arten" + (RAUM ? "?raum=" + encodeURIComponent(RAUM) : "")), api("/gespraeche/personen")]);
    const id = q.get("id");

    if (G && G.id && !G.artDef) G = await api("/gespraeche/" + G.id);

    if (ZIMMER && !id) { if (G && G.art === "zimmer") return zurLeiste(); if (!G) return zimmerStart(); }

    if (ABSCHLUSS && G && G.artDef && G.artDef.zeit && G.status === "laeuft" && !G.zeitEnde) G = await api("/gespraeche/" + G.id + "/zeit", { method: "POST", body: JSON.stringify({ stop: true }) });
    if (G) { zeichnen(); if (G.status === "laeuft") starteTakt();

      if (FOKUS === "aufgabe" && $("aufNeu")) $("aufNeu").click(); } else auswahl(q.get("nachtragen") === "1");
  } catch (e) { if (/ausweis/i.test(e.message) && !IM_DASHBOARD) { try { localStorage.removeItem("swBueroAusweis"); } catch {} return anmelden("Bitte kurz neu anmelden."); } $("inhalt").innerHTML = '<div class="box">' + esc(e.message) + "</div>"; }
}
(async () => { if (IM_DASHBOARD) return start(); for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100)); try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch {} start(); })();
