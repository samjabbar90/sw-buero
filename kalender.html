<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kalender</title>
<!-- Kalender im Büro (10.10.2026, Sam: Layout B „Kalender-Fenster“): Tag/Woche, eigener Kalender oder Kollegen (je nach Freigabe),
     Termin anlegen/ändern/löschen, Raum buchen. Gleiche Daten wie „Mein Kalender“ im Dashboard (inkl. verbundenem Google-Kalender).
     Nur mit Büro-Ausweis. -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#0f766e; color:#fff; padding:12px 14px; }
  header h1 { margin:0 0 8px; font-size:18px; }
  .leiste { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  main { padding:12px 14px; }
  button { font:inherit; font-size:13px; font-weight:700; border-radius:8px; padding:6px 10px; cursor:pointer; border:1.5px solid #0d9488; background:#0d9488; color:#fff; }
  button.leicht { background:#fff; color:#0f766e; } button.an { background:#134e4a; border-color:#134e4a; color:#fff; }
  select, input, textarea { font:inherit; font-size:13.5px; padding:6px 8px; border:1.5px solid #cbd5e1; border-radius:8px; background:#fff; color:#0f172a; }
  label { display:block; font-size:12px; font-weight:700; color:#475569; margin:8px 0 3px; }
  .box { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .tag { font-weight:800; font-size:13px; margin:10px 0 4px; color:#334155; } .tag.heute { color:#0f766e; }
  .t { display:grid; grid-template-columns:86px 1fr; gap:8px; padding:7px 9px; border-radius:9px; margin-bottom:5px; background:#eef2ff; border-left:4px solid #6366f1; cursor:pointer; }
  .t.google { background:#ecfeff; border-left-color:#0891b2; } .t.besetzt { background:#f1f5f9; border-left-color:#94a3b8; cursor:default; }
  .t .z { font-size:12.5px; font-weight:700; color:#334155; } .t .ti { font-size:13.5px; font-weight:700; } .t .m { font-size:12px; color:#64748b; }
  .leer { color:#64748b; font-size:13px; padding:4px 2px; }
  .reihe { display:grid; grid-template-columns:1fr 1fr; gap:8px; } .reihe3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .fehler { color:#b91c1c; font-size:13px; font-weight:600; margin-top:6px; }
  .woche { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; } .woche .t { grid-template-columns:1fr; gap:2px; }
  @media (max-width:700px) { .woche { grid-template-columns:1fr; } }
  /* Tag-Ansicht (Layout 1) */
  .drei { display:grid; grid-template-columns:200px minmax(0,1fr) 240px; gap:10px; align-items:start; }
  @media (max-width:760px) { .drei { grid-template-columns:1fr; } }
  .mini { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center; font-size:12px; }
  .mini span { padding:4px 0; border-radius:6px; cursor:pointer; position:relative; } .mini span.wt { cursor:default; font-weight:700; color:#64748b; font-size:11px; }
  .mini span:hover:not(.wt) { background:rgba(13,148,136,.15); } .mini span.gew { background:#0d9488; color:#fff; font-weight:700; } .mini span.heute { outline:1.5px solid #0d9488; }
  .mini span.punkt::after { content:""; position:absolute; left:50%; bottom:1px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:#6366f1; }
  .raster { position:relative; }
  .raster .std { position:absolute; left:0; right:0; border-top:1px solid #e2e8f0; font-size:10.5px; color:#94a3b8; padding-top:1px; }
  .raster .jetzt { position:absolute; left:42px; right:0; border-top:2px solid #ef4444; z-index:2; }
  .blk { position:absolute; border-radius:7px; padding:3px 7px; font-size:12px; overflow:hidden; cursor:pointer; background:#e0e7ff; border-left:4px solid #6366f1; color:#1e1b4b; box-sizing:border-box; }
  .blk.google { background:#cffafe; border-left-color:#0891b2; color:#164e63; } .blk.besetzt { background:#e2e8f0; border-left-color:#94a3b8; color:#334155; }
  .blk.gew { outline:2px solid #f59e0b; z-index:3; } .blk .m { font-size:11px; opacity:.8; }
  html.glas .raster .std { border-color:rgba(255,255,255,.12) !important; color:rgba(255,255,255,.55) !important; }
  html.glas .blk { background:rgba(99,102,241,.45) !important; color:#fff !important; } html.glas .blk.google { background:rgba(8,145,178,.45) !important; } html.glas .blk.besetzt { background:rgba(255,255,255,.14) !important; }
  html.glas .mini span.wt { color:rgba(255,255,255,.6) !important; }
  /* Anträge (Reiter, 10.10.2026) */
  .konto { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; } .konto div { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:8px; text-align:center; }
  .konto b { display:block; font-size:22px; } .konto small { color:#64748b; font-size:12px; }
  .arten { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; } @media (max-width:560px) { .arten { grid-template-columns:1fr 1fr; } }
  .arten button { background:#fff; color:#0f766e; padding:9px 4px; } .arten button.an { background:#0d9488; color:#fff; }
  .antr { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 4px; border-top:1px solid #e2e8f0; font-size:13.5px; } .antr:first-child { border-top:0; }
  .st { font-size:12px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; } .st.offen { background:#fef3c7; color:#92400e; } .st.genehmigt { background:#dcfce7; color:#166534; } .st.abgelehnt { background:#fee2e2; color:#991b1b; }
  html.glas .konto div { background:rgba(255,255,255,.08) !important; border-color:rgba(255,255,255,.15) !important; } html.glas .konto small { color:rgba(255,255,255,.7) !important; }
  html.glas .antr { border-color:rgba(255,255,255,.12) !important; } html.glas .arten button:not(.an) { background:rgba(255,255,255,.08) !important; color:#e2e8f0 !important; }
  html.glas .t { background:rgba(99,102,241,.22) !important; } html.glas .t.google { background:rgba(8,145,178,.22) !important; } html.glas .t.besetzt { background:rgba(255,255,255,.08) !important; }
  html.glas .t .z, html.glas .tag { color:#e2e8f0 !important; } html.glas .t .m, html.glas .leer { color:rgba(255,255,255,.7) !important; } html.glas .tag.heute { color:#5eead4 !important; }
</style>

<body>
<header><h1 style="display:flex;gap:6px;align-items:center">📅 <button class="an" id="rKal">Kalender</button><button class="leicht" id="rAntr">📝 Anträge</button></h1>
  <div class="leiste" id="kalLeiste">
    <select id="wer" title="Wessen Kalender"></select>
    <button class="leicht" id="zur">‹</button><b id="titel" style="min-width:120px;text-align:center"></b><button class="leicht" id="vor">›</button>
    <button class="leicht" id="heute">Heute</button>
    <button id="ansTag">Tag</button><button id="ansWoche">Woche</button>
    <span style="flex:1"></span>
    <button class="leicht" id="neu">＋ Termin</button><button class="leicht" id="raum">🚪 Raum buchen</button>
  </div>
</header>
<main id="inhalt"><div class="leer">Lädt …</div></main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/kal";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = { holen: () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } }, setzen: t => { try { t ? localStorage.setItem("swBueroAusweis", t) : localStorage.removeItem("swBueroAusweis"); } catch {} } };
const iso = d => d.toLocaleDateString("sv-SE"), heuteIso = () => iso(new Date());
const S = { ansicht: "tag", auswahl: null, monat: [], basis: new Date(), wer: "", personen: [], daten: null, form: null };
async function api(pfad, opt = {}) {
  const r = await fetch(API + pfad, { ...opt, headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis.holen(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && /ausweis/.test(d.error || "")) { ausweis.setzen(""); throw new Error("ausweis"); }
  if (!r.ok) throw new Error(d.error || "Fehler"); return d;
}
function anmelden(meldung) {
  let ben = ""; try { ben = localStorage.getItem("swSchlossBenutzer") || ""; } catch {}
  $("inhalt").innerHTML = `<div class="box"><b>Kurz anmelden</b><div class="leer">Damit du deinen Kalender siehst.</div>
    <label>Benutzername oder E-Mail</label><input id="ben" value="${esc(ben)}" style="width:100%"><label>Büro-Passwort oder PIN</label><input id="pin" type="password" style="width:100%">
    <div class="fehler" id="fe">${esc(meldung || "")}</div><button id="los" style="margin-top:8px">Weiter</button></div>`;
  $("los").onclick = async () => {
    try { const r = await fetch("https://swdigitaltest.de/buero-praesenz/ausweis", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: $("ben").value.trim(), pin: $("pin").value, pause: true }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Fehler"); ausweis.setzen(d.token); start(); }
    catch (e) { $("fe").textContent = e.message; }
  };
}
function zeitraum() {
  const b = new Date(S.basis);
  if (S.ansicht === "tag") return [new Date(b), new Date(b)];
  const von = new Date(b); von.setDate(b.getDate() - ((b.getDay() + 6) % 7)); const bis = new Date(von); bis.setDate(von.getDate() + 4); return [von, bis];
}
async function laden() {
  const [von, bis] = zeitraum();
  $("titel").textContent = S.ansicht === "tag" ? von.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })
    : von.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + "–" + bis.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  $("ansTag").className = S.ansicht === "tag" ? "an" : "leicht"; $("ansWoche").className = S.ansicht === "woche" ? "an" : "leicht";
  try {
    S.daten = await api("/kalender/" + encodeURIComponent(S.wer) + "/termine?von=" + iso(von) + "&bis=" + iso(bis));
    // Punkte im Mini-Monat: Tage mit Terminen im angezeigten Monat
    const b = new Date(S.basis), mv = iso(new Date(b.getFullYear(), b.getMonth(), 1)), mb = iso(new Date(b.getFullYear(), b.getMonth() + 1, 0));
    if (S.ansicht === "tag") { const m = await api("/kalender/" + encodeURIComponent(S.wer) + "/termine?von=" + mv + "&bis=" + mb); const tage = new Set();
      m.termine.forEach(t => { for (let x = new Date(t.datum + "T12:00:00"); iso(x) <= (t.bis || t.datum); x.setDate(x.getDate() + 1)) tage.add(iso(x)); }); S.monat = [...tage]; }
  }
  catch (e) { if (e.message === "ausweis") return anmelden("Bitte kurz neu anmelden."); $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; return; }
  zeichnen();
}
function terminHtml(t) {
  const zeit = t.ganztag ? "ganztägig" : (t.von || "") + "–" + (t.ende || "");
  const cls = t.besetzt ? "besetzt" : t.quelle === "google" ? "google" : "";
  return `<div class="t ${cls}" data-id="${esc(t.id)}"><div class="z">${esc(zeit)}</div><div><div class="ti">${esc(t.titel || "Termin")}</div>${t.ort ? `<div class="m">📍 ${esc(t.ort)}</div>` : ""}${t.privat ? '<div class="m">🔒 privat</div>' : ""}</div></div>`;
}
// ---- Tag-Ansicht (10.10.2026, Sam: Layout 1): Mini-Monat links (Tag wählen, Punkt = Termine), Stundenraster mit Blöcken
// in echter Länge, Details rechts (Klick auf einen Termin) ----
const RASTER_AB = 7, RASTER_BIS = 20, PX_STD = 44;
const minVon = z => { const m = /^(\d{1,2}):(\d{2})/.exec(z || ""); return m ? +m[1] * 60 + +m[2] : null; };
const dauerText = (a, b) => { const m = minVon(b) - minVon(a); if (!(m > 0)) return ""; return m < 60 ? m + " Min" : (m % 60 ? Math.floor(m / 60) + " Std " + (m % 60) + " Min" : m / 60 + " Std"); };
function miniMonat() {
  const b = new Date(S.basis), erster = new Date(b.getFullYear(), b.getMonth(), 1), tage = new Date(b.getFullYear(), b.getMonth() + 1, 0).getDate();
  const leer = (erster.getDay() + 6) % 7, mitTermin = new Set(S.monat || []);
  let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button class="leicht" data-mm="-1" style="padding:2px 8px">‹</button><b style="font-size:12.5px">${erster.toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</b><button class="leicht" data-mm="1" style="padding:2px 8px">›</button></div>`;
  h += '<div class="mini">' + ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"].map(x => `<span class="wt">${x}</span>`).join("") + "<span></span>".repeat(leer);
  for (let t = 1; t <= tage; t++) { const d = iso(new Date(b.getFullYear(), b.getMonth(), t)), cls = [d === iso(S.basis) ? "gew" : "", d === heuteIso() ? "heute" : "", mitTermin.has(d) ? "punkt" : ""].join(" ");
    h += `<span class="${cls}" data-tag="${d}">${t}</span>`; }
  return h + "</div>";
}
function rasterHtml(tag) {
  const d = S.daten, l = d.termine.filter(t => t.datum <= tag && (t.bis || t.datum) >= tag);
  const ganz = l.filter(t => t.ganztag || t.datum < tag || (t.bis || t.datum) > tag), zeit = l.filter(t => !ganz.includes(t));
  // Überschneidungen nebeneinander: einfache Spalten-Verteilung
  const sort = zeit.map(t => ({ t, a: Math.max(minVon(t.von) ?? 0, RASTER_AB * 60), e: Math.max((minVon(t.ende) ?? 0), (minVon(t.von) ?? 0) + 15) })).sort((x, y) => x.a - y.a);
  // Gruppen sich überschneidender Termine; nur innerhalb einer Gruppe nebeneinander (sonst volle Breite)
  let gruppe = [], gruppeEnde = -1, spalten = [];
  const abschliessen = () => { gruppe.forEach(x => { x.n = Math.max(1, spalten.length); }); gruppe = []; spalten = []; };
  sort.forEach(x => { if (x.a >= gruppeEnde) abschliessen(); let s = spalten.findIndex(ende => ende <= x.a); if (s < 0) { s = spalten.length; spalten.push(0); }
    spalten[s] = x.e; x.s = s; gruppe.push(x); gruppeEnde = Math.max(gruppeEnde, x.e); });
  abschliessen();
  let h = ganz.length ? '<div style="margin-bottom:6px">' + ganz.map(t => `<div class="blk ${t.besetzt ? "besetzt" : t.quelle === "google" ? "google" : ""}${S.auswahl === t.id ? " gew" : ""}" data-id="${esc(t.id)}" style="position:static;margin-bottom:3px">ganztägig · ${esc(t.titel)}</div>`).join("") + "</div>" : "";
  h += `<div class="raster" style="height:${(RASTER_BIS - RASTER_AB) * PX_STD}px">`;
  for (let s = RASTER_AB; s < RASTER_BIS; s++) h += `<div class="std" style="top:${(s - RASTER_AB) * PX_STD}px">${String(s).padStart(2, "0")}:00</div>`;
  if (tag === heuteIso()) { const j = new Date(), m = j.getHours() * 60 + j.getMinutes(); if (m >= RASTER_AB * 60 && m < RASTER_BIS * 60) h += `<div class="jetzt" style="top:${(m - RASTER_AB * 60) / 60 * PX_STD}px"></div>`; }
  sort.forEach(x => { const top = (x.a - RASTER_AB * 60) / 60 * PX_STD, hoehe = Math.max(18, (x.e - x.a) / 60 * PX_STD - 2), t = x.t;
    h += `<div class="blk ${t.besetzt ? "besetzt" : t.quelle === "google" ? "google" : ""}${S.auswahl === t.id ? " gew" : ""}" data-id="${esc(t.id)}" style="top:${top}px;height:${hoehe}px;left:calc(46px + (100% - 50px) * ${x.s / x.n});width:calc((100% - 50px) / ${x.n} - 3px)"><b>${esc(t.von)}–${esc(t.ende)}</b> ${esc(t.titel || "Termin")}${t.ort && hoehe > 30 ? `<div class="m">📍 ${esc(t.ort)}</div>` : ""}</div>`; });
  return h + "</div>";
}
function detailHtml() {
  const d = S.daten, t = d.termine.find(x => x.id === S.auswahl);
  if (!t) return '<div class="leer">Termin anklicken, um Details zu sehen.</div>';
  const datum = new Date(t.datum + "T12:00:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" })
    + (t.bis && t.bis !== t.datum ? " – " + new Date(t.bis + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) : "");
  const zeit = t.ganztag ? "ganztägig" : t.von + "–" + t.ende + (dauerText(t.von, t.ende) ? " (" + dauerText(t.von, t.ende) + ")" : "");
  let h = `<b style="font-size:15px">${esc(t.titel || "Termin")}</b><div class="leer" style="margin:3px 0 8px">${esc(datum)} · ${esc(zeit)}</div>`;
  if (t.besetzt) return h + '<div class="leer">Details sind für dich nicht freigegeben.</div>';
  if (t.ort) h += `<div style="margin-bottom:4px">📍 ${esc(t.ort)}</div>`;
  if (t.erstelltVon) h += `<div style="margin-bottom:4px">👤 eingetragen von ${esc(t.erstelltVon)}</div>`;
  if (t.quelle === "google") h += '<div style="margin-bottom:4px">🔁 aus dem Google-Kalender</div>';
  if (t.privat) h += '<div style="margin-bottom:4px">🔒 privat (andere sehen nur „Besetzt“)</div>';
  if (t.notiz) h += `<div style="margin:6px 0;white-space:pre-wrap;font-size:13px">${esc(t.notiz)}</div>`;
  h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' + (d.darfEintragen ? '<button id="dAendern">✎ Ändern</button><button class="leicht" id="dLoesch" style="color:#b91c1c;border-color:#b91c1c">🗑</button>' : "")
    + (t.ort ? '<button class="leicht" id="dHin">🚶 Hingehen</button>' : "") + "</div>";
  return h;
}
function zeichnen() {
  const d = S.daten, [von, bis] = zeitraum(), tage = [];
  for (let t = new Date(von); t <= bis; t.setDate(t.getDate() + 1)) tage.push(iso(t));
  const amTag = tag => d.termine.filter(t => t.datum <= tag && (t.bis || t.datum) >= tag);
  const spalte = tag => { const l = amTag(tag), dt = new Date(tag + "T12:00:00");
    return `<div><div class="tag ${tag === heuteIso() ? "heute" : ""}" data-tagkopf="${tag}" style="cursor:pointer" title="Tag öffnen">${dt.toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" })}</div>${l.length ? l.map(terminHtml).join("") : '<div class="leer">frei</div>'}</div>`; };
  let h = S.wer !== S.personen[0]?.id ? `<div class="leer" style="margin-bottom:6px">Kalender von <b>${esc(d.besitzer)}</b> · ${d.darfEintragen ? "du darfst eintragen" : d.stufe === "details" ? "du siehst Details" : "du siehst nur „Besetzt“"}</div>` : "";
  h += S.ansicht === "tag" ? `<div class="drei"><div class="box">${miniMonat()}</div><div class="box">${rasterHtml(tage[0])}</div><div class="box" id="detail">${detailHtml()}</div></div>`
    : `<div class="woche">${tage.map(spalte).join("")}</div>`;
  if (S.form) h = formHtml() + h;
  $("inhalt").innerHTML = h;
  $("neu").style.display = d.darfEintragen ? "" : "none";
  // Klick auf Termin: Tag-Ansicht → Details rechts; Woche → in den Tag springen und Details zeigen
  document.querySelectorAll("[data-id]").forEach(el => el.onclick = () => { const t = d.termine.find(x => x.id === el.dataset.id); if (!t) return;
    S.auswahl = t.id; if (S.ansicht !== "tag") { S.ansicht = "tag"; S.basis = new Date(t.datum + "T12:00:00"); laden(); } else zeichnen(); });
  document.querySelectorAll("[data-tagkopf]").forEach(el => el.onclick = () => { S.ansicht = "tag"; S.basis = new Date(el.dataset.tagkopf + "T12:00:00"); laden(); });
  document.querySelectorAll("[data-tag]").forEach(el => el.onclick = () => { S.basis = new Date(el.dataset.tag + "T12:00:00"); S.auswahl = null; laden(); });
  document.querySelectorAll("[data-mm]").forEach(el => el.onclick = () => { const b = new Date(S.basis); b.setDate(1); b.setMonth(b.getMonth() + +el.dataset.mm); S.basis = b; S.auswahl = null; laden(); });
  const t = d.termine.find(x => x.id === S.auswahl);
  if ($("dAendern")) $("dAendern").onclick = () => { S.form = { art: "termin", t }; zeichnen(); };
  if ($("dLoesch")) $("dLoesch").onclick = async () => { if (!confirm("Termin löschen?")) return; try { await api("/kalender/termine/" + encodeURIComponent(t.id), { method: "DELETE" }); S.auswahl = null; laden(); } catch (e) { alert(e.message); } };
  if ($("dHin")) $("dHin").onclick = () => { try { WA.player.state.saveVariable("swAktion", { was: "zuRaum", name: t.ort, t: Date.now() }, { public: false, persist: false }); } catch {} };
  formAktivieren();
}
function formHtml() {
  const f = S.form;
  if (f.art === "raum") return `<div class="box"><b>🚪 Raum buchen</b>
    <label>Raum</label><select id="fRaum" style="width:100%">${(f.raeume || []).map(r => `<option>${esc(r)}</option>`).join("")}</select>
    <div class="reihe3"><div><label>Datum</label><input id="fDatum" type="date" value="${iso(S.basis) < heuteIso() ? heuteIso() : iso(S.basis)}" style="width:100%"></div><div><label>von</label><input id="fVon" type="time" value="10:00" style="width:100%"></div><div><label>bis</label><input id="fBis" type="time" value="11:00" style="width:100%"></div></div>
    <label>Thema</label><input id="fThema" maxlength="80" style="width:100%" placeholder="z. B. Team-Besprechung">
    <div class="fehler" id="fFe"></div><div style="display:flex;gap:6px;margin-top:8px"><button id="fOk">Buchen</button><button class="leicht" id="fAbbr">Abbrechen</button></div>
    ${(f.meine || []).length ? '<label style="margin-top:12px">Deine Buchungen</label>' + f.meine.map(r => `<div class="leer">${esc(r.datum.split("-").reverse().join("."))} ${esc(r.von)}–${esc(r.bis)} · ${esc(r.raum)} ${esc(r.thema || "")} <a href="#" data-loesch="${esc(r.id)}">löschen</a></div>`).join("") : ""}</div>`;
  const t = f.t || {};
  return `<div class="box"><b>${t.id ? "Termin ändern" : "Neuer Termin"}</b>
    <label>Titel</label><input id="fTitel" maxlength="160" value="${esc(t.titel || "")}" style="width:100%" placeholder="z. B. Mandant Müller">
    <div class="reihe3"><div><label>Datum</label><input id="fDatum" type="date" value="${esc(t.datum || iso(S.basis))}" style="width:100%"></div><div><label>von</label><input id="fVon" type="time" value="${esc(t.von || "09:00")}" style="width:100%"></div><div><label>bis</label><input id="fBis" type="time" value="${esc(t.ende || "10:00")}" style="width:100%"></div></div>
    <div class="reihe"><label style="display:flex;gap:6px;align-items:center"><input id="fGanz" type="checkbox" ${t.ganztag ? "checked" : ""}> ganztägig</label><label style="display:flex;gap:6px;align-items:center"><input id="fPrivat" type="checkbox" ${t.privat ? "checked" : ""}> privat (andere sehen nur „Besetzt“)</label></div>
    <label>Ort</label><input id="fOrt" maxlength="120" value="${esc(t.ort || "")}" style="width:100%" placeholder="z. B. Besprechung 10 oder Telefon">
    <div class="fehler" id="fFe"></div><div style="display:flex;gap:6px;margin-top:8px"><button id="fOk">Speichern</button><button class="leicht" id="fAbbr">Abbrechen</button>${t.id ? '<span style="flex:1"></span><button class="leicht" id="fLoesch" style="color:#b91c1c;border-color:#b91c1c">Löschen</button>' : ""}</div></div>`;
}
function formAktivieren() {
  if (!S.form) return;
  $("fAbbr").onclick = () => { S.form = null; zeichnen(); };
  if (S.form.art === "raum") {
    $("fOk").onclick = async () => { try { await api("/buero-reservierungen", { method: "POST", body: JSON.stringify({ raum: $("fRaum").value, datum: $("fDatum").value, von: $("fVon").value, bis: $("fBis").value, thema: $("fThema").value }) }); S.form = null; laden(); } catch (e) { $("fFe").textContent = e.message; } };
    document.querySelectorAll("[data-loesch]").forEach(a => a.onclick = async ev => { ev.preventDefault(); try { await api("/buero-reservierungen/" + encodeURIComponent(a.dataset.loesch), { method: "DELETE" }); raumForm(); } catch (e) { $("fFe").textContent = e.message; } });
    return;
  }
  const t = S.form.t || {};
  $("fOk").onclick = async () => {
    const b = { titel: $("fTitel").value, datum: $("fDatum").value, bis: $("fDatum").value, von: $("fVon").value, ende: $("fBis").value, ganztag: $("fGanz").checked, privat: $("fPrivat").checked, ort: $("fOrt").value };
    try { if (t.id) await api("/kalender/termine/" + encodeURIComponent(t.id), { method: "PUT", body: JSON.stringify(b) }); else await api("/kalender/" + encodeURIComponent(S.wer) + "/termine", { method: "POST", body: JSON.stringify(b) });
      S.form = null; laden(); } catch (e) { $("fFe").textContent = e.message; }
  };
  if ($("fLoesch")) $("fLoesch").onclick = async () => { if (!confirm("Termin löschen?")) return; try { await api("/kalender/termine/" + encodeURIComponent(t.id), { method: "DELETE" }); S.form = null; laden(); } catch (e) { $("fFe").textContent = e.message; } };
}
async function raumForm() {
  try { const [raeume, alle] = await Promise.all([api("/buero-raeume"), api("/buero-reservierungen")]);
    const ich = S.personen[0] ? S.personen[0].name : "";
    S.form = { art: "raum", raeume: raeume.filter(r => !/^Büro /.test(r)), meine: alle.filter(r => r.name === ich) }; zeichnen(); }
  catch (e) { if (e.message === "ausweis") return anmelden(); alert(e.message); }
}
// ===== Anträge (10.10.2026, Sam: Layout A „Reiter im Kalender“) — dieselben Anträge wie im Dashboard, nur die eigenen =====
const API_ANTR = "https://swdigitaltest.de/buero-praesenz/antr";
const ARTEN = { urlaub: "🏖️ Urlaub", krankmeldung: "🤒 Krank", ueberstunden: "⏱️ Überstunden", homeoffice: "🏠 Home-Office" };
const A = { form: null, liste: [], konto: null };
async function apiAntr(pfad, opt = {}) {
  const h = { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis.holen(), "X-Buero-Name": encodeURIComponent(window.__waName || "") };
  if (!(opt.body instanceof FormData)) h["Content-Type"] = "application/json";
  const r = await fetch(API_ANTR + pfad, { ...opt, headers: h });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && /ausweis/.test(d.error || "")) { ausweis.setzen(""); throw new Error("ausweis"); }
  if (!r.ok) throw new Error(d.error || "Fehler"); return d;
}
const dDE = s => s ? String(s).slice(0, 10).split("-").reverse().join(".") : "";
function reiter(n) {
  S.reiter = n; $("rKal").className = n === "kal" ? "an" : "leicht"; $("rAntr").className = n === "antr" ? "an" : "leicht";
  $("kalLeiste").style.display = n === "kal" ? "" : "none";
  if (n === "kal") laden(); else antrLaden();
}
async function antrLaden() {
  $("inhalt").innerHTML = '<div class="leer">Lädt …</div>';
  try { [A.liste, A.konto] = await Promise.all([apiAntr("/meine"), apiAntr("/urlaub/konto")]); }
  catch (e) { if (e.message === "ausweis") return anmelden("Bitte kurz neu anmelden."); $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; return; }
  antrZeichnen();
}
const zahl = n => String(Math.round(n * 10) / 10).replace(".", ",");
function antrZeile(a) {
  const art = a.art === "standort" ? (a.typ === "standort" ? "📍 " + (a.standortName || "Standort") : ARTEN.homeoffice) : (ARTEN[a.typ] || (a.typ === "minusstunden" ? "⏱️ Minusstunden" : a.typ));
  const zeit = dDE(a.von) + (a.bis && a.bis !== a.von ? " – " + dDE(a.bis) : "");
  const umfang = a.stunden ? zahl(a.stunden) + " Std" : a.halb ? "½ Tag" : "";
  const st = a.status === "genehmigt" ? (a.typ === "krankmeldung" ? "zur Kenntnis" : "genehmigt") : a.status === "abgelehnt" ? "abgelehnt" : "offen";
  return `<div class="antr"><div><b>${esc(art)}</b> · ${esc(zeit)}${umfang ? " · " + esc(umfang) : ""}${a.datei ? " · 📎" : ""}
    ${a.notiz || a.kommentar ? `<div class="leer" style="padding:2px 0 0">${esc(a.notiz || a.kommentar)}</div>` : ""}${a.entscheidKommentar ? `<div class="leer" style="padding:2px 0 0">💬 ${esc(a.entscheidKommentar)}</div>` : ""}</div>
    <span class="st ${esc(a.status || "offen")}">${esc(st)}</span></div>`;
}
function antrFormHtml() {
  const f = A.form, h = heuteIso();
  let x = `<div class="box"><b>Neuer Antrag</b><div class="arten" style="margin-top:8px">${Object.entries(ARTEN).map(([k, v]) => `<button data-art="${k}" class="${f.art === k ? "an" : ""}">${v}</button>`).join("")}</div>`;
  const einTag = f.art === "ueberstunden" || f.umfang === "stunden";
  x += `<div class="reihe"><div><label>${einTag ? "Tag" : "von"}</label><input id="aVon" type="date" value="${esc(f.von || h)}" style="width:100%"></div>${einTag ? "<div></div>" : `<div><label>bis</label><input id="aBis" type="date" value="${esc(f.bis || f.von || h)}" style="width:100%"></div>`}</div>`;
  if (f.art === "urlaub") x += `<label>Umfang</label><select id="aUmfang" style="width:100%"><option value="ganz">ganze Tage</option><option value="halb" ${f.umfang === "halb" ? "selected" : ""}>½ Tag</option><option value="stunden" ${f.umfang === "stunden" ? "selected" : ""}>stundenweise (ein Tag)</option></select>`;
  if (f.art === "krankmeldung") x += `<label style="display:flex;gap:6px;align-items:center"><input id="aHalb" type="checkbox" ${f.umfang === "halb" ? "checked" : ""}> nur ½ Tag</label><label>Nachweis (optional, Bild oder PDF, max. 5 MB)</label><input id="aDatei" type="file" accept="image/*,application/pdf" style="width:100%">`;
  if (f.art === "ueberstunden" || f.umfang === "stunden") x += `<label>Stunden</label><input id="aStd" type="number" min="0.5" max="${f.art === "ueberstunden" ? 8 : 7.5}" step="0.5" value="${esc(f.stunden || "")}" style="width:100%" placeholder="z. B. 2,5">
    ${f.art === "ueberstunden" ? '<div class="leer">Überstunden abfeiern – geht nur mit Guthaben aus der Zeiterfassung, max. 8 Std pro Tag.</div>' : ""}`;
  x += `<label>Notiz (optional)</label><input id="aNotiz" maxlength="500" style="width:100%" value="${esc(f.notiz || "")}">
    <div class="fehler" id="aFe"></div><div style="display:flex;gap:6px;margin-top:8px"><button id="aOk">Beantragen</button><button class="leicht" id="aAbbr">Abbrechen</button></div></div>`;
  return x;
}
function antrZeichnen() {
  const k = A.konto || {};
  let h = `<div class="konto"><div><b>${zahl(k.kontingent || 0)}</b><small>Urlaub ${esc(k.jahr || "")}</small></div><div><b>${zahl(k.genommen || 0)}</b><small>genommen</small></div><div><b>${zahl(k.rest || 0)}</b><small>Rest</small></div></div>`;
  h += A.form ? antrFormHtml() : '<button id="aNeu" style="width:100%;padding:10px;margin-bottom:10px">＋ Neuer Antrag</button>';
  h += `<div class="box"><b>Meine Anträge</b><div style="margin-top:6px">${A.liste.length ? A.liste.map(antrZeile).join("") : '<div class="leer">Noch keine Anträge.</div>'}</div></div>
    <div class="leer">Genehmigt wird wie bisher von der Verwaltung – du bekommst eine Meldung, sobald entschieden ist.</div>`;
  $("inhalt").innerHTML = h;
  if ($("aNeu")) $("aNeu").onclick = () => { A.form = { art: "urlaub", umfang: "ganz" }; antrZeichnen(); };
  if (!A.form) return;
  const merken = () => { const f = A.form; f.von = $("aVon").value; if ($("aBis")) f.bis = $("aBis").value; if ($("aUmfang")) f.umfang = $("aUmfang").value;
    if ($("aHalb")) f.umfang = $("aHalb").checked ? "halb" : "ganz"; if ($("aStd")) f.stunden = $("aStd").value; f.notiz = $("aNotiz").value; };
  document.querySelectorAll("[data-art]").forEach(b => b.onclick = () => { merken(); A.form.art = b.dataset.art; A.form.umfang = "ganz"; antrZeichnen(); });
  if ($("aUmfang")) $("aUmfang").onchange = () => { merken(); antrZeichnen(); };
  $("aAbbr").onclick = () => { A.form = null; antrZeichnen(); };
  $("aOk").onclick = async () => {
    merken(); const f = A.form, k = $("aOk"); $("aFe").textContent = "";
    const von = f.von, bis = (f.art === "ueberstunden" || f.umfang === "stunden") ? f.von : (f.bis || f.von);
    if (!von) return $("aFe").textContent = "Bitte ein Datum wählen.";
    if (bis < von) return $("aFe").textContent = "„bis“ liegt vor „von“.";
    if ((f.art === "ueberstunden" || f.umfang === "stunden") && !(parseFloat(String(f.stunden).replace(",", ".")) > 0)) return $("aFe").textContent = "Bitte die Stunden eintragen.";
    k.disabled = true;
    try {
      if (f.art === "homeoffice") await apiAntr("/standort-antraege", { method: "POST", body: JSON.stringify({ typ: "homeoffice", von, bis, kommentar: f.notiz || "" }) });
      else {
        const fd = new FormData(); fd.append("typ", f.art); fd.append("von", von); fd.append("bis", bis); fd.append("notiz", f.notiz || "");
        if (f.umfang === "halb") fd.append("halb", "true");
        if (f.art === "ueberstunden" || f.umfang === "stunden") fd.append("stunden", String(f.stunden).replace(",", "."));
        const datei = $("aDatei") && $("aDatei").files[0]; if (datei) fd.append("datei", datei);
        await apiAntr("/antraege", { method: "POST", body: fd });
      }
      A.form = null; await antrLaden();
    } catch (e) { k.disabled = false; if (e.message === "ausweis") return anmelden("Bitte kurz neu anmelden."); $("aFe").textContent = e.message; }
  };
}
async function start() {
  if (!ausweis.holen()) return anmelden();
  try { S.personen = await api("/kalender/personen"); }
  catch (e) { if (e.message === "ausweis") return anmelden("Bitte kurz neu anmelden."); $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; return; }
  // Gehört der gespeicherte Büro-Ausweis zur Person, die gerade im Büro ist? (10.10., Minz sah am gemeinsamen Rechner Sams Kalender)
  try {
    for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100));
    await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 3000))]);
    const imBuero = String((WA.player && WA.player.name) || "").trim().toLowerCase(), ausweisName = String(S.personen[0].name || "").trim().toLowerCase();
    if (imBuero && ausweisName && imBuero !== ausweisName && imBuero.split(/\s+/)[0] !== ausweisName.split(/\s+/)[0]) {
      ausweis.setzen(""); return anmelden("Der gespeicherte Ausweis gehört " + S.personen[0].name + " – bitte melde dich mit deinem eigenen Konto an.");
    }
  } catch { /* ohne Büro-Schnittstelle: weiter wie bisher */ }
  S.wer = S.personen[0].id;
  $("wer").innerHTML = S.personen.map((p, i) => `<option value="${esc(p.id)}">${i === 0 ? "Mein Kalender" : esc(p.name) + (p.stufe === "eintragen" ? " ✎" : p.stufe === "details" ? "" : " (nur Besetzt)")}</option>`).join("");
  $("wer").onchange = () => { S.wer = $("wer").value; S.form = null; laden(); };
  const schieb = n => { const b = new Date(S.basis); b.setDate(b.getDate() + n * (S.ansicht === "tag" ? 1 : 7)); S.basis = b; laden(); };
  $("zur").onclick = () => schieb(-1); $("vor").onclick = () => schieb(1);
  $("heute").onclick = () => { S.basis = new Date(); laden(); };
  $("ansTag").onclick = () => { S.ansicht = "tag"; laden(); }; $("ansWoche").onclick = () => { S.ansicht = "woche"; laden(); };
  $("neu").onclick = () => { S.form = { art: "termin", t: null }; zeichnen(); };
  $("raum").onclick = raumForm;
  $("rKal").onclick = () => reiter("kal"); $("rAntr").onclick = () => reiter("antr");
  // direkt in die Anträge springen: kalender.html?reiter=antraege (z. B. aus einer Meldung)
  if (new URLSearchParams(location.search).get("reiter") === "antraege") reiter("antr"); else laden();
}
start();
</script>
