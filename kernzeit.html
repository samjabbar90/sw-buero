<style>

  .st.ok { background:#dcfce7; color:#166534; } .st.offen { background:#fef3c7; color:#92400e; } .st.rot { background:#fee2e2; color:#b91c1c; }
  .pk .tx { flex:1; min-width:0; } .pk .q { font-size:11px; color:#64748b; } .pk .f { font-size:11.5px; color:#64748b; white-space:nowrap; }
  .fknoepfe { display:flex; gap:8px; } .fknoepfe button { flex:1; } button.grau { background:#3f4651; border-color:#3f4651; } button.warnk { background:#b45309; border-color:#b45309; }
  .ut { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; } .ut td, .ut th { padding:4px 6px; text-align:left; } .ut th { font-size:11px; color:#64748b; } .ut tr + tr td { border-top:1px solid #f1f5f9; }

<body>
<header><h1 id="kopf">⏰ Meine Arbeitszeit</h1></header>
<main id="inhalt"><div class="leer">Lädt …</div></main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz";
const $ = id => document.getElementById(id), FEIERABEND = new URLSearchParams(location.search).has("feierabend");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = { holen: () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } }, setzen: t => { try { t ? localStorage.setItem("swBueroAusweis", t) : localStorage.removeItem("swBueroAusweis"); } catch {} } };
const std = x => { if (x == null) return "–"; const n = Math.abs(x); return (x < 0 ? "−" : "") + Math.floor(n) + ":" + String(Math.round((n % 1) * 60)).padStart(2, "0"); };
const tagDE = d => d.split("-").reverse().join(".");
async function api(pfad, opt = {}) {
  const r = await fetch(API + pfad, { ...opt, headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis.holen(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && /ausweis/.test(d.error || "")) { ausweis.setzen(""); throw new Error("ausweis"); }
  if (!r.ok) throw new Error(d.error || "Fehler"); return d;
}
function ausweisFormular(meldung) {
  $("inhalt").innerHTML = `<div class="box"><div class="titel">Kurz anmelden</div><div class="m">Damit nur du deine Arbeitszeit siehst.</div>
    <label>Benutzername oder E-Mail</label><input id="ben" autocomplete="username" value="${esc((() => { try { return localStorage.getItem("swSchlossBenutzer") || ""; } catch { return ""; } })())}">
    <label>Büro-Passwort oder PIN</label><input id="pin" type="password" autocomplete="current-password">
    <div class="fehler" id="fe">${esc(meldung || "")}</div><button id="los" style="width:100%;margin-top:8px">Weiter</button></div>`;
  $("los").onclick = async () => {
    $("los").disabled = true; $("fe").textContent = "";
    try {
      const r = await fetch(API + "/ausweis", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: $("ben").value.trim(), pin: $("pin").value, pause: true }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || (r.status === 429 ? "Zu viele Versuche – bitte 15 Minuten warten." : "Fehler"));
      ausweis.setzen(d.token); start();
    } catch (e) { $("fe").textContent = e.message; $("los").disabled = false; }
  };
}
function zeigen(d) {
  if (!d.aktiv) { $("inhalt").innerHTML = '<div class="box"><div class="titel">Keine Kernarbeitszeit hinterlegt</div><div class="m">Für dich ist keine Kernarbeitszeit eingerichtet. Schönen Feierabend!</div></div>'; return; }
  if (d.freierTag) { $("inhalt").innerHTML = '<div class="box gruen"><div class="titel">Heute ist kein Arbeitstag für dich</div><div class="m">Schönen Feierabend!</div></div>'; return; }
  const k = d.kernzeit, t = d.heute || {};
  let h;
  if (d.art === "woche") { // 16.10.2026: nur Mindeststunden pro Woche
    const w = d.woche || {}, pz = w.soll ? Math.min(100, Math.round((w.ist || 0) / w.soll * 100)) : 100;
    h = `<div class="box"><div class="titel">Diese Woche · mindestens ${std(k.wochenStd)} Std</div><div class="zahlen">
      <div class="zahl"><span>Ist</span><b>${std(w.ist)}</b></div><div class="zahl"><span>Soll diese Woche</span><b>${std(w.soll)}</b></div><div class="zahl"><span>Noch offen</span><b>${std(Math.max(0, (w.soll || 0) - (w.ist || 0)))}</b></div><div class="zahl"><span>Guthaben</span><b>${std(d.guthabenStd)}</b></div></div>
      <div style="height:8px;background:rgba(127,127,127,.2);border-radius:4px;margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:${pz}%;background:#0d9488"></i></div>
      <div class="m" style="margin-top:6px">Keine festen Zeiten – zählt nur, dass die Woche voll wird.${(w.abzug || []).length ? " Soll gesenkt: " + esc(w.abzug.join(", ")) + "." : ""}</div></div>`;
  } else h = `<div class="box"><div class="titel">Heute · Kernzeit ${esc(k.von)}–${esc(k.bis)}</div><div class="zahlen">
    <div class="zahl"><span>Kommen</span><b>${esc(t.kommen || "–")}</b></div><div class="zahl"><span>Ist / Soll</span><b>${std(t.istStd)} / ${std(t.soll != null ? t.soll : k.soll)}</b></div>
    <div class="zahl"><span>Pause</span><b>${t.pauseMin != null ? t.pauseMin : "–"} Min</b></div><div class="zahl"><span>Guthaben</span><b>${std(d.guthabenStd)}</b></div></div>
    ${t.pauseMin != null && t.pauseMin < k.pauseMin ? `<div class="m" style="margin-top:6px">☕ Pflichtpause: mindestens ${k.pauseMin} Min (Pausenraum im Büro).</div>` : ""}</div>`;
  if (d.spaetOhneGrund) {
    h += `<div class="box warn"><div class="titel">Du bist heute um ${esc(t.kommen)} gekommen (${t.spaet.min} Min nach ${esc(k.von)})</div><div class="m">Sam wurde informiert. Was war der Grund?</div>
      <div class="gruende">${["Arzt / privater Termin", "Bahn / Stau", "Mit Sam abgesprochen", "Technik-Problem"].map(g => `<button class="leicht" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <label>Oder eigener Grund</label><div style="display:flex;gap:6px"><input id="eigen" maxlength="200"><button id="eigenLos">OK</button></div><div class="fehler" id="feG"></div></div>`;
  }
  for (const o of d.offen || []) {
    const f = o.frage, tag = o.datum === new Date().toLocaleDateString("sv-SE") ? "heute" : "am " + tagDE(o.datum);
    const kopf = o.woche
      ? `<div class="titel">Wochenstunden ${tagDE(o.wocheVon)}–${tagDE(o.datum)} nicht erfüllt</div><div class="m">${std(o.wochenIst)} von ${std(o.wochenSoll)} Std · fehlen ${std(f.fehltStd)}</div>`
      : `<div class="titel">Arbeitszeit ${tag} nicht erfüllt</div><div class="m">${esc(o.kommen || "?")}–${esc(o.gehen || "?")} · ${std(o.istStd)} von ${std(o.soll)} Std · fehlen ${std(f.fehltStd)}</div>`;
    h += f.fall === 1
      ? `<div class="box warn">${kopf}<div style="margin-top:8px;font-size:14px">Du hast <b>${std(f.guthabenStd)} Std</b> Überstunden. Willst du <b>${std(f.fehltStd)} Std</b> davon nehmen?</div>
         <div class="reihe"><button data-a="ja" data-d="${o.datum}">Ja, Überstunden nehmen</button></div><div class="m" style="margin-top:6px">Es wird automatisch ein Überstunden-Antrag angelegt.</div></div>`
      : `<div class="box rot">${kopf}<div style="margin-top:8px;font-size:14px">Du hast keine Überstunden – das werden <b>${std(f.fehltStd)} Minusstunden</b>. Hast du das mit HR abgestimmt?</div>
         <div class="reihe"><button data-a="ja" data-d="${o.datum}">Ja, abgestimmt</button><button class="leicht" data-a="nein" data-d="${o.datum}">Nein</button></div></div>`;
  }
  const fr = t.frage;
  if (FEIERABEND && fr && fr.fall === 3) h += `<div class="box gruen"><div class="titel">✔ In Ordnung</div><div class="m">${esc(fr.grund)} – deine Zeit wird so angenommen. Schönen Feierabend!</div></div>`;
  else if (FEIERABEND && fr && fr.fall === 0) h += `<div class="box gruen"><div class="titel">Soll erreicht</div><div class="m">Du gehst vor Kernzeitende (${esc(k.bis)}), hast aber deine Stunden. Sam wurde informiert. Schönen Feierabend!</div></div>`;
  else if (FEIERABEND && t.gehen && !(d.offen || []).length) h += `<div class="box gruen"><div class="titel">✔ Alles erfüllt</div><div class="m">Schönen Feierabend!</div></div>`;
  h += '<div class="fehler" id="fe"></div>';
  $("inhalt").innerHTML = h;
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grund(b.dataset.g));
  if ($("eigenLos")) $("eigenLos").onclick = () => grund($("eigen").value.trim());
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    document.querySelectorAll("[data-a]").forEach(x => x.disabled = true);
    try { zeigen(await api("/kernzeit/antwort", { method: "POST", body: JSON.stringify({ datum: b.dataset.d, antwort: b.dataset.a }) })); }
    catch (e) { if (e.message === "ausweis") return ausweisFormular(); $("fe").textContent = e.message; document.querySelectorAll("[data-a]").forEach(x => x.disabled = false); }
  });
}
async function grund(g) {
  if (!g) { $("feG").textContent = "Bitte einen Grund angeben."; return; }
  try { zeigen(await api("/kernzeit/grund", { method: "POST", body: JSON.stringify({ grund: g }) })); }
  catch (e) { if (e.message === "ausweis") return ausweisFormular(); $("feG").textContent = e.message; }
}
// ===== Feierabend F1 (14.10.2026, Sam): Zeit + Aufgaben mit Frist heute, „Büro verlassen“ mit Hinweis/Grund/Begründungen =====
let FS = null, UE = null;
// ===== Überstunden (14.10.2026, Sam: 1A–1D / 2A–2C) =====
const hm = m => (m < 0 ? "−" : "") + Math.floor(Math.abs(m) / 60) + ":" + String(Math.round(Math.abs(m) % 60)).padStart(2, "0");
function ueKasten() {
  const h = UE && UE.heute; if (!h || !h.aktiv || !h.ueberMin) return "";
  if (h.beantragt) return `<div class="box gruen"><div class="titel">➕ Überstunden heute: +${hm(h.beantragt.minuten)}</div><div class="m">${h.beantragt.status === "genehmigt" ? "✔ bestätigt – ist auf deinem Konto" : h.beantragt.status === "abgelehnt" ? "✖ abgelehnt" : "⏳ beantragt – wartet auf Bestätigung"}</div></div>`;
  const tab = `<table class="ut"><tr><th></th><th>System</th><th>DATEV</th></tr><tr><td>Ist heute</td><td>${hm(h.sysMin)}</td><td>${h.datevMin != null ? hm(h.datevMin) : "–"}</td></tr></table>`;
  if (h.datevFehler) return `<div class="box warn"><div class="titel">➕ Überstunden heute: +${hm(h.ueberMin)}</div><div class="m">${esc(h.datevFehler)}</div><div class="uk"><button class="grau" id="ueNeu">↻ Neu prüfen</button></div></div>`;
  if (!h.ok) return `<div class="box rot"><div class="titel">⚠ Zeiten stimmen nicht überein</div>${tab}<div style="color:#b91c1c;font-weight:700;margin-top:6px">✖ ${h.abw} Min Abweichung zwischen System und DATEV</div>
    <div class="m" style="margin-top:4px">Bitte die Zeit in DATEV nachtragen oder an HR melden. Überstunden (+${hm(h.ueberMin)}) kannst du erst beantragen, wenn beides passt.</div>
    <div class="uk"><button class="grau" id="ueNeu">↻ Neu prüfen</button><button class="warnk" id="ueHr">Korrektur an HR melden</button></div></div>`;
  return `<div class="box gruen"><div class="titel">➕ Überstunden heute</div><div class="gross">+${hm(h.ueberMin)} Std</div>${tab}<div style="color:#166534;font-weight:700;margin-top:6px">✔ Abgleich in Ordnung – ${h.abw} Min Abweichung</div>
    <div class="uk"><button id="ueAntrag">Überstunden beantragen (+${hm(h.ueberMin)})</button></div><div class="m" style="margin-top:4px">Auf dein Konto (jetzt ${hm(UE.konto)}) kommen sie, sobald deine Vorgesetzten bestätigen.</div></div>`;
}
function ueKnoepfe(neuZeichnen) {
  if ($("ueNeu")) $("ueNeu").onclick = async () => { $("ueNeu").disabled = true; try { UE = await api("/kernzeit/ueberstunden"); } catch (e) {} neuZeichnen(); };
  if ($("ueHr")) $("ueHr").onclick = async () => { $("ueHr").disabled = true; try { await api("/kernzeit/ueberstunden-korrektur", { method: "POST" }); $("ueHr").textContent = "✔ an HR gemeldet"; } catch (e) { alert(e.message); $("ueHr").disabled = false; } };
  if ($("ueAntrag")) $("ueAntrag").onclick = async () => { $("ueAntrag").disabled = true; try { await api("/kernzeit/ueberstunden-beantragen", { method: "POST" }); UE = await api("/kernzeit/ueberstunden"); neuZeichnen(); } catch (e) { alert(e.message); $("ueAntrag").disabled = false; } };
}
// „Meine Arbeitszeit“: Konto, Überstundenabbau beantragen, Verlauf
async function ueBereich() {
  try { UE = await api("/kernzeit/ueberstunden"); } catch (e) { return; }
  const morgen = new Date(Date.now() + 864e5).toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });
  const art = e => e.art === "plus" ? "Überstunden" : "Überstundenabbau " + esc(e.von) + "–" + esc(e.bis) + (e.ausnahme ? " (Ausnahme)" : "");
  const st = e => e.status === "genehmigt" ? (e.art === "plus" ? "✔ bestätigt" : "✔ genehmigt") : e.status === "abgelehnt" ? "✖ abgelehnt" : "⏳ offen";
  const h = `<div class="box" id="ueBox"><div class="titel">⏱ Überstundenkonto</div><div class="gross">${hm(UE.konto)} Std</div>${UE.beantragtAbbau ? '<div class="m">davon schon für Abbau beantragt: ' + hm(UE.beantragtAbbau) + "</div>" : ""}
    <div class="titel" style="margin-top:12px">➖ Überstundenabbau beantragen</div><div class="m">Mindestens 12 Stunden vorher. Nach der Genehmigung gibt es im Zeitraum keine Kernzeit-Meldung.</div>
    <div style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:6px"><div><label style="margin-top:0">Tag</label><input type="date" id="abTag" value="${morgen}"></div><div><label style="margin-top:0">von</label><input type="time" id="abVon" value="15:00"></div><div><label style="margin-top:0">bis</label><input type="time" id="abBis" value="17:00"></div></div>
    <div class="fehler" id="abFe"></div><button id="abLos" style="width:100%;margin-top:8px">Beantragen</button>
    ${(UE.verlauf || []).length ? '<div class="titel" style="margin-top:12px">Verlauf</div>' + UE.verlauf.slice(0, 12).map(e => '<div class="m" style="display:flex;gap:8px;padding:3px 0"><span style="flex:1">' + tagDE(e.datum) + " · " + art(e) + '</span><b style="color:' + (e.art === "plus" ? "#166534" : "#b91c1c") + '">' + (e.art === "plus" ? "+" : "−") + hm(e.minuten) + "</b><span>" + st(e) + "</span></div>").join("") : ""}</div>`;
  const alt = $("ueBox"); if (alt) alt.remove(); $("inhalt").insertAdjacentHTML("beforeend", h);
  $("abLos").onclick = async () => { $("abLos").disabled = true; $("abFe").textContent = "";
    try { await api("/kernzeit/abbau", { method: "POST", body: JSON.stringify({ datum: $("abTag").value, von: $("abVon").value, bis: $("abBis").value }) }); ueBereich(); }
    catch (e) { $("abFe").textContent = e.message; $("abLos").disabled = false; } };
}
const jetztMin = () => { const t = new Date().toLocaleTimeString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" }).split(":"); return +t[0] * 60 + +t[1]; };
const minVon = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : null; };
async function fensterZu() { try { const alle = await WA.ui.website.getAll(); const me = alle.find(w => String(w.url || "").split("#")[0] === location.href.split("#")[0]); if (me) me.close(); } catch (e) { /* außerhalb des Büros */ } }
function aufgabeHtml(a) {
  const b = minVon(a.bis), ueber = !a.erledigt && b !== null && b <= jetztMin();
  return `<div class="pk"><span class="st ${a.erledigt ? "ok" : ueber ? "rot" : "offen"}">${a.erledigt ? "✓" : ueber ? "!" : "○"}</span><div class="tx">${esc(a.text)}<div class="q">${esc(a.quelle)}${a.erklaert ? " · erklärt: " + esc(a.erklaert) : ""}</div></div><span class="f"${ueber ? ' style="color:#b91c1c"' : ""}>${a.bis ? (ueber ? "seit " : "bis ") + esc(a.bis) : "heute"}</span></div>`;
}
function feierabendZeigen() {
  const s = FS, z = s.zeit, offen = s.aufgaben.filter(a => !a.erledigt);
  let h = "";
  if (z) {
    const soll = Number(z.soll) || 0, pz = soll ? Math.min(100, Math.round((Number(z.istStd) || 0) / soll * 100)) : 100;
    h += `<div class="box"><div class="titel">⏱ Zeit heute</div><div class="fz"><div><b>${esc(z.kommen || "–")}</b><span>gekommen</span></div><div><b>${std(z.istStd)}</b><span>Ist / ${std(soll)} Soll</span></div><div><b${z.fruehMin > 0 ? ' style="color:#b45309"' : ""}>${esc(z.bis)}</b><span>Kernzeit bis</span></div></div>
      <div class="fb"><i style="width:${pz}%"></i></div>
      <div class="m" style="${z.fruehMin > 0 ? "color:#b45309;font-weight:600" : ""}">${z.fruehMin > 0 ? "⚠ Du gehst " + z.fruehMin + " Min vor Ende der Kernarbeitszeit" : z.entschuldigt ? "✔ " + esc(z.entschuldigt) + " – keine Kernzeit-Meldung" : "✔ Kernarbeitszeit erreicht"}</div></div>`;
  }
  h += ueKasten();
  h += `<div class="box"><div class="titel">✅ Aufgaben mit Frist heute · ${s.aufgaben.length - offen.length} von ${s.aufgaben.length}</div>${s.aufgaben.length ? s.aufgaben.map(aufgabeHtml).join("") : '<div class="m">Heute keine Aufgaben mit Frist.</div>'}</div>`;
  h += '<div class="fehler" id="fe"></div><div class="fknoepfe"><button class="grau" id="weiter">Weiterarbeiten</button><button class="warnk" id="gehen">Büro verlassen</button></div>';
  $("inhalt").innerHTML = h;
  $("weiter").onclick = fensterZu; ueKnoepfe(feierabendZeigen);
  $("gehen").onclick = () => (offen.length || (z && z.fruehMin > 0)) ? hinweisZeigen() : verlassen("", {});
}
function hinweisZeigen() {
  const s = FS, z = s.zeit, offen = s.aufgaben.filter(a => !a.erledigt), wem = (s.empfaenger || []).join(" und ") || "Sam";
  const teile = [offen.length ? "<b>" + offen.length + (offen.length === 1 ? " Aufgabe" : " Aufgaben") + " mit Frist heute</b> nicht erledigt" : "", z && z.fruehMin > 0 ? "gehst <b>" + z.fruehMin + " Min vor Ende der Kernarbeitszeit</b>" : ""].filter(Boolean).join(" und ");
  $("kopf").textContent = "⚠ Noch nicht alles erledigt";
  $("inhalt").innerHTML = `<div class="box warn"><div style="font-size:14px;line-height:1.5">Du hast ${teile}.<br>Wenn du jetzt gehst, wird das an <b>${esc(wem)}</b> weitergeleitet.</div></div>
    ${offen.length ? '<div class="box"><div class="titel">Warum kann das heute nicht erledigt werden?</div><div class="m">Optional je Aufgabe – deine Vorgesetzten können die Begründung freigeben.</div>' + offen.map(a => `<label>${esc(a.text)}</label><textarea data-k="${esc(a.key)}" maxlength="300" placeholder="Begründung"></textarea>`).join("") + "</div>" : ""}
    <div class="box"><label style="margin-top:0">Grund (Pflicht)</label><textarea id="grund" maxlength="300" placeholder="z. B. Arzttermin – Rückruf mache ich morgen früh"></textarea></div>
    <div class="fehler" id="fe"></div><div class="fknoepfe"><button class="grau" id="zurueck">Zurück</button><button class="warnk" id="trotzdem">Trotzdem gehen</button></div>`;
  $("zurueck").onclick = () => { $("kopf").textContent = "🚪 Feierabend"; feierabendZeigen(); };
  $("trotzdem").onclick = () => { const b = {}; document.querySelectorAll("textarea[data-k]").forEach(t => { if (t.value.trim()) b[t.dataset.k] = t.value.trim(); }); verlassen($("grund").value.trim(), b); };
}
async function verlassen(grund, begruendungen) {
  const k = $("trotzdem") || $("gehen"); if (k) k.disabled = true; $("fe").textContent = "";
  try {
    const d = await api("/kernzeit/feierabend-gehen", { method: "POST", body: JSON.stringify({ grund, begruendungen }) });
    try { WA.player.state.saveVariable("swFeierabendTag", new Date().toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" }), { public: false, persist: true }); } catch (e) { /* ohne Büro */ }
    const kzD = d.kernzeit, frage = kzD && (kzD.offen || []).length;
    $("kopf").textContent = "🚪 Feierabend";
    if (frage) { zeigen(kzD); $("inhalt").insertAdjacentHTML("beforeend", '<button id="raus" class="warnk" style="width:100%">Jetzt Büro verlassen</button>'); $("raus").onclick = rausGehen; return; }
    $("inhalt").innerHTML = '<div class="box gruen"><div class="titel">🌙 Schönen Feierabend!</div><div class="m">Du wirst gleich aus dem Büro abgemeldet …</div></div>';
    setTimeout(rausGehen, 1800);
  } catch (e) { if (e.message === "ausweis") return ausweisFormular("Bitte kurz neu anmelden."); $("fe").textContent = e.message; if (k) k.disabled = false; }
}
function rausGehen() { try { WA.player.state.saveVariable("swAktion", { was: "feierabendGehen", t: Date.now() }, { public: false, persist: false }); } catch (e) { /* ohne Büro */ } }
let feierabendGemacht = false;
async function start() {
  if (!ausweis.holen()) return ausweisFormular();
  try {
    let d;
    if (FEIERABEND && !feierabendGemacht) { $("kopf").textContent = "🚪 Feierabend"; [FS, UE] = await Promise.all([api("/kernzeit/feierabend-stand"), api("/kernzeit/ueberstunden").catch(() => null)]); feierabendGemacht = true; return feierabendZeigen(); } // 14.10.2026: erst ansehen, gehen per Knopf
    d = await api("/kernzeit");
    zeigen(d); if (d.aktiv && !d.freierTag) ueBereich();
  } catch (e) { if (e.message === "ausweis") return ausweisFormular("Bitte kurz neu anmelden."); $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
start();
</script>
<script>(async()=>{for(let i=0;i<50&&typeof WA==="undefined";i++)await new Promise(r=>setTimeout(r,100));try{await WA.onInit();window.__waName=WA.player.name||"";}catch(e){}})();</script>
