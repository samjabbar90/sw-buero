<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Dragon Ball</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; color-scheme:dark; }
  canvas { width:100%; height:100%; cursor:pointer; display:block; animation:glanz 4s ease-in-out infinite; }
  canvas.weg { animation:weg .5s ease-in forwards; }
  @keyframes glanz { 0%,85%,100% { filter:brightness(.9); } 92% { filter:brightness(1.35) drop-shadow(0 0 3px #fbbf24); } }
  @keyframes weg { to { transform:translateY(-60%) scale(1.6); opacity:0; } }
</style>
<script src="https://play.workadventu.re/iframe_api.js"></script>
</head>
<body>
<canvas id="c" width="96" height="96"></canvas>
<script>
// Dragon Ball auf der Karte (17.10.2026, Sam: „Dragon Balls suchen für jeden“): glänzende Kugel mit 1–7 roten Sternen,
// halb im Gras. Anklicken = finden (Spieler-Variable „swAktion“ → main.ts).
const q = new URLSearchParams(location.search), s = Math.min(7, Math.max(1, Number(q.get("s")) || 1));
const c = document.getElementById("c"), g = c.getContext("2d");
const stern = (x, y, r) => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); };
// Kugel
const gr = g.createRadialGradient(36, 34, 4, 48, 50, 40); gr.addColorStop(0, "#fff7d6"); gr.addColorStop(.25, "#fdba3b"); gr.addColorStop(.8, "#ea7a0c"); gr.addColorStop(1, "#b45309");
g.fillStyle = gr; g.beginPath(); g.arc(48, 50, 34, 0, 7); g.fill();
g.strokeStyle = "rgba(120,53,15,.6)"; g.lineWidth = 2; g.stroke();
// Sterne
const P = { 1: [[48, 52]], 2: [[38, 52], [58, 52]], 3: [[48, 40], [38, 60], [58, 60]], 4: [[38, 42], [58, 42], [38, 62], [58, 62]], 5: [[48, 34], [34, 46], [62, 46], [40, 64], [56, 64]],
  6: [[38, 36], [58, 36], [32, 52], [64, 52], [38, 68], [58, 68]], 7: [[48, 50], [48, 32], [33, 41], [63, 41], [33, 60], [63, 60], [48, 69]] }[s];
g.fillStyle = "#dc2626"; for (const [x, y] of P) stern(x, y, s > 4 ? 7 : 9);
// Glanzlicht
g.fillStyle = "rgba(255,255,255,.75)"; g.beginPath(); g.ellipse(36, 30, 9, 5, -.6, 0, 7); g.fill();
// Grasbüschel davor (halb versteckt)
g.strokeStyle = "#3f7f2e"; g.lineWidth = 3; for (let k = 0; k < 14; k++) { g.beginPath(); g.moveTo(10 + k * 6, 96); g.lineTo(8 + k * 6 + (k * 7) % 9, 70 - (k * 5) % 12); g.stroke(); }
c.title = "Dragon Ball – anklicken!";
WA.onInit().then(() => {
  c.onclick = () => { c.classList.add("weg"); c.onclick = null;
    try { WA.player.state.saveVariable("swAktion", { was: "dbFund", s, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); }
    try { window.blur(); } catch { /* egal */ } };
});
</script>
</body>
</html>
