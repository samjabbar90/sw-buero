<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Leiste</title>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<style>
  /* Daumen-Leiste unten auf dem Handy (09.10.2026, Sam: Vorschlag 3). color-scheme dark → durchsichtiger Hintergrund in Chrome/Brave */
  html, body { margin: 0; height: 100%; background: transparent; color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .leiste { height: 100%; box-sizing: border-box; display: flex; justify-content: space-around; align-items: center;
    background: rgba(20, 24, 34, .92); border: 1px solid rgba(255, 255, 255, .18); border-radius: 20px; padding: 6px 4px; }
  button { flex: 1; border: 0; background: transparent; color: rgba(255, 255, 255, .88); font: 600 10.5px system-ui, sans-serif; display: flex; flex-direction: column;
    align-items: center; gap: 4px; padding: 4px 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { transform: scale(.92); }
  .p { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; }
</style>
</head>
<body>
<div class="leiste">
  <button data-was="ideen"><span class="p" style="background:#fbbf24">💡</span>Ideen</button>
  <button data-was="karte"><span class="p" style="background:#60a5fa">🗺</span>Karte</button>
  <button data-was="zumir"><span class="p" style="background:#f87171">📍</span>Zu mir</button>
  <button data-was="reise"><span class="p" style="background:#a78bfa">🚀</span>Reise</button>
  <button data-was="news"><span class="p" style="background:#34d399">📰</span>News</button>
  <button data-was="mehr"><span class="p" style="background:#e5e7eb">⋯</span>Mehr</button>
</div>
<script>
// Jeder Knopf meldet die Aktion über die Spieler-Variable „swAktion“ — das Büro-Skript (buero-praesenz.js) führt sie aus.
// Danach den Fokus abgeben, damit Leertaste/Steuerung beim Büro bleiben.
WA.onInit().then(() => {
  document.querySelectorAll("button[data-was]").forEach(b => b.onclick = () => {
    try { WA.player.state.saveVariable("swAktion", { was: b.dataset.was, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); }
    try { b.blur(); window.blur(); } catch { /* egal */ }
  });
});
</script>
</body>
</html>
