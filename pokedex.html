<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sammlungen</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#dc2626; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:18px; } header .u { font-size:12.5px; opacity:.9; }
  .reiter { display:flex; gap:6px; margin-left:auto; } .reiter button { border:0; border-radius:8px; padding:6px 10px; font-weight:700; cursor:pointer; background:rgba(255,255,255,.2); color:#fff; }
  .reiter button.an { background:#fff; color:#dc2626; }
  main { padding:12px; }
  .gitter { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; }
  .k { background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:6px; text-align:center; position:relative; }
  .k img { width:64px; height:64px; object-fit:contain; }
  .k.nein img { filter:brightness(0) opacity(.18); } .k.leer { color:#94a3b8; }
  .k .nr { font-size:10.5px; color:#64748b; } .k .n { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .k .x { position:absolute; top:4px; right:6px; font-size:11px; font-weight:700; color:#dc2626; }
  .k .fragez { width:64px; height:64px; display:flex; align-items:center; justify-content:center; font-size:26px; color:#cbd5e1; margin:0 auto; }
  .z { display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:9px 12px; margin-bottom:8px; }
  .z.ich { border-color:#dc2626; background:#fef2f2; } .z .pl { width:30px; font-weight:800; } .z .na { flex:1; font-weight:700; } .z .w { font-weight:700; color:#dc2626; }
  .leer2 { color:#64748b; text-align:center; padding:28px 0; }
  .k .n { font-size:13.5px; } .k .nr { font-size:12px; } header .u { font-size:14px; }
  /* 18.10.2026 (Sam: „so, dass ich es lesen kann“): im dunklen Büro-Fenster (Glas) dunkle Karten mit heller Schrift */
  html.glas .k { background:rgba(10,11,14,.68) !important; border-color:rgba(255,255,255,.22) !important; color:#fff !important; }
  html.glas .k .n { color:#fff !important; } html.glas .k .nr { color:rgba(255,255,255,.75) !important; } html.glas .k .x { color:#fca5a5 !important; }
  html.glas .k.nein img { filter:brightness(0) invert(1) opacity(.28); } html.glas .k.nein .n { color:rgba(255,255,255,.55) !important; }
  html.glas .k.leer, html.glas .k .fragez { color:rgba(255,255,255,.5) !important; }
  html.glas .z { background:rgba(10,11,14,.68) !important; } html.glas .z .na { color:#fff; } html.glas .z .w { color:#fca5a5; }
  html.glas .z.ich { background:rgba(220,38,38,.3) !important; border-color:#fca5a5 !important; } html.glas .leer2 { color:rgba(255,255,255,.75); }
  /* 17.10.2026: Dragon Balls, Erfolge, Tausch */
  .reiter { flex-wrap:wrap; justify-content:flex-end; }
  .kugeln { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:6px 0 16px; } .kugel { width:56px; text-align:center; font-size:12px; font-weight:700; }
  .kugel .o { width:48px; height:48px; border-radius:50%; margin:0 auto 4px; background:radial-gradient(circle at 35% 30%, #fff7d6, #fdba3b 30%, #c2620a); color:#dc2626; display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1; flex-wrap:wrap; padding:6px; }
  .kugel.nein .o { filter:grayscale(1) opacity(.3); }
  h3 { margin:14px 0 8px; font-size:15px; } .hin { font-size:13px; color:#64748b; margin:0 0 10px; }
  .e { display:flex; align-items:center; gap:12px; background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:9px 12px; margin-bottom:8px; }
  .e .i { font-size:26px; width:34px; text-align:center; } .e.nein { opacity:.45; } .e .t1 { font-weight:800; } .e .t2 { font-size:12.5px; color:#64748b; }
  .tz { display:flex; align-items:center; gap:8px; background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:8px 10px; margin-bottom:8px; flex-wrap:wrap; }
  .tz img { width:40px; height:40px; object-fit:contain; } .tz .f { flex:1; min-width:140px; font-size:13.5px; }
  .kn { border:0; border-radius:8px; padding:6px 10px; font-weight:700; cursor:pointer; background:#dc2626; color:#fff; } .kn.grau { background:#e2e8f0; color:#0f172a; } .kn:disabled { opacity:.4; cursor:default; }
  select { padding:6px; border-radius:8px; border:1.5px solid #cbd5e1; font:inherit; max-width:100%; }
  .wahl { display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:6px; margin:6px 0 10px; }
  .wahl div { border:2px solid #e2e8f0; border-radius:8px; text-align:center; font-size:11px; cursor:pointer; padding:3px; background:#fff; } .wahl div.an { border-color:#dc2626; background:#fef2f2; }
  .wahl img { width:44px; height:44px; object-fit:contain; }
  html.glas .e, html.glas .tz, html.glas .wahl div { background:rgba(10,11,14,.68) !important; color:#fff; border-color:rgba(255,255,255,.22) !important; }
  html.glas .e .t2, html.glas .hin { color:rgba(255,255,255,.75); } html.glas .wahl div.an { border-color:#fca5a5 !important; background:rgba(220,38,38,.3) !important; }
  html.glas h3, html.glas .kugel { color:#fff; }
  /* 17.10.2026 (Sam: Layout S1 „Regal“): Startseite mit einer Kachel je Sammlung */
  .kacheln { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .kachel { border-radius:14px; padding:14px; min-height:132px; position:relative; overflow:hidden; cursor:pointer; color:#fff; transition:transform .15s; }
  .kachel:hover { transform:translateY(-3px); } .kachel b { display:block; font-size:18px; } .kachel span { font-size:13.5px; opacity:.92; }
  .kachel .bar { height:8px; background:rgba(255,255,255,.25); border-radius:9px; margin-top:10px; width:62%; } .kachel .bar i { display:block; height:100%; border-radius:9px; background:#fff; }
  .kachel img, .kachel .gross { position:absolute; right:-4px; bottom:-8px; width:92px; height:92px; object-fit:contain; font-size:66px; line-height:92px; text-align:center; }
  .kp { background:linear-gradient(135deg,#dc2626,#7f1d1d); } .kd { background:linear-gradient(135deg,#f59e0b,#9a3412); } .ke { background:linear-gradient(135deg,#7c3aed,#3b0764); } .kt { background:linear-gradient(135deg,#0d9488,#134e4a); } .kr { background:linear-gradient(135deg,#2563eb,#1e3a8a); }
  .ruf { display:block; margin:0 auto 14px; border:0; border-radius:12px; padding:11px 18px; font-weight:800; font-size:15px; cursor:pointer; background:#4ade80; color:#052e16; }
  html.glas header { background:rgba(127,29,29,.75) !important; padding-right:190px !important; }
</style>
<script src="glas.js?v=1792772000"></script>
<script src="https://play.workadventu.re/iframe_api.js"></script>
</head>
<body>
<header><div><h1 id="titel">📚 Sammlungen</h1><div class="u" id="u">Lade …</div></div>
  <div class="reiter"><button id="r0" class="an">📚 Übersicht</button><button id="r1">Pokémon</button><button id="r2">Rangliste</button><button id="r3">🐉 Dragon Balls</button><button id="r4">🏅 Erfolge</button><button id="r5">🔄 Tausch</button></div></header>
<main id="m"><div class="leer2">Lade …</div></main>
<script>
// Pokémon-Sammelbuch (18.10.2026, Sam): alle 151, gefangene farbig, fehlende als Schatten; Rangliste im Team
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/pokemon";
let NAME = new URLSearchParams(location.search).get("name") || "", liste = [], daten = { meine: [], rang: [] }, reiter = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function zeigen() {
  const m = document.getElementById("m"), hab = new Map(daten.meine.map(x => [x.nr, x.anzahl]));
  document.getElementById("u").textContent = reiter === 0 ? "Alle deine Sammlungen" : hab.size + " von 151 gefunden · " + [...hab.values()].reduce((s, x) => s + x, 0) + " gefangen";
  for (let i = 0; i <= 5; i++) document.getElementById("r" + i).className = reiter === i ? "an" : "";
  if (reiter === 0) return regalZeigen(m);
  if (reiter === 3) return dbZeigen(m); if (reiter === 4) return erfolgeZeigen(m); if (reiter === 5) return tauschZeigen(m);
  if (reiter === 2) { m.innerHTML = daten.rang.length ? daten.rang.map(r => `<div class="z${r.ich ? " ich" : ""}"><div class="pl">${r.platz <= 3 ? ["🥇", "🥈", "🥉"][r.platz - 1] : r.platz + "."}</div><div class="na">${esc(r.name)}</div><div class="w">${r.arten} / 151</div></div>`).join("") : '<div class="leer2">Noch hat niemand etwas gefangen.</div>'; return; }
  m.innerHTML = '<div class="gitter">' + liste.map(p => { const n = hab.get(p.nr), num = "#" + String(p.nr).padStart(3, "0");
    if (!p.bild) return `<div class="k leer"><div class="fragez">?</div><div class="nr">${num}</div><div class="n">kommt bald</div></div>`;
    return `<div class="k${n ? "" : " nein"}">${n > 1 ? `<div class="x">×${n}</div>` : ""}<img src="pokemon/${String(p.nr).padStart(3, "0")}.png?v=2" alt=""><div class="nr">${num}</div><div class="n">${n ? esc(p.name) : "???"}</div></div>`; }).join("") + "</div>";
}
async function laden() {
  try { liste = await (await fetch("pokemon/pokemon.json?t=" + Date.now())).json(); } catch { liste = []; }
  try { daten = await (await fetch(API + "?name=" + encodeURIComponent(NAME), { headers: { "X-Buero-Key": KEY } })).json(); } catch { }
  await regalLaden(); zeigen();
}
for (let i = 0; i <= 5; i++) document.getElementById("r" + i).onclick = () => oeffnen(i);
async function oeffnen(i) { reiter = i; if (i >= 3) await extraLaden(); zeigen(); }
// Regal (S1): alle Zahlen auf einen Blick, Kachel öffnet die Sammlung
async function regalLaden() { const n = encodeURIComponent(NAME);
  await Promise.all([["db", "/db"], ["erfolge", "/erfolge"], ["tausch", "/tausch"]].map(async ([k, p]) => { try { ex[k] = await (await fetch(API + p + "?name=" + n, { headers: H })).json(); } catch { } })); }
function regalZeigen(m) {
  const arten = daten.meine.length, kg = ((ex.db || {}).kugeln || []).filter(k => k.gefunden).length, el = (ex.erfolge || {}).liste || [], eh = el.filter(e => e.erreicht).length;
  const tein = ((ex.tausch || {}).liste || []).filter(x => x.ein && x.status === "offen").length, ich = daten.rang.find(r => r.ich);
  const k = (cls, i, titel, zeile, anteil, bild) => '<div class="kachel ' + cls + '" data-i="' + i + '"><b>' + titel + '</b><span>' + zeile + '</span><div class="bar"><i style="width:' + Math.round(Math.min(1, anteil) * 100) + '%"></i></div>' + bild + '</div>';
  m.innerHTML = '<div class="kacheln">'
    + k("kp", 1, "Pokémon", arten + " / 151 gefunden", arten / 151, '<img src="' + bildVon(25) + '" alt="">')
    + k("kd", 3, "Dragon Balls", kg + " / 7 diese Woche" + ((ex.db || {}).wunschOffen ? " · Wunsch offen!" : ""), kg / 7, '<div class="gross">🐉</div>')
    + k("ke", 4, "Erfolge", eh + " / " + (el.length || 14), eh / (el.length || 14), '<div class="gross">🏅</div>')
    + k("kt", 5, "Tausch", tein ? tein + " Angebot" + (tein > 1 ? "e" : "") + " an dich" : "Doppelte tauschen", tein ? 1 : 0, '<div class="gross">🔄</div>')
    + k("kr", 2, "Rangliste", ich ? "Du bist auf Platz " + ich.platz : "Noch nicht dabei", ich ? 1 / ich.platz : 0, '<div class="gross">🏆</div>')
    + '</div>';
  m.querySelectorAll("[data-i]").forEach(e => e.onclick = () => oeffnen(Number(e.dataset.i)));
}
// ===== 17.10.2026 (Sam): Dragon Balls, Erfolge, Pokémon-Tausch
const H = { "X-Buero-Key": KEY }, nameVon = nr => (liste.find(p => p.nr === nr) || {}).name || "#" + nr, bildVon = nr => "pokemon/" + String(nr).padStart(3, "0") + ".png?v=2";
let ex = { db: null, erfolge: null, tausch: null }, tw = { an: "", will: 0, gib: 0 }, meldung = "";
async function extraLaden() {
  const n = encodeURIComponent(NAME);
  try { if (reiter === 3) ex.db = await (await fetch(API + "/db?name=" + n, { headers: H })).json();
    if (reiter === 4) ex.erfolge = await (await fetch(API + "/erfolge?name=" + n, { headers: H })).json();
    if (reiter === 5) ex.tausch = await (await fetch(API + "/tausch?name=" + n, { headers: H })).json(); } catch { }
}
function dbZeigen(m) {
  const d = ex.db || { kugeln: [], ruhm: [] }, gef = (d.kugeln || []).filter(k => k.gefunden).length;
  m.innerHTML = (d.wunschOffen ? '<button class="ruf" id="ruf">🐉 Shenlong rufen – dein Wunsch wartet</button>' : "") + '<h3>Deine Dragon Balls diese Woche: ' + gef + ' / 7</h3><p class="hin">Jede Woche liegen für jeden 7 eigene Kugeln draußen versteckt – halb im Gras. Alle 7 gefunden: Shenlong erscheint und du kommst in die Ruhmeshalle.</p><div class="kugeln">'
    + (d.kugeln || []).map(k => '<div class="kugel' + (k.gefunden ? "" : " nein") + '"><div class="o">' + "★".repeat(k.s) + '</div>' + k.s + ' ★</div>').join("") + '</div>'
    + '<h3>🏆 Ruhmeshalle</h3>' + ((d.ruhm || []).length ? d.ruhm.map(x => '<div class="z"><div class="pl">🐉</div><div class="na">' + esc(x.name) + '</div><div class="w">' + esc(x.woche.replace("-W", " · KW ")) + '</div></div>').join("") : '<div class="leer2">Noch hat niemand Shenlong gerufen.</div>');
}
function rufen() { try { WA.player.state.saveVariable("swAktion", { was: "shenlongAuf", t: Date.now() }, { public: false, persist: false }); } catch { } }
document.addEventListener("click", e => { if (e.target && e.target.id === "ruf") rufen(); });
function erfolgeZeigen(m) {
  const l = (ex.erfolge || {}).liste || [], n = l.filter(e => e.erreicht).length;
  m.innerHTML = '<h3>' + n + ' von ' + l.length + ' Erfolgen</h3>' + l.map(e => '<div class="e' + (e.erreicht ? "" : " nein") + '"><div class="i">' + e.icon + '</div><div><div class="t1">' + esc(e.name) + '</div><div class="t2">' + esc(e.text) + (e.erreicht ? " · seit " + new Date(e.erreicht).toLocaleDateString("de-DE") : "") + '</div></div></div>').join("");
}
function tauschZeigen(m) {
  const t = ex.tausch || { liste: [], leute: [], meineDoppelt: [] }, ST = { offen: "offen", angenommen: "✅ getauscht", abgelehnt: "❌ abgelehnt", zurueck: "zurückgezogen", ungueltig: "nicht mehr möglich" };
  let h = meldung ? '<p class="hin"><b>' + esc(meldung) + '</b></p>' : "";
  const offenEin = (t.liste || []).filter(x => x.ein && x.status === "offen");
  if (offenEin.length) h += '<h3>Angebote an dich</h3>' + offenEin.map(x => '<div class="tz"><img src="' + bildVon(x.gib) + '"><div class="f"><b>' + esc(x.mit) + '</b> gibt dir <b>' + esc(nameVon(x.gib)) + '</b> und möchte dein <b>' + esc(nameVon(x.will)) + '</b></div><img src="' + bildVon(x.will) + '"><button class="kn" data-a="' + x.id + '" data-ja="1">Annehmen</button><button class="kn grau" data-a="' + x.id + '" data-ja="0">Ablehnen</button></div>').join("");
  h += '<h3>Neues Angebot</h3>';
  if (!(t.meineDoppelt || []).length) h += '<p class="hin">Du hast noch keine doppelten Pokémon. Getauscht werden nur Doppelte – so verliert niemand eine Art.</p>';
  else if (!(t.leute || []).length) h += '<p class="hin">Gerade hat kein Kollege doppelte Pokémon.</p>';
  else {
    h += '<p class="hin">Du gibst ein Doppeltes und bekommst eins von deinem Kollegen. Er muss annehmen.</p><select id="an"><option value="">Kollegen wählen …</option>' + t.leute.map(p => '<option value="' + p.id + '"' + (tw.an === p.id ? " selected" : "") + '>' + esc(p.name) + ' (' + p.doppelt.length + ' doppelt)</option>').join("") + '</select>';
    const k = t.leute.find(p => p.id === tw.an);
    if (k) h += '<h3>Das möchtest du von ' + esc(k.name) + '</h3><div class="wahl">' + k.doppelt.map(nr => '<div data-will="' + nr + '" class="' + (tw.will === nr ? "an" : "") + '"><img src="' + bildVon(nr) + '"><br>' + esc(nameVon(nr)) + '</div>').join("") + '</div>'
      + '<h3>Das gibst du</h3><div class="wahl">' + t.meineDoppelt.map(nr => '<div data-gib="' + nr + '" class="' + (tw.gib === nr ? "an" : "") + '"><img src="' + bildVon(nr) + '"><br>' + esc(nameVon(nr)) + '</div>').join("") + '</div>'
      + '<button class="kn" id="senden"' + (tw.will && tw.gib ? "" : " disabled") + '>Tausch anbieten</button>';
  }
  const rest = (t.liste || []).filter(x => !(x.ein && x.status === "offen"));
  if (rest.length) h += '<h3>Deine Tauschgeschäfte</h3>' + rest.map(x => '<div class="tz"><div class="f">' + (x.ein ? esc(x.mit) + " → dir" : "Du → " + esc(x.mit)) + ': ' + esc(nameVon(x.gib)) + ' ⇄ ' + esc(nameVon(x.will)) + ' · ' + ST[x.status] + '</div>' + (!x.ein && x.status === "offen" ? '<button class="kn grau" data-a="' + x.id + '" data-ja="0">Zurückziehen</button>' : "") + '</div>').join("");
  m.innerHTML = h;
  const an = document.getElementById("an"); if (an) an.onchange = () => { tw = { an: an.value, will: 0, gib: 0 }; meldung = ""; zeigen(); };
  m.querySelectorAll("[data-will]").forEach(e => e.onclick = () => { tw.will = Number(e.dataset.will); zeigen(); });
  m.querySelectorAll("[data-gib]").forEach(e => e.onclick = () => { tw.gib = Number(e.dataset.gib); zeigen(); });
  const sd = document.getElementById("senden"); if (sd) sd.onclick = () => senden({ name: NAME, an: tw.an, gib: tw.gib, will: tw.will }, "Angebot geschickt – dein Kollege bekommt einen Hinweis im Büro.");
  m.querySelectorAll("[data-a]").forEach(e => e.onclick = () => senden({ name: NAME, id: e.dataset.a, ja: e.dataset.ja === "1" }, e.dataset.ja === "1" ? "Getauscht! 🎉" : "Erledigt."));
}
async function senden(body, ok) {
  try { const r = await fetch(API + "/tausch", { method: "POST", headers: { ...H, "Content-Type": "application/json" }, body: JSON.stringify(body) }), d = await r.json(); meldung = r.ok ? ok : (d.error || "Hat nicht geklappt."); } catch { meldung = "Keine Verbindung."; }
  tw = { an: "", will: 0, gib: 0 }; await extraLaden(); try { daten = await (await fetch(API + "?name=" + encodeURIComponent(NAME), { headers: H })).json(); } catch { } zeigen();
}
let geladen = false; const los = () => { if (!geladen) { geladen = true; laden(); } };
if (NAME) los(); else if (window.WA) { WA.onInit().then(() => { NAME = WA.player.name || ""; los(); }).catch(los); setTimeout(los, 2500); } else los();
</script>
</body>
