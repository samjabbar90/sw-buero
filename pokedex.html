<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sammelbuch</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#dc2626; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:18px; } header .u { font-size:12.5px; opacity:.9; }
  .reiter { display:flex; gap:6px; margin-left:auto; } .reiter button { border:0; border-radius:8px; padding:6px 10px; font-weight:700; cursor:pointer; background:rgba(255,255,255,.2); color:#fff; }
  .reiter button.an { background:#fff; color:#dc2626; }
  main { padding:12px; }
  .gitter { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:8px; }
  .k { background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:6px; text-align:center; position:relative; }
  .k img { width:64px; height:64px; image-rendering:pixelated; }
  .k.nein img { filter:brightness(0) opacity(.18); } .k.leer { color:#94a3b8; }
  .k .nr { font-size:10.5px; color:#64748b; } .k .n { font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .k .x { position:absolute; top:4px; right:6px; font-size:11px; font-weight:700; color:#dc2626; }
  .k .fragez { width:64px; height:64px; display:flex; align-items:center; justify-content:center; font-size:26px; color:#cbd5e1; margin:0 auto; }
  .z { display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:9px 12px; margin-bottom:8px; }
  .z.ich { border-color:#dc2626; background:#fef2f2; } .z .pl { width:30px; font-weight:800; } .z .na { flex:1; font-weight:700; } .z .w { font-weight:700; color:#dc2626; }
  .leer2 { color:#64748b; text-align:center; padding:28px 0; }
</style>
<script src="glas.js?v=1792088168"></script>
<script src="https://play.workadventu.re/iframe_api.js"></script>
</head>
<body>
<header><div><h1>📕 Sammelbuch</h1><div class="u" id="u">Lade …</div></div>
  <div class="reiter"><button id="r1" class="an">Meine</button><button id="r2">Rangliste</button></div></header>
<main id="m"><div class="leer2">Lade …</div></main>
<script>
// Pokémon-Sammelbuch (18.10.2026, Sam): alle 151, gefangene farbig, fehlende als Schatten; Rangliste im Team
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/pokemon";
let NAME = new URLSearchParams(location.search).get("name") || "", liste = [], daten = { meine: [], rang: [] }, reiter = 1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function zeigen() {
  const m = document.getElementById("m"), hab = new Map(daten.meine.map(x => [x.nr, x.anzahl]));
  document.getElementById("u").textContent = hab.size + " von 151 gefunden · " + [...hab.values()].reduce((s, x) => s + x, 0) + " gefangen";
  document.getElementById("r1").className = reiter === 1 ? "an" : ""; document.getElementById("r2").className = reiter === 2 ? "an" : "";
  if (reiter === 2) { m.innerHTML = daten.rang.length ? daten.rang.map(r => `<div class="z${r.ich ? " ich" : ""}"><div class="pl">${r.platz <= 3 ? ["🥇", "🥈", "🥉"][r.platz - 1] : r.platz + "."}</div><div class="na">${esc(r.name)}</div><div class="w">${r.arten} / 151</div></div>`).join("") : '<div class="leer2">Noch hat niemand etwas gefangen.</div>'; return; }
  m.innerHTML = '<div class="gitter">' + liste.map(p => { const n = hab.get(p.nr), num = "#" + String(p.nr).padStart(3, "0");
    if (!p.bild) return `<div class="k leer"><div class="fragez">?</div><div class="nr">${num}</div><div class="n">kommt bald</div></div>`;
    return `<div class="k${n ? "" : " nein"}">${n > 1 ? `<div class="x">×${n}</div>` : ""}<img src="pokemon/${String(p.nr).padStart(3, "0")}.png?v=1" alt=""><div class="nr">${num}</div><div class="n">${n ? esc(p.name) : "???"}</div></div>`; }).join("") + "</div>";
}
async function laden() {
  try { liste = await (await fetch("pokemon/pokemon.json?t=" + Date.now())).json(); } catch { liste = []; }
  try { daten = await (await fetch(API + "?name=" + encodeURIComponent(NAME), { headers: { "X-Buero-Key": KEY } })).json(); } catch { }
  zeigen();
}
document.getElementById("r1").onclick = () => { reiter = 1; zeigen(); }; document.getElementById("r2").onclick = () => { reiter = 2; zeigen(); };
let geladen = false; const los = () => { if (!geladen) { geladen = true; laden(); } };
if (NAME) los(); else if (window.WA) { WA.onInit().then(() => { NAME = WA.player.name || ""; los(); }).catch(los); setTimeout(los, 2500); } else los();
</script>
</body>
</html>
