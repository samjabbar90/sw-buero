<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glastür</title>
<!-- Glastür zum Anbau der KI-Agenten (12.10.2026, Sam): durch nur mit PIN. Prüfung auf dem Server (/buero-praesenz/glastuer, .env
     GLASTUER_PIN, 5 Versuche je 15 Min), danach öffnet das Büro-Skript die Tür nur für diese Person (Spieler-Variable „swAktion“). -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:#0f766e; color:#fff; padding:12px 14px; } header h1 { margin:0; font-size:17px; } header .u { font-size:12.5px; opacity:.85; margin-top:2px; }
  main { padding:16px 14px; } .box { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:16px; text-align:center; }
  input { font:inherit; font-size:26px; letter-spacing:10px; text-align:center; width:100%; max-width:260px; padding:10px; border:1.5px solid #cbd5e1; border-radius:10px; }
  button { font:inherit; font-size:15px; font-weight:700; margin-top:12px; padding:10px 18px; border-radius:10px; border:0; background:#0d9488; color:#fff; cursor:pointer; }
  .fehler { color:#b91c1c; font-weight:600; font-size:13px; margin-top:10px; min-height:18px; } .ok { color:#047857; font-weight:700; font-size:16px; }
  html.glas .box { background:rgba(255,255,255,.07) !important; border-color:rgba(255,255,255,.15) !important; color:#f1f5f9 !important; }
  html.glas input { background:rgba(10,11,14,.62); color:#fff; border-color:rgba(255,255,255,.25); }
</style>
<script src="glas.js?v=1791559958"></script>
</head>
<body>
<header><h1>🔒 Bereich der KI-Agenten</h1><div class="u">Glastür – durch nur mit PIN</div></header>
<main><div class="box" id="box">
  <div style="margin-bottom:10px">PIN eingeben</div>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" autofocus>
  <div><button id="ok">Tür öffnen</button></div><div class="fehler" id="fe"></div>
</div></main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", $ = id => document.getElementById(id);
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
async function pruefen() {
  const pin = $("pin").value.trim(); if (!pin) return $("fe").textContent = "Bitte die PIN eingeben.";
  if (!ausweis()) return $("fe").textContent = "Bitte zuerst das Büro entsperren (Anmelden).";
  $("ok").disabled = true; $("fe").textContent = "";
  try {
    const r = await fetch("https://swdigitaltest.de/buero-praesenz/glastuer", { method: "POST", headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error === "ausweis-fehlt" || d.error === "ausweis-ungueltig" ? "Bitte das Büro kurz neu entsperren." : (d.error || "Fehler " + r.status));
    $("box").innerHTML = '<div class="ok">🔓 Tür ist offen – komm rein</div>';
    try { WA.player.state.saveVariable("swAktion", { was: "glastuerAuf", t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); }
  } catch (e) { $("fe").textContent = e.message; $("ok").disabled = false; $("pin").value = ""; $("pin").focus(); }
}
$("ok").onclick = pruefen; $("pin").onkeydown = e => { if (e.key === "Enter") pruefen(); };
(async () => { for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100));
  try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch {} })();
</script>
</body>
</html>
