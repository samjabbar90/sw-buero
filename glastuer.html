<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glastür</title>
<!-- Glastür zum Anbau der KI-Agenten (12.10.2026, Sam): durch nur mit PIN. Prüfung auf dem Server (/buero-praesenz/glastuer, .env
     GLASTUER_PIN, 5 Versuche je 15 Min), danach öffnet das Büro-Skript die Tür nur für diese Person (Spieler-Variable „swAktion“). -->
<style>
  /* Tür D „Schiebetür mit Touch-Feld“ (12.10.2026, Sam): zwei Flügel, Touch-Feld mit Schild; bei richtiger PIN fahren die Flügel auseinander */
  * { box-sizing:border-box; }
  body { margin:0; background:#0f0d24; color:#EEEDFE; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  html.glas body { background:transparent; }
  header { padding:10px 14px 0; } header h1 { margin:0; font-size:16px; } header .u { font-size:12.5px; opacity:.8; margin-top:2px; }
  .rahmen { position:relative; margin:12px auto 14px; width:min(330px,92vw); height:400px; border:8px solid #26215C; border-radius:6px; background:#141033; overflow:hidden; }
  .fluegel { position:absolute; top:0; bottom:0; width:50%; background:#3C3489; transition:transform 1.1s cubic-bezier(.6,0,.2,1); }
  .fluegel.l { left:0; border-right:1px solid #7F77DD; } .fluegel.r { right:0; border-left:1px solid #7F77DD; }
  .fluegel::after { content:""; position:absolute; top:22px; bottom:22px; width:2px; background:#534AB7; } .l::after { right:14px; } .r::after { left:14px; }
  .offen .l { transform:translateX(-96%); } .offen .r { transform:translateX(96%); }
  .schiene { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:120px; height:4px; border-radius:2px; background:#AFA9EC; z-index:2; transition:opacity .4s; }
  .feld { position:absolute; left:50%; top:30px; transform:translateX(-50%); z-index:3; width:196px; background:#EEEDFE; color:#26215C; border-radius:12px; padding:12px; text-align:center; transition:opacity .4s, transform .4s; }
  .offen .feld, .offen .schiene { opacity:0; pointer-events:none; } .offen .feld { transform:translateX(-50%) scale(.9); }
  .schild { font-size:13px; font-weight:700; letter-spacing:.3px; } .schild small { display:block; font-weight:500; font-size:11px; color:#534AB7; margin-top:1px; }
  .anzeige { margin:9px 0 10px; height:30px; border-radius:7px; background:#26215C; color:#CECBF6; font-size:20px; letter-spacing:7px; display:flex; align-items:center; justify-content:center; }
  .anzeige.falsch { background:#791F1F; animation:wackeln .35s; } @keyframes wackeln { 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .tasten { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .tasten button { font:inherit; font-size:18px; font-weight:600; height:42px; border:0; border-radius:8px; background:#CECBF6; color:#26215C; cursor:pointer; }
  .tasten button:active { background:#AFA9EC; transform:scale(.96); } .tasten .ok { background:#534AB7; color:#fff; } .tasten .zu { background:#ddd9fb; font-size:15px; }
  .fehler { color:#F09595; font-weight:600; font-size:13px; min-height:18px; text-align:center; padding:0 14px; }
  .drinnen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; color:#5DCAA5; font-weight:700; font-size:17px; }
  .drinnen small { color:#CECBF6; font-weight:500; font-size:13px; }
  input.anzeige { display:block; width:100%; border:0; outline:none; font:inherit; font-size:20px; letter-spacing:7px; text-align:center; padding:0; }
  input.anzeige::placeholder { color:#7F77DD; letter-spacing:3px; font-size:15px; } input.anzeige:focus { box-shadow:0 0 0 2px #7F77DD; }
</style>
<script src="glas.js?v=1792085662"></script>
</head>
<body>
<header><h1>🔒 Bereich der KI-Agenten</h1><div class="u">Schiebetür – durch nur mit PIN</div></header>
<main>
  <div class="rahmen" id="tuer">
    <div class="drinnen">🔓 Tür ist offen<small>komm rein</small></div>
    <div class="fluegel l"></div><div class="fluegel r"></div><div class="schiene"></div>
    <div class="feld">
      <div class="schild">KI-Agenten<small>Mina &amp; Team</small></div>
      <input class="anzeige" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN" aria-label="PIN" autofocus>
      <div class="tasten" id="tasten"></div>
    </div>
  </div>
  <div class="fehler" id="fe"></div>
</main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", $ = id => document.getElementById(id);
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
async function pruefen() {
  const pin = $("pin").value.trim(); if (!pin) return $("fe").textContent = "Bitte die PIN eingeben.";
  if (!ausweis()) return $("fe").textContent = "Bitte zuerst das Büro entsperren (Anmelden).";
  $("ok").disabled = true; $("fe").textContent = "";
  try {
    const r = await fetch("https://swdigitaltest.de/buero-praesenz/glastuer", { method: "POST", headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error === "ausweis-fehlt" || d.error === "ausweis-ungueltig" ? "Bitte das Büro kurz neu entsperren." : (d.error || "Fehler " + r.status));
    $("tuer").classList.add("offen");
    try { WA.player.state.saveVariable("swAktion", { was: "glastuerAuf", t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); }
  } catch (e) { $("fe").textContent = e.message; $("ok").disabled = false; $("pin").value = ""; zeigen(true); $("pin").focus(); }
}
// Touch-Feld: Ziffern 1–9, ⌫, 0, ✓; Tastatur geht weiter über das unsichtbare Feld
function zeigen(falsch) { const a = $("pin"); a.classList.toggle("falsch", !!falsch); if (falsch) setTimeout(() => a.classList.remove("falsch"), 400); }
// Eintippen (12.10.): Ziffern/⌫/Enter gehen ins Feld, auch wenn der Fokus gerade woanders im Fenster ist
document.addEventListener("keydown", e => { const p = $("pin"); if (document.activeElement === p) return;
  if (/^\d$/.test(e.key)) { if (p.value.length < 12) p.value += e.key; } else if (e.key === "Backspace") p.value = p.value.slice(0, -1); else if (e.key === "Enter") return pruefen(); else return;
  e.preventDefault(); $("fe").textContent = ""; p.focus(); });
window.addEventListener("load", () => { try { window.focus(); $("pin").focus(); } catch {} });
["1","2","3","4","5","6","7","8","9","⌫","0","✓"].forEach(z => { const b = document.createElement("button"); b.type = "button"; b.textContent = z;
  if (z === "✓") { b.className = "ok"; b.id = "ok"; b.setAttribute("aria-label", "Tür öffnen"); } else if (z === "⌫") { b.className = "zu"; b.setAttribute("aria-label", "Löschen"); }
  b.onclick = () => { const p = $("pin"); if (z === "✓") return pruefen(); if (z === "⌫") p.value = p.value.slice(0, -1); else if (p.value.length < 12) p.value += z; $("fe").textContent = ""; zeigen(); p.focus(); };
  $("tasten").appendChild(b); });
$("pin").oninput = () => { $("pin").value = $("pin").value.replace(/\D/g, ""); $("fe").textContent = ""; zeigen(); };
document.addEventListener("click", e => { if (e.target.tagName !== "BUTTON") $("pin").focus(); });
$("pin").onkeydown = e => { if (e.key === "Enter") pruefen(); };
(async () => { for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100));
  try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch {} })();
</script>
</body>
</html>
