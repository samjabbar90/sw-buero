<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Namensschild</title>
<!-- Namensschild im Büro, Layout N3 (15.10.2026, Sam): Kürzel + Status-Punkt oben links im Raum – grün = da, grau = nicht da,
     lila = Fokus/abgeschlossen. Klick = ganzer Name, nach 4 s wieder Kürzel. Liegt als Webseite in der Karte (main.ts › namensschilder),
     Status kommt über die Adresse (?s=da|weg|fokus), das Büro-Skript setzt sie neu, wenn er sich ändert. -->
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { height:100%; display:flex; align-items:center; justify-content:flex-start; cursor:pointer; user-select:none; }
  .s span { border-radius:999px; padding:0 7px; font-size:11px; font-weight:700; line-height:16px; white-space:nowrap; border:1px solid transparent; }
  .da span { background:#dcfce7; color:#166534; border-color:#86efac; }
  .weg span { background:#f1f5f9; color:#475569; border-color:#cbd5e1; }
  .fokus span { background:#ede9fe; color:#5b21b6; border-color:#c4b5fd; }
  .leer span { background:rgba(255,255,255,.7); color:#9ca3af; border-color:#e5e7eb; font-weight:600; }
</style>
</head>
<body>
<div class="s" id="s"><span id="t"></span></div>
<script>
const q = new URLSearchParams(location.search), n = q.get("n") || "", raum = q.get("raum") || "", st = q.get("s") || "weg";
const kuerzel = n ? n.replace(/\./g, "").split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase() : "";
const TEXT = { da: "im Büro", weg: "nicht da", fokus: "Fokus – bitte anklopfen" };
const s = document.getElementById("s"), t = document.getElementById("t");
s.className = "s " + (n ? st : "leer");
const klein = () => { t.textContent = n ? "● " + kuerzel : "frei"; };
klein();
let uhr = null;
s.onclick = () => { t.textContent = n ? "● " + n + " · " + (TEXT[st] || "") : "Leeres Büro (" + raum + ")"; clearTimeout(uhr); uhr = setTimeout(klein, 4000); };
</script>
</body>
</html>
