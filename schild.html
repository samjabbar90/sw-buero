<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Namensschild</title>
<!-- Namensschild im Büro (15.10.2026, Sam: „wenn man auf den Raum klickt, soll der Name erscheinen, damit man sieht, wer dort sitzt“).
     Liegt als Webseite in der Karte (main.ts › namensschilder). Klein: Name. Klick: groß mit „Büro“, nach 4 s wieder klein. -->
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .s { height:100%; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
  .s span { background:rgba(255,255,255,.88); color:#374151; border:1px solid rgba(17,24,39,.18); border-radius:999px; padding:0 8px; font-size:11px; font-weight:700; line-height:16px; white-space:nowrap; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .s.leer span { color:#9ca3af; font-weight:600; }
  .s.gross span { background:#0f766e; color:#fff; border-color:#0f766e; font-size:12px; }
</style>
</head>
<body>
<div class="s" id="s"><span id="t"></span></div>
<script>
const q = new URLSearchParams(location.search), n = q.get("n") || "", raum = q.get("raum") || "";
const s = document.getElementById("s"), t = document.getElementById("t");
const klein = () => { s.classList.remove("gross"); t.textContent = n || "frei"; };
if (!n) s.classList.add("leer");
klein();
let uhr = null;
s.onclick = () => { s.classList.add("gross"); t.textContent = n ? "👤 " + n + " · Büro" : "Leeres Büro (" + raum + ")"; clearTimeout(uhr); uhr = setTimeout(klein, 4000); };
</script>
</body>
</html>
