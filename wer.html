<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wer ist da</title>
<!-- „Wer ist da“ (11./12.10.2026, Sam): alle im Büro mit Raum, 📞 telefoniert, Tür; mit Recht „Live-Anzeige“ zusätzlich, woran die
     freigeschalteten Kollegen gerade im SW-internen Portal arbeiten. Darunter grau „Nicht im Büro“ (heute bis … / heute nicht da).
     Je Person: 📞 Anrufen (Durchwahl), 💬 Nachricht (im Büro als Hinweis an der Figur + immer Glocke/Push), 🚶 hingehen, Klick = Profil.
     ?an=<Name> öffnet gleich das Nachrichtenfeld (Antworten aus dem Hinweis). Server: /buero-praesenz/wer, /buero-praesenz/wer/nachricht -->
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:#f8fafc; color:#0f172a; }
  header { position:sticky; top:0; z-index:2; background:#0f766e; color:#fff; padding:12px 14px; display:flex; align-items:center; gap:8px; }
  header h1 { margin:0; font-size:17px; flex:1; } main { padding:8px 10px 20px; }
  .r { display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:10px; cursor:pointer; }
  .r:hover { background:rgba(13,148,136,.08); }
  .av { width:34px; height:34px; border-radius:50%; background:#0d9488 center/cover no-repeat; color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex:none; }
  .n { font-weight:700; font-size:14px; } .s { font-size:12px; color:#64748b; margin-top:1px; }
  .live { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:#b91c1c; background:#fee2e2; border-radius:999px; padding:1px 7px; margin-left:4px; }
  .live:before { content:""; width:6px; height:6px; border-radius:50%; background:#ef4444; }
  .zul { font-size:11px; color:#94a3b8; margin-left:4px; } .was { font-size:12px; color:#0f766e; margin-top:2px; }
  .k { font:inherit; font-size:13px; border:1.5px solid #cbd5e1; background:#fff; border-radius:8px; padding:4px 7px; cursor:pointer; flex:none; text-decoration:none; color:inherit; line-height:1.2; }
  .weg .av { filter:grayscale(1); opacity:.6; } .weg .n { color:#64748b; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:#64748b; margin:16px 8px 4px; }
  .msg { display:flex; gap:6px; padding:0 8px 8px 50px; } .msg input { flex:1; font:inherit; font-size:13px; padding:6px 9px; border:1.5px solid #cbd5e1; border-radius:8px; }
  .msg button { font:inherit; font-size:12.5px; font-weight:700; border:0; border-radius:8px; padding:6px 12px; background:#0d9488; color:#fff; cursor:pointer; }
  .ok { font-size:12px; color:#047857; padding:0 8px 8px 50px; } .leer { color:#64748b; font-size:13px; padding:20px 8px; text-align:center; }
  html.glas header { background:transparent !important; } html.glas .s, html.glas .zul, html.glas h2 { color:rgba(255,255,255,.6) !important; } html.glas .was { color:#5eead4 !important; }
  html.glas .r:hover { background:rgba(255,255,255,.06) !important; } html.glas .k { background:rgba(255,255,255,.08) !important; border-color:rgba(255,255,255,.2) !important; color:#fff !important; }
  html.glas .live { background:rgba(239,68,68,.2) !important; color:#fca5a5 !important; } html.glas .weg .n { color:rgba(255,255,255,.55) !important; }
  html.glas .msg input { background:rgba(255,255,255,.08) !important; border-color:rgba(255,255,255,.2) !important; color:#fff !important; } html.glas .ok { color:#6ee7b7 !important; }
</style>
<script src="glas.js?v=1791559958"></script>
</head>
<body>
<header><h1 id="kopf">👥 Wer ist da</h1></header>
<main id="liste"><div class="leer">Lade …</div></main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
const q = new URLSearchParams(location.search), glas = q.has("glas") ? "&glas=1" : "";
let offen = q.get("an") || "", gesendet = {};
const minSeit = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 60 ? m + " Min" : Math.floor(m / 60) + " Std"; };
const kopf = h => ({ "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), ...h });
const initialen = n => String(n).split(/\s+/).map(t => t[0] || "").join("").slice(0, 2).toUpperCase();

function knoepfe(p, imBuero) {
  return (p.durchwahl ? `<a class="k" href="tel:${esc(p.durchwahl)}" title="Anrufen (${esc(p.durchwahl)})">📞</a>` : "")
    + `<button class="k" data-msg="${esc(p.name)}" title="Nachricht schreiben">💬</button>`
    + (imBuero ? `<button class="k" data-hin="${esc(p.name)}" title="Zu ${esc(p.name)} gehen">🚶</button>` : "");
}
function unterZeile(p) {
  if (gesendet[p.name]) return `<div class="ok">${esc(gesendet[p.name])}</div>`;
  if (offen !== p.name) return "";
  return `<div class="msg"><input id="msgText" maxlength="300" placeholder="Nachricht an ${esc(p.name.split(" ")[0])} …"><button data-senden="${esc(p.name)}">Senden</button></div>`;
}
function zeileDa(p) {
  const lv = p.live;
  const status = lv && lv.pfad ? (lv.live ? '<span class="live">Live</span>' : `<span class="zul">zuletzt im Portal vor ${minSeit(lv.zuletzt)}</span>`) : "";
  const was = lv && lv.pfad && lv.live ? `<div class="was">${esc(lv.pfad.split(" › ").slice(-2).join(" › "))}${lv.detail ? " · " + esc(lv.detail) : ""}</div>` : "";
  const extra = (p.telefoniert ? " · 📞 telefoniert" : "") + (p.tuer === "zu" ? " · 🔒 Tür zu" : p.tuer === "besetzt" ? " · beschäftigt" : "");
  return `<div class="r" data-p="${esc(p.name)}"><div class="av" style="${p.foto ? "background-image:url('" + esc(p.foto) + "')" : ""}">${p.foto ? "" : esc(initialen(p.name))}</div>
    <div style="flex:1;min-width:0"><div class="n">${esc(p.name)}${status}</div><div class="s">${esc(p.bereich)}${extra}</div>${was}</div>${knoepfe(p, true)}</div>${unterZeile(p)}`;
}
function zeileWeg(p) {
  const wann = p.zuletzt ? "heute bis " + new Date(p.zuletzt).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " im Büro" : "heute nicht da";
  return `<div class="r weg" data-p="${esc(p.name)}"><div class="av">${esc(initialen(p.name))}</div><div style="flex:1;min-width:0"><div class="n">${esc(p.name)}</div><div class="s">${wann}</div></div>${knoepfe(p, false)}</div>${unterZeile(p)}`;
}
async function senden(an, knopf) {
  const t = ($("msgText") || {}).value; if (!t || !t.trim()) return;
  knopf.disabled = true;
  try {
    const r = await fetch(API + "/wer/nachricht", { method: "POST", headers: kopf({ "Content-Type": "application/json" }), body: JSON.stringify({ an, text: t.trim() }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Fehler");
    gesendet[an] = "✓ Gesendet – " + (d.imBuero ? "erscheint gleich bei " + an.split(" ")[0] + " im Büro (und als Meldung)" : "kommt als Meldung im SW-internen Portal an");
    offen = ""; zeichnen(); setTimeout(() => { delete gesendet[an]; zeichnen(); }, 8000);
  } catch (e) { alert(e.message); knopf.disabled = false; }
}
let DATEN = null;
function zeichnen() {
  if (!DATEN) return;
  const da = DATEN.da || [], weg = DATEN.weg || [];
  $("kopf").textContent = "👥 Wer ist da · " + da.length;
  $("liste").innerHTML = (da.length ? da.map(zeileDa).join("") : '<div class="leer">Gerade ist niemand im Büro.</div>')
    + (weg.length ? "<h2>Nicht im Büro · " + weg.length + "</h2>" + weg.map(zeileWeg).join("") : "");
  document.querySelectorAll("[data-p]").forEach(el => el.onclick = ev => { if (ev.target.closest(".k")) return; location.href = "profil.html?name=" + encodeURIComponent(el.dataset.p) + glas + "&t=" + Date.now(); });
  document.querySelectorAll("[data-hin]").forEach(b => b.onclick = () => { try { WA.player.state.saveVariable("swAktion", { was: "zuPerson", name: b.dataset.hin, t: Date.now() }, { public: false, persist: false }); } catch {} });
  document.querySelectorAll("[data-msg]").forEach(b => b.onclick = () => { offen = offen === b.dataset.msg ? "" : b.dataset.msg; zeichnen(); });
  document.querySelectorAll("[data-senden]").forEach(b => b.onclick = () => senden(b.dataset.senden, b));
  const i = $("msgText"); if (i) { i.onkeydown = ev => { if (ev.key === "Enter") i.parentElement.querySelector("button").click(); }; setTimeout(() => i.focus(), 30); i.scrollIntoView({ block: "nearest" }); }
}
async function laden() {
  try { const r = await fetch(API + "/wer", { headers: kopf({}) }); const d = await r.json(); if (!r.ok) throw new Error(d.error || "Fehler"); DATEN = Array.isArray(d) ? { da: d, weg: [] } : d; }
  catch (e) { $("liste").innerHTML = `<div class="leer">${esc(/ausweis/.test(e.message) ? "Bitte das Büro kurz neu entsperren." : e.message)}</div>`; return; }
  zeichnen();
  clearTimeout(laden.t); laden.t = setTimeout(function nochmal() { if (offen) { laden.t = setTimeout(nochmal, 10000); return; } laden(); }, 30000);
}
(async () => { for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100)); try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch {} laden(); })();
</script>
</body>
</html>
