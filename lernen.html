<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lernzimmer</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#0f766e; color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:18px; flex:1; }
  header button { font:inherit; font-size:13px; border:1px solid rgba(255,255,255,.5); background:transparent; color:#fff; border-radius:8px; padding:5px 10px; cursor:pointer; }
  main { padding:14px; display:flex; flex-direction:column; gap:12px; }
  .karte { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:12px 14px; cursor:pointer; }
  .karte:hover { border-color:#0d9488; }
  .titel { font-weight:700; font-size:15px; } .klein { font-size:12.5px; color:#64748b; margin-top:3px; }
  .balken { height:7px; background:#e2e8f0; border-radius:4px; margin-top:9px; overflow:hidden; } .balken > div { height:100%; background:#0d9488; }
  .lektion { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:12px 14px; }
  .lektion.fertig { border-color:#99f6e4; background:#f0fdfa; }
  .abschnitt { font-size:12px; font-weight:700; color:#0f766e; text-transform:uppercase; letter-spacing:.4px; margin-top:6px; }
  .video { position:relative; padding-top:56.25%; margin-top:10px; border-radius:8px; overflow:hidden; background:#000; }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .text { white-space:pre-wrap; font-size:14px; line-height:1.5; margin-top:8px; }
  .zeile { display:flex; align-items:center; gap:8px; margin-top:10px; }
  button.haken { font:inherit; font-size:13px; font-weight:700; border-radius:9px; padding:7px 12px; cursor:pointer; border:1.5px solid #0d9488; background:#fff; color:#0f766e; }
  button.haken.an { background:#0d9488; color:#fff; }
  a { color:#0f766e; font-weight:600; }
  .leer { color:#64748b; text-align:center; padding:28px 0; }
</style>
<script src="glas.js?v=1791559958"></script>
</head>
<body>
<header><span style="font-size:22px">🎓</span><h1 id="kopf">Lernzimmer</h1><button id="zurueck" style="display:none">↩︎ Alle Kurse</button></header>
<main id="inhalt"><div class="leer">Lade …</div></main>
<script>
// Lernzimmer im virtuellen Büro (08.10.2026, Sam: „mit unserem E-Learning“) — Kurse aus dem Dashboard (Schulungen) für
// die Person zum Büro-Namen; Videos und Texte direkt hier, Lektionen abhaken = derselbe Fortschritt wie im Dashboard.
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/lernen";
const NAME = new URLSearchParams(location.search).get("name") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const holen = async (pfad, opt = {}) => { const r = await fetch(API + pfad, { ...opt, headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" } }); const d = await r.json(); if (!r.ok) throw new Error(d.error || "Fehler"); return d; };
// Video-Links (YouTube, Vimeo, Loom, Google Drive) in einbettbare Adressen umwandeln
function einbetten(url) {
  let m;
  if ((m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/))) return "https://www.youtube-nocookie.com/embed/" + m[1];
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return "https://player.vimeo.com/video/" + m[1];
  if ((m = url.match(/loom\.com\/(?:share|embed)\/([\w]+)/))) return "https://www.loom.com/embed/" + m[1];
  if ((m = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/))) return "https://drive.google.com/file/d/" + m[1] + "/preview";
  return url;
}
async function liste() {
  $("zurueck").style.display = "none";
  try {
    const d = await holen("?name=" + encodeURIComponent(NAME));
    $("kopf").textContent = "Lernzimmer" + (d.vorname ? " · " + d.vorname : "");
    $("inhalt").innerHTML = d.kurse.length ? d.kurse.map(k => `<div class="karte" data-id="${esc(k.id)}"><div class="titel">${esc(k.titel)}</div>
      <div class="klein">${esc(k.kategorie ? k.kategorie + " · " : "")}${k.anzahl} Lektion${k.anzahl === 1 ? "" : "en"} · ${k.prozent} % erledigt</div>
      <div class="balken"><div style="width:${k.prozent}%"></div></div></div>`).join("") : '<div class="leer">Für dich sind gerade keine Kurse freigegeben.</div>';
    document.querySelectorAll(".karte").forEach(e => e.onclick = () => kurs(e.dataset.id));
  } catch (e) { $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
async function kurs(id) {
  $("zurueck").style.display = ""; $("inhalt").innerHTML = '<div class="leer">Lade …</div>'; scrollTo(0, 0);
  try {
    const k = await holen("/kurs/" + encodeURIComponent(id) + "?name=" + encodeURIComponent(NAME));
    let erledigt = new Set(k.erledigt), abschnitt = "";
    const kopf = `<div><div class="titel" style="font-size:17px">${esc(k.titel)}</div>${k.beschreibung ? `<div class="klein">${esc(k.beschreibung)}</div>` : ""}<div class="balken"><div id="gesamt" style="width:${k.prozent}%"></div></div></div>`;
    $("inhalt").innerHTML = kopf + k.lektionen.map(l => {
      const ab = l.abschnitt && l.abschnitt !== abschnitt ? `<div class="abschnitt">${esc(abschnitt = l.abschnitt)}</div>` : "";
      return ab + `<div class="lektion${erledigt.has(l.id) ? " fertig" : ""}" id="l-${esc(l.id)}"><div class="titel">${esc(l.titel)}</div>
        ${l.video ? `<div class="video"><iframe src="${esc(einbetten(l.video))}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>` : ""}
        ${l.text ? `<div class="text">${esc(l.text)}</div>` : ""}
        ${l.datei ? `<div class="klein" style="margin-top:8px">📎 ${esc(l.dateiName || "Datei")} – öffnen im <a href="https://swdigitaltest.de/dashboard.html" target="_blank" rel="noopener">Dashboard › Schulungen</a></div>` : ""}
        <div class="zeile"><button class="haken${erledigt.has(l.id) ? " an" : ""}" data-l="${esc(l.id)}">${erledigt.has(l.id) ? "✓ Erledigt" : "Als erledigt markieren"}</button></div></div>`;
    }).join("");
    document.querySelectorAll("button.haken").forEach(btn => btn.onclick = async () => {
      const lid = btn.dataset.l, an = !erledigt.has(lid); btn.disabled = true;
      try {
        const r = await holen("/kurs/" + encodeURIComponent(id) + "/fortschritt", { method: "POST", body: JSON.stringify({ name: NAME, lektionId: lid, erledigt: an }) });
        erledigt = new Set(r.erledigt); $("gesamt").style.width = r.prozent + "%";
        btn.classList.toggle("an", an); btn.textContent = an ? "✓ Erledigt" : "Als erledigt markieren"; $("l-" + lid).classList.toggle("fertig", an);
      } catch (e) { alert(e.message); }
      btn.disabled = false;
    });
  } catch (e) { $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
$("zurueck").onclick = liste;
liste();
</script>
</body>
</html>
