<style>

<body>
<header>
  <div class="av"><img id="agFoto" src="mina-foto.jpg" alt="" style="width:100%;height:100%;object-fit:cover"></div>
  <div><h1 id="agName">Mina</h1><div class="s" id="agTitel">Social Media · SW Digital Tax</div></div>
  <div class="tabs"><button id="tChat" class="an">💬 Chat</button><button id="tThe">💡 Themen</button><button id="tEnt">📝 Entwürfe</button><button id="tAuf">📌 Aufträge</button><button id="tWis">🧠 Gedächtnis</button></div>
</header>
<main id="liste"><div class="tipp">Lade …</div></main>
<footer id="fuss">
  <div class="vor" id="vor"></div>
  <textarea id="text" maxlength="4000" placeholder="Schreib Mina … z. B. „Mach mir einen Post zur Grundsteuer“"></textarea>
  <div class="zeile"><label><input type="checkbox" id="auftrag"> auch als Auftrag fürs Team merken (Morgen-Lauf)</label><button class="k" id="senden">Senden</button></div>
  <div class="hilfe">Kostenlos: <b>„Merk dir: …“</b> · <b>„Was weißt du?“</b> · dieselbe Frage nochmal. Internet-Recherche: <b>„recherchiere: …“</b> (ca. 5 ct) · frische Antwort statt Wiederholung: <b>„neu: …“</b></div>
</footer>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/mina";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
const kopf = h => ({ "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), ...h });
const uhr = am => am ? new Date(am).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
// kleines Markdown: **fett**, Links, Aufzählungen, Absätze
function md(t) {
  let h = esc(t).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const zeilen = h.split(/\n/); let out = "", liste = false;
  for (const z of zeilen) { const m = z.match(/^\s*[-•*]\s+(.*)/); if (m) { if (!liste) { out += "<ul>"; liste = true; } out += "<li>" + m[1] + "</li>"; } else { if (liste) { out += "</ul>"; liste = false; } out += z ? z + "<br>" : "<br>"; } }
  return (liste ? out + "</ul>" : out).replace(/(<br>){3,}/g, "<br><br>");
}
let DATEN = null, ansicht = "chat", wartet = false;
// Social-Media-Team (11.10.2026): dasselbe Fenster für Mina (Chefin), Leon (Recherche) und Sophie (Content)
const AGENT = (new URLSearchParams(location.search).get("agent") || "mina").toLowerCase();
const TEAM = {
  mina: { name: "Mina", titel: "Chefin Social Media · SW Digital Tax", foto: "mina-foto.jpg", gruss: "Hallo, ich bin Mina 👋 Ich leite unser Social-Media-Team: Leon sucht Themen und Quellen, Sophie macht daraus Posts und Canva-Bilder, ich prüfe alles und lege es dir zur Freigabe hin. Gepostet wird nie automatisch. Was soll das Team für dich tun?",
    vor: ["Was weißt du?", "Was liegt gerade zur Freigabe?", "recherchiere: Welche Steuer-News gibt es heute?", "Schreib eine Story-Idee für Freitag"] },
  leon: { name: "Leon", titel: "Recherche · Social Media", foto: "leon-foto.jpg", gruss: "Hallo, ich bin Leon 👋 Ich finde Themen für eure Posts, prüfe Fakten und Fristen – und zwar nur in den Quellen, die auf der Wissens-Seite „Quellen & Ideen“ stehen. Jede Aussage bekommt eine Quelle. Wonach soll ich suchen?",
    vor: ["Welche Fristen kommen in den nächsten 14 Tagen?", "recherchiere: Was ist neu für Online-Händler?", "Schlag mir 3 Themen für nächste Woche vor", "Stimmt das: …"] },
  sophie: { name: "Sophie", titel: "Content · Social Media", foto: "sophie-foto.jpg", gruss: "Hallo, ich bin Sophie 👋 Ich mache aus Leons Themen fertige Posts: Kachel-Texte, Bildunterschrift, Hashtags, Karussells und Reel-Skripte – und baue die Bilder in Canva in eurem Stil. Woran soll ich arbeiten?",
    vor: ["Mach aus dem neuesten Thema ein Karussell", "Schreib ein Reel-Skript für Waldemar (30 Sekunden)", "Gib mir 3 Headlines zur Grundsteuer", "Wie sieht unser Stil aus?"] },
}[AGENT] || null;
const AG = TEAM ? AGENT : "mina", AGD = TEAM || { name: "Mina", titel: "Social Media", foto: "mina-foto.jpg", gruss: "", vor: [] };
document.title = AGD.name + " · Social Media"; document.getElementById("agName").textContent = AGD.name; document.getElementById("agTitel").textContent = AGD.titel; document.getElementById("agFoto").src = AGD.foto;
document.getElementById("text").placeholder = "Schreib " + AGD.name + " …";
const VORSCHLAEGE = AGD.vor;
function zeichnen() {
  if (!DATEN) return;
  $("tChat").classList.toggle("an", ansicht === "chat"); $("tAuf").classList.toggle("an", ansicht === "auf"); $("tWis").classList.toggle("an", ansicht === "wis");
  $("tEnt").classList.toggle("an", ansicht === "ent"); $("tThe").classList.toggle("an", ansicht === "the");
  if (ansicht === "the") {
    $("fuss").style.display = "none";
    const T = DATEN.themen || [], STT = { neu: "neu", in_arbeit: "in Arbeit", verwendet: "→ Post gemacht", verworfen: "verworfen" };
    $("liste").innerHTML = '<div class="tipp">Leons Themen mit Quellen – Sophie macht daraus Posts, Mina prüft. Neue Themen kommen mit Leons Morgen-Lauf.</div>'
      + (T.length ? T.map(t => `<div class="e"><h3>${esc(t.titel)}<span class="st ${t.status === "neu" ? "neu" : t.status === "verwendet" ? "freigegeben" : "verworfen"}">${STT[t.status] || esc(t.status)}</span></h3>
        <div class="meta">${esc([t.rubrik, t.zielgruppe, t.postTag ? "für " + new Date(t.postTag).toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" }) : ""].filter(Boolean).join(" · "))} · ${uhr(t.am)}</div>
        ${t.begruendung ? '<div class="txt">' + md(t.begruendung) + '</div>' : ""}
        ${(t.quellen || []).length ? '<div class="meta" style="margin-top:6px">Quellen: ' + t.quellen.map(q => /^https?:/.test(q) ? '<a href="' + esc(q) + '" target="_blank" rel="noopener">' + esc(q.replace(/^https?:\/\/(www\.)?/, "").slice(0, 50)) + '</a>' : esc(q)).join(" · ") + '</div>' : ""}</div>`).join("")
        : '<div class="tipp">Noch keine Themen. Leon legt sie bei seinem Morgen-Lauf hier ab.</div>');
    return;
  }
  if (ansicht === "ent") {
    $("fuss").style.display = "none";
    const E = DATEN.entwuerfe || [], darf = DATEN.stufe === "arbeiten", ST = { neu: "wartet auf dich", freigegeben: "✓ freigegeben", aendern: "Änderung gewünscht", verworfen: "verworfen" };
    $("liste").innerHTML = '<div class="tipp">Minas Entwürfe aus ihrem Morgen-Lauf (in Claude). Freigeben = darf so gepostet werden · Ändern lassen = Mina überarbeitet ihn beim nächsten Lauf. Gepostet wird nichts automatisch.</div>'
      + (E.length ? E.map(e => `<div class="e"><h3>${esc(e.titel)}<span class="st ${esc(e.status)}">${ST[e.status] || esc(e.status)}</span></h3>
        <div class="meta">${e.agent && e.agent !== "mina" ? "von " + (e.agent === "sophie" ? "Sophie" : e.agent === "leon" ? "Leon" : esc(e.agent)) + " · " : ""}${e.geprueft ? (e.pruefungOk ? "✓ von Mina geprüft · " : "⚠ Mina: " + esc(e.pruefHinweis || "bitte prüfen") + " · ") : ""}${esc(e.rubrik || "")}${e.postTag ? " · für " + new Date(e.postTag).toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "2-digit" }) : ""} · erstellt ${uhr(e.am)}${e.statusVon ? " · " + esc(e.statusVon) : ""}</div>
        ${e.kommentar ? '<div class="meta">✎ Wunsch: ' + esc(e.kommentar) + '</div>' : ""}
        <div class="txt">${md(e.text)}${e.story ? "<br><b>Story:</b><br>" + md(e.story) : ""}</div>
        <div class="eb">${e.canvaLink ? '<a href="' + esc(e.canvaLink) + '" target="_blank" rel="noopener">🎨 Bild in Canva</a>' : ""}${darf && e.status !== "freigegeben" ? '<button class="ok" data-e="' + esc(e.id) + '" data-s="freigegeben">✔ Freigeben</button>' : ""}${darf ? '<button data-e="' + esc(e.id) + '" data-s="aendern">✎ Ändern lassen</button><button data-e="' + esc(e.id) + '" data-s="verworfen">✗ Verwerfen</button>' : ""}</div></div>`).join("")
        : '<div class="tipp">Noch keine Entwürfe. Mina legt sie bei ihrem nächsten Morgen-Lauf hier ab (oder in Claude bei „Mina – Social Media“ auf „Run now“ klicken).</div>');
    document.querySelectorAll("[data-e]").forEach(b => b.onclick = () => entwurf(b.dataset.e, b.dataset.s));
    return;
  }
  if (ansicht === "wis") {
    $("fuss").style.display = "none";
    const W = DATEN.wissen || [], darf = DATEN.stufe === "arbeiten";
    $("liste").innerHTML = '<div class="tipp">Das weiß Mina dauerhaft – in jedem Gespräch, für alle. Kostenlos. Sie merkt sich Wichtiges auch selbst aus dem Gespräch.</div>'
      + (darf ? '<div class="neu"><input id="wisNeu" maxlength="500" placeholder="z. B. Freitags immer ein Teamfoto vorschlagen"><button class="k" id="wisDazu">Merken</button></div>' : "")
      + (W.length ? W.map(w => `<div class="a"><div>${esc(w.text)}<div class="s">${esc(w.von || "")} · ${uhr(w.am)}</div></div>${darf ? `<button class="x" data-w="${esc(w.id)}" title="Vergessen">✗</button>` : ""}</div>`).join("") : '<div class="tipp">Noch nichts gemerkt.</div>');
    if ($("wisDazu")) { $("wisDazu").onclick = () => wissen({ text: $("wisNeu").value }); $("wisNeu").onkeydown = e => { if (e.key === "Enter") wissen({ text: $("wisNeu").value }); }; }
    document.querySelectorAll("[data-w]").forEach(b => b.onclick = () => wissen({ id: b.dataset.w, loeschen: true }));
    return;
  }
  $("fuss").style.display = ansicht === "chat" && DATEN.stufe === "arbeiten" ? "" : "none";
  if (ansicht === "auf") {
    const A = DATEN.auftraege || [];
    $("liste").innerHTML = '<div class="tipp">Aufträge an Mina – sie berücksichtigt offene Aufträge bei ihrem Morgen-Lauf.</div>'
      + (A.length ? A.map(a => `<div class="a ${a.status === "erledigt" ? "erl" : ""}"><input type="checkbox" data-a="${esc(a.id)}" ${a.status === "erledigt" ? "checked" : ""} ${DATEN.stufe === "arbeiten" ? "" : "disabled"}><div>${esc(a.text)}<div class="s">${esc(a.von || "")} · ${uhr(a.am)}</div></div></div>`).join("") : '<div class="tipp">Noch keine Aufträge. Im Chat „auch als Auftrag merken“ anhaken.</div>');
    document.querySelectorAll("[data-a]").forEach(c => c.onchange = () => auftragStatus(c.dataset.a, c.checked ? "erledigt" : "offen"));
    return;
  }
  const C = DATEN.chat || [];
  $("liste").innerHTML = (C.length ? "" : '<div class="m mina">' + esc(AGD.gruss) + '</div>')
    + C.map(m => `<div class="m ${m.rolle === "mina" ? "mina" : "du"}">${md(m.text)}</div><div class="zeit ${m.rolle === "mina" ? "" : "du"}">${m.rolle === "mina" ? AGD.name : "Du"} · ${uhr(m.am)}${m.rolle === "mina" ? (m.ohneKi ? ' · <span class="kost frei">kostenlos</span>' : (m.usd != null ? ' · <span class="kost">≈ ' + (m.usd * 100 * ((DATEN && DATEN.eurKurs) || 0.86)).toLocaleString("de-DE", { maximumFractionDigits: 1 }) + ' Cent' + (m.suche ? ' · mit Recherche' : '') + '</span>' : "")) : ""}</div>`).join("")
    + (wartet ? '<div class="m mina">✍️ ' + AGD.name + ' schreibt … (mit Recherche kann das bis zu einer Minute dauern)</div>' : "");
  $("vor").innerHTML = C.length ? "" : VORSCHLAEGE.map(v => `<button>${esc(v)}</button>`).join("");
  $("vor").querySelectorAll("button").forEach(b => b.onclick = () => { $("text").value = b.textContent; $("text").focus(); });
  $("liste").scrollTop = $("liste").scrollHeight;
}
async function laden() {
  try { const r = await fetch(API + "?agent=" + AG, { headers: kopf({}) }); const d = await r.json(); if (!r.ok) throw new Error(d.error || "Fehler"); DATEN = d; zeichnen(); }
  catch (e) { $("fuss").style.display = "none"; $("liste").innerHTML = `<div class="tipp">${esc(/ausweis/.test(e.message) ? "Bitte das Büro kurz neu entsperren." : e.message)}</div>`; }
}
async function senden() {
  const t = $("text").value.trim(); if (!t || wartet) return;
  wartet = true; $("senden").disabled = true; DATEN.chat = [...(DATEN.chat || []), { rolle: "du", text: t, am: new Date().toISOString() }]; $("text").value = ""; zeichnen();
  try {
    const r = await fetch(API + "/chat", { method: "POST", headers: kopf({ "Content-Type": "application/json" }), body: JSON.stringify({ text: t, auftrag: $("auftrag").checked, agent: AG }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Fehler");
    $("auftrag").checked = false; wartet = false; await laden();
  } catch (e) { wartet = false; DATEN.chat.push({ rolle: "mina", text: "⚠️ " + e.message, am: new Date().toISOString() }); zeichnen(); }
  $("senden").disabled = false;
}
async function entwurf(id, status) {
  let kommentar = "";
  if (status === "aendern") { kommentar = prompt("Was soll Mina ändern?") || ""; if (!kommentar.trim()) return; }
  try { await fetch(API + "/entwurf", { method: "POST", headers: kopf({ "Content-Type": "application/json" }), body: JSON.stringify({ id, status, kommentar }) }); } catch { /* egal */ }
  laden();
}
async function wissen(body) {
  if (!body.id && !(body.text || "").trim()) return;
  try { await fetch(API + "/wissen", { method: "POST", headers: kopf({ "Content-Type": "application/json" }), body: JSON.stringify(body) }); } catch { /* egal */ }
  laden();
}
async function auftragStatus(id, status) {
  try { await fetch(API + "/auftrag", { method: "POST", headers: kopf({ "Content-Type": "application/json" }), body: JSON.stringify({ id, status }) }); } catch { /* egal */ }
  laden();
}
$("senden").onclick = senden;
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); senden(); } });
$("tChat").onclick = () => { ansicht = "chat"; zeichnen(); }; $("tAuf").onclick = () => { ansicht = "auf"; zeichnen(); }; $("tWis").onclick = () => { ansicht = "wis"; zeichnen(); }; $("tEnt").onclick = () => { ansicht = "ent"; zeichnen(); }; $("tThe").onclick = () => { ansicht = "the"; zeichnen(); };
(async () => { for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100)); try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch {} laden(); })();
</script>
