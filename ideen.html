<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meine Ideen</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:2; background:#0f766e; color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:18px; flex:1; } header .schloss { font-size:12px; font-weight:700; opacity:.9; }
  main { padding:14px; display:flex; flex-direction:column; gap:10px; }
  .box { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:12px; }
  label { display:block; font-size:12px; font-weight:700; color:#475569; margin:8px 0 4px; }
  input, select, textarea { width:100%; font:inherit; font-size:14px; padding:8px 10px; border:1.5px solid #cbd5e1; border-radius:8px; background:#fff; color:#0f172a; }
  textarea { min-height:60px; resize:vertical; }
  .reihe { display:flex; gap:8px; } .reihe > * { flex:1; }
  button { font:inherit; font-size:14px; font-weight:700; border-radius:9px; padding:9px 12px; cursor:pointer; border:1.5px solid #0d9488; background:#0d9488; color:#fff; }
  button.leicht { background:#fff; color:#0f766e; } button.klein { font-size:12px; padding:5px 9px; }
  .idee { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:10px 12px; }
  .idee.erledigt { opacity:.6; } .idee.erledigt .t { text-decoration:line-through; }
  .t { font-weight:700; font-size:14px; } .m { font-size:12px; color:#64748b; margin-top:3px; } .x { font-size:13px; margin-top:6px; white-space:pre-wrap; }
  .prio { font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; margin-left:6px; }
  .p-hoch { background:#fee2e2; color:#b91c1c; } .p-mittel { background:#fef9c3; color:#a16207; } .p-niedrig { background:#dcfce7; color:#15803d; }
  .aktionen { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .fehler { color:#b91c1c; font-size:13px; font-weight:600; min-height:18px; margin-top:6px; }
  .leer { color:#64748b; text-align:center; padding:20px 0; }
  /* Layout A (09.10.2026, Sam): Reiter Offen / In Arbeit / Erledigt / Archiv, Suche, Filter, Sortieren */
  .reiter { display:flex; gap:6px; flex-wrap:wrap; } .reiter button { font-size:12.5px; padding:6px 12px; border-radius:999px; background:#e2e8f0; border-color:#e2e8f0; color:#334155; }
  .reiter button.an { background:#0d9488; border-color:#0d9488; color:#fff; } .reiter b { margin-left:5px; opacity:.8; }
  .filter { display:flex; gap:6px; flex-wrap:wrap; align-items:center; } .filter select, .filter input { width:auto; font-size:12.5px; padding:6px 8px; }
  .filter .such { flex:1; min-width:140px; } .chip { font-size:12px; padding:6px 10px; border-radius:8px; background:#fff; color:#0f766e; } .chip.an { background:#0d9488; color:#fff; }
  .tag { font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; margin-left:6px; background:#ccfbf1; color:#0f766e; }
  .faellig { color:#b91c1c; font-weight:700; } .idee .t { cursor:pointer; }
  html.glas #inhalt .reiter button { background:rgba(255,255,255,.1) !important; border-color:transparent !important; color:rgba(255,255,255,.75) !important; }
  html.glas #inhalt .reiter button.an { background:rgba(20,184,166,.35) !important; color:#5eead4 !important; } html.glas #inhalt .chip { background:rgba(0,0,0,.3) !important; color:#e2e8f0 !important; }
  html.glas #inhalt .chip.an { background:rgba(20,184,166,.35) !important; color:#5eead4 !important; } html.glas .tag { background:rgba(94,234,212,.15); color:#5eead4; } html.glas .faellig { color:#fca5a5; }
  /* Variante 4 (09.10.): kompakte Zeilen */
  .liste { display:flex; flex-direction:column; gap:5px; } .gruppe { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#64748b; margin:6px 2px 0; }
  .zeile { background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; } .zeile.auf { border-color:#0d9488; } .zeile.fertig .tt { opacity:.6; }
  .kopfz { display:grid; grid-template-columns:10px 1fr auto 22px; gap:10px; align-items:center; padding:8px 10px; cursor:pointer; }
  .punkt { width:9px; height:9px; border-radius:50%; } .phoch { background:#ef4444; } .pmittel { background:#f59e0b; } .pniedrig { background:#22c55e; }
  .tt { font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .nz { font-size:11px; opacity:.7; }
  .fr { font-size:12px; color:#64748b; white-space:nowrap; } .rot { color:#dc2626; font-weight:700; } .mehr { color:#94a3b8; font-weight:800; text-align:center; }
  .detail { padding:0 12px 10px 30px; } .detail .aktionen { margin-top:6px; }
  html.glas .zeile { background:rgba(10,11,14,.55) !important; border-color:rgba(255,255,255,.18) !important; } html.glas .zeile.auf { border-color:#5eead4 !important; }
  html.glas .gruppe, html.glas .fr, html.glas .mehr { color:rgba(255,255,255,.65) !important; } html.glas .rot { color:#fca5a5 !important; }
  /* Variante 4 (Glas wird fest beim Arbeiten) steht seit 09.10. für alle Fenster in glas.css */
</style>
<script src="glas.js?v=1791559958"></script>
</head>
<body>
<header><span style="font-size:22px">💡</span><h1 id="kopf">Meine Ideen</h1><span class="schloss">🔒 nur du</span></header>
<main id="inhalt"><div class="leer">Lade …</div></main>
<script>
// „Meine Ideen“ im virtuellen Büro (08.10.2026, Sam) — dasselbe Board wie im Dashboard. Privat: Zugriff nur mit dem
// Büro-Ausweis (einmal pro Gerät Benutzername + Büro-PIN), der Token liegt nur in diesem Browser.
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = { holen: () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } }, setzen: t => { try { t ? localStorage.setItem("swBueroAusweis", t) : localStorage.removeItem("swBueroAusweis"); } catch {} } };
async function api(pfad, opt = {}) {
  const r = await fetch(API + pfad, { ...opt, headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis.holen(), "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && /ausweis/.test(d.error || "")) { ausweis.setzen(""); throw new Error("ausweis"); }
  if (!r.ok) throw new Error(d.error || "Fehler"); return d;
}
function ausweisFormular(meldung) {
  $("kopf").textContent = "Büro-Ausweis";
  $("inhalt").innerHTML = `<div class="box"><div style="font-size:14px">Einmal pro Gerät: damit nur <b>du</b> deine Ideen siehst.</div>
    <div class="m">Die Büro-PIN erzeugst du im Dashboard auf der Startseite unter 🔑 Büro-PIN.</div>
    <label>Benutzername</label><input id="ben" autocomplete="username">
    <label>Büro-PIN</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7">
    <div class="fehler" id="fe">${esc(meldung || "")}</div><button id="los" style="width:100%">Ausweis speichern</button></div>`;
  $("los").onclick = async () => {
    $("los").disabled = true; $("fe").textContent = "";
    try {
      const r = await fetch(API + "/ausweis", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: $("ben").value.trim(), pin: $("pin").value.trim() }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || (r.status === 429 ? "Zu viele Versuche – bitte 15 Minuten warten." : "Fehler"));
      ausweis.setzen(d.token); laden();
    } catch (e) { $("fe").textContent = e.message; $("los").disabled = false; }
  };
}
// Layout A + Variante 4 (09.10.2026, Sam: „teils unübersichtlich, Transparent zum Arbeiten nervt“ → „mach 4“):
// kompakte Liste (eine Zeile pro Idee, Farbpunkt = Priorität, Frist rechts), gruppiert nach Fälligkeit, Filter hinter „Filter ▾“,
// Klick auf eine Zeile klappt Notiz + Knöpfe auf. Glas bleibt — sobald die Maus im Fenster ist oder man tippt, wird es fest (CSS oben).
const PRIO = { hoch: "Hoch", mittel: "Mittel", niedrig: "Niedrig" }, PRIO_RANG = { hoch: 0, mittel: 1, niedrig: 2 };
const REITER = [["offen", "Offen"], ["in_bearbeitung", "In Arbeit"], ["erledigt", "Erledigt"], ["archiviert", "🗄 Archiv"]];
const S = { reiter: "offen", suche: "", thema: "", prio: "", faellig: false, sort: "frist", neu: false, filter: false, auf: null, daten: null };
const heute = () => new Date().toLocaleDateString("sv-SE");
const plusTage = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
const kurz = f => new Date(f + "T12:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
function fristKurz(f) {
  if (!f) return "–"; const h = heute();
  if (f < h) return '<span class="rot">überfällig</span>'; if (f === h) return '<span class="rot">heute</span>'; if (f === plusTage(1)) return '<span class="rot">morgen</span>';
  return kurz(f);
}
async function setzeStatus(id, status) { try { await api("/ideen/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify({ status }) }); S.auf = null; await laden(); } catch (e) { if (e.message === "ausweis") ausweisFormular(); else alert(e.message); } }
function zeile(n) {
  const k = (w, t, haupt) => `<button class="klein${haupt ? "" : " leicht"}" data-s="${esc(n._id)}" data-w="${w}">${t}</button>`;
  const akt = n.status === "offen" ? k("erledigt", "✓ Erledigt", 1) + k("in_bearbeitung", "In Arbeit") + k("archiviert", "🗄 Archivieren")
    : n.status === "in_bearbeitung" ? k("erledigt", "✓ Erledigt", 1) + k("offen", "↺ Offen") + k("archiviert", "🗄 Archivieren")
    : n.status === "erledigt" ? k("offen", "↺ Wieder offen") + k("archiviert", "🗄 Archivieren")
    : k("offen", "↺ Wiederherstellen", 1) + `<button class="klein leicht" data-l="${esc(n._id)}">🗑 Endgültig löschen</button>`;
  const offen = S.auf === n._id;
  return `<div class="zeile${offen ? " auf" : ""}${n.status === "erledigt" || n.status === "archiviert" ? " fertig" : ""}" data-z="${esc(n._id)}">
    <div class="kopfz"><span class="punkt p${esc(n.prioritaet || "mittel")}" title="${PRIO[n.prioritaet] || ""}"></span><span class="tt">${esc(n.titel)}${n.thema ? `<span class="tag">${esc(n.thema)}</span>` : ""}${n.text ? ' <span class="nz" title="hat Notiz">📝</span>' : ""}</span>
    <span class="fr">${fristKurz(n.frist)}</span><span class="mehr">${offen ? "▴" : "⋯"}</span></div>
    ${offen ? `<div class="detail">${n.text ? `<div class="x">${esc(n.text)}</div>` : ""}<div class="m">${PRIO[n.prioritaet] || ""}${n.thema ? " · " + esc(n.thema) : ""}${n.frist ? " · Frist " + new Date(n.frist + "T12:00:00").toLocaleDateString("de-DE") : ""}${n.erstellt ? " · erstellt " + new Date(n.erstellt).toLocaleDateString("de-DE") : ""}</div><div class="aktionen">${akt}</div></div>` : ""}</div>`;
}
function liste() {
  const alle = S.daten.ideen.map(n => ({ ...n, status: n.status || "offen" }));
  $("reiter").innerHTML = REITER.map(([k, t]) => `<button class="${k === S.reiter ? "an" : ""}" data-r="${k}">${t}<b>${alle.filter(n => n.status === k).length}</b></button>`).join("");
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { S.reiter = b.dataset.r; S.auf = null; liste(); });
  const q = S.suche.toLowerCase(), woche = plusTage(7);
  const l = alle.filter(n => n.status === S.reiter && (!q || (n.titel + " " + (n.text || "") + " " + (n.thema || "")).toLowerCase().includes(q))
    && (!S.thema || (n.thema || "") === S.thema) && (!S.prio || n.prioritaet === S.prio) && (!S.faellig || (n.frist && n.frist <= woche)));
  l.sort((a, b) => S.sort === "prio" ? (PRIO_RANG[a.prioritaet] ?? 1) - (PRIO_RANG[b.prioritaet] ?? 1) || (a.frist || "9").localeCompare(b.frist || "9")
    : S.sort === "neu" ? (b.erstellt || "").localeCompare(a.erstellt || "") : (a.frist || "9999").localeCompare(b.frist || "9999"));
  let html;
  if (!l.length) html = `<div class="leer">${S.suche || S.thema || S.prio || S.faellig ? "Keine Idee passt zu Suche/Filter." : S.reiter === "archiviert" ? "Das Archiv ist leer." : "Hier ist noch nichts."}</div>`;
  else if (S.reiter === "offen" || S.reiter === "in_bearbeitung") {
    const bald = l.filter(n => n.frist && n.frist <= woche), spaeter = l.filter(n => !(n.frist && n.frist <= woche));
    html = (bald.length ? `<div class="gruppe">Diese Woche fällig · ${bald.length}</div>` + bald.map(zeile).join("") : "") + (spaeter.length ? `<div class="gruppe">${bald.length ? "Später" : "Alle"} · ${spaeter.length}</div>` + spaeter.map(zeile).join("") : "");
  } else html = l.map(zeile).join("");
  $("liste").innerHTML = html;
  document.querySelectorAll("[data-z] .kopfz").forEach(z => z.onclick = () => { const id = z.parentNode.dataset.z; S.auf = S.auf === id ? null : id; liste(); });
  document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => setzeStatus(b.dataset.s, b.dataset.w));
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = async () => { if (!confirm("Idee endgültig löschen? Das geht nicht rückgängig.")) return; try { await api("/ideen/" + encodeURIComponent(b.dataset.l), { method: "DELETE" }); S.auf = null; laden(); } catch (e) { if (e.message === "ausweis") ausweisFormular(); else alert(e.message); } });
  const aktiv = (S.thema ? 1 : 0) + (S.prio ? 1 : 0) + (S.faellig ? 1 : 0) + (S.sort !== "frist" ? 1 : 0); $("filterAuf").textContent = "Filter" + (aktiv ? " (" + aktiv + ")" : "") + (S.filter ? " ▴" : " ▾");
}
async function laden() {
  if (!ausweis.holen()) return ausweisFormular();
  try {
    S.daten = await api("/ideen"); const d = S.daten;
    $("kopf").textContent = "Meine Ideen · " + String(d.name || "").split(" ")[0];
    const themen = [...new Set(d.ideen.map(n => n.thema).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
    if (S.thema && !themen.includes(S.thema)) S.thema = "";
    $("inhalt").innerHTML = `<div class="reiter" id="reiter"></div>
      <div class="filter"><input class="such" id="such" placeholder="🔍 Suchen …" value="${esc(S.suche)}"><button id="filterAuf" class="klein leicht">Filter ▾</button><button id="neuAuf" class="klein">${S.neu ? "× Schließen" : "+ Neu"}</button></div>
      <div class="filter" id="filterBox" style="display:${S.filter ? "flex" : "none"}"><select id="fThema"><option value="">Thema: alle</option>${themen.map(t => `<option${t === S.thema ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>
        <select id="fPrio"><option value="">Priorität: alle</option>${Object.entries(PRIO).map(([k, t]) => `<option value="${k}"${k === S.prio ? " selected" : ""}>${t}</option>`).join("")}</select>
        <button id="fFaellig" class="chip${S.faellig ? " an" : ""}">⏰ fällig diese Woche</button>
        <select id="fSort"><option value="frist"${S.sort === "frist" ? " selected" : ""}>Sortieren: Frist</option><option value="prio"${S.sort === "prio" ? " selected" : ""}>Sortieren: Priorität</option><option value="neu"${S.sort === "neu" ? " selected" : ""}>Sortieren: neueste</option></select></div>
      <div class="box" id="neuBox" style="display:${S.neu ? "block" : "none"}"><input id="nt" placeholder="Titel *" maxlength="200">
        <div class="reihe"><div><label>Thema</label><input id="nth" placeholder="z. B. Fibu" maxlength="60" list="themenListe"><datalist id="themenListe">${themen.map(t => `<option value="${esc(t)}">`).join("")}</datalist></div><div><label>Frist</label><input id="nf" type="date"></div>
        <div><label>Priorität</label><select id="np"><option value="hoch">Hoch</option><option value="mittel" selected>Mittel</option><option value="niedrig">Niedrig</option></select></div></div>
        <label>Notiz</label><textarea id="nx" maxlength="4000"></textarea><div class="fehler" id="fe"></div><button id="neu" style="width:100%">💡 Idee speichern</button></div>
      <div id="liste" class="liste"></div>`;
    $("such").oninput = e => { S.suche = e.target.value; liste(); };
    $("filterAuf").onclick = () => { S.filter = !S.filter; $("filterBox").style.display = S.filter ? "flex" : "none"; liste(); };
    $("fThema").onchange = e => { S.thema = e.target.value; liste(); }; $("fPrio").onchange = e => { S.prio = e.target.value; liste(); };
    $("fSort").onchange = e => { S.sort = e.target.value; liste(); }; $("fFaellig").onclick = () => { S.faellig = !S.faellig; $("fFaellig").classList.toggle("an", S.faellig); liste(); };
    $("neuAuf").onclick = () => { S.neu = !S.neu; $("neuBox").style.display = S.neu ? "block" : "none"; $("neuAuf").textContent = S.neu ? "× Schließen" : "+ Neu"; if (S.neu) $("nt").focus(); };
    $("neu").onclick = async () => {
      if (!$("nt").value.trim()) { $("fe").textContent = "Bitte einen Titel angeben"; return; }
      $("neu").disabled = true;
      try { await api("/ideen", { method: "POST", body: JSON.stringify({ titel: $("nt").value.trim(), thema: $("nth").value.trim(), frist: $("nf").value, prioritaet: $("np").value, text: $("nx").value }) }); S.neu = false; S.reiter = "offen"; laden(); }
      catch (e) { if (e.message === "ausweis") return ausweisFormular("Dein Ausweis ist nicht mehr gültig – bitte neu anmelden."); $("fe").textContent = e.message; $("neu").disabled = false; }
    };
    liste();
  } catch (e) { if (e.message === "ausweis") return ausweisFormular("Dein Ausweis ist nicht mehr gültig – bitte neu anmelden."); $("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
laden();
</script>
</body>
</html>
