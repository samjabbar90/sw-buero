    $("nein").onclick = async () => { try { malen(await api("/" + ID + "/ablehnen", { method: "POST", body: "{}" })); } catch (e) { schliessen(); } }; return; }
  $("inhalt").innerHTML = kopf + `<div class="mitte"><h1>${esc(a.mit)}</h1><p>${a.status === "abgelehnt" ? (a.rolle === "von" ? "hat gerade keine Zeit." : "Abgelehnt.") : a.status === "verpasst" ? "nicht erreicht." : "Gespräch beendet."}</p></div><button class="kn" id="zu" title="Schließen">✕</button>`;
  clearInterval(takt); $("zu").onclick = schliessen; setTimeout(schliessen, 3000);
}
async function laden() { try { malen(await api("/" + encodeURIComponent(ID))); } catch (e) { clearInterval(takt); $("inhalt").innerHTML = `<div class="gs">📵</div><h1>${esc(e.message)}</h1><p></p><div class="knoepfe"><div><button class="nein" id="zu" style="background:rgba(255,255,255,.2)">✓</button><small>Schließen</small></div></div>`; $("zu").onclick = zurueck; } }
// Seite weg (zurück, ✕, Fenster zu) während es klingelt oder läuft → Anruf beenden, sonst klingelt es beim anderen weiter (23.10.2026, Sam)
window.addEventListener("pagehide", () => { if (!["klingelt", "laeuft"].includes(letzterStatus)) return; letzterStatus = "beendet";
  try { fetch(B + "/" + encodeURIComponent(ID) + "/ende", { method: "POST", headers: H(), body: "{}", keepalive: true }); } catch (e) { /* egal */ } });
laden(); takt = setInterval(laden, 2000);
</script>
