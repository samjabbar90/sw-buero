<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Anruf</title>
<!-- 📞 Anrufen (23.10.2026, Sam: Variante C): ?id=<Anruf> – Anrufer sieht „Es klingelt bei …“, Angerufener „… ruft an – Annehmen / Ablehnen“.
     Sobald angenommen: Weiterleitung in den Gesprächsraum (WorkAdventure-Raum „anruf“, eigene Kabine). Im VBüro (Fenster) über WA.nav,
     am Handy direkt. Zurück geht es danach ins Büro bzw. ins Handy-Büro (anruf.js). Server: /buero-praesenz/anruf/… -->
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:linear-gradient(#0f766e,#0b4f4a); color:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .gs { width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; margin-bottom:18px; }
  .klingelt .gs { animation:puls 1.2s infinite; } @keyframes puls { 50% { box-shadow:0 0 0 18px rgba(255,255,255,.12); } }
  h1 { margin:0 0 6px; font-size:24px; } p { margin:0 0 26px; opacity:.85; font-size:15px; }
  .knoepfe { display:flex; gap:26px; }
  .knoepfe button { width:72px; height:72px; border-radius:50%; border:0; font-size:28px; cursor:pointer; color:#fff; }
  .ja { background:#22c55e; } .nein { background:#ef4444; }
  .knoepfe small { display:block; margin-top:6px; font-size:12.5px; opacity:.85; }
  .fe { margin-top:18px; color:#fecaca; font-size:14px; }
</style>
</head>
<body>
<div id="inhalt"><div class="gs">📞</div><h1>Einen Moment …</h1></div>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", B = "https://swdigitaltest.de/buero-praesenz/anruf";
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), ID = q.get("id") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
const SITZ = q.get("s") || ""; // im VBüro reicht die Büro-Sitzung (23.10.2026)
const H = () => SITZ && !ausweis() ? { "X-Buero-Key": KEY, "X-Buero-Sitzung": SITZ, "Content-Type": "application/json" } : { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Sitzung": SITZ, "Content-Type": "application/json" };
// im VBüro als Fenster geöffnet (Eltern-Seite ist WorkAdventure) – im Handy-Büro-Blatt dagegen nicht
const imBuero = window.top !== window && (location.ancestorOrigins ? [...location.ancestorOrigins].some(o => /workadventu/.test(o)) : /workadventu/.test(document.referrer));
const kuerzel = n => String(n || "?").split(/\s+/).map(t => t[0] || "").join("").slice(0, 2).toUpperCase();
let takt = null, weg = false, freiTakt = null;
// Freiton beim Anrufer (23.10.2026, Sam: „kein Geräusch, dass ich weiß, es klingelt“): 425 Hz, 1 s Ton alle 5 s wie im Telefonnetz.
// Im VBüro spielt ihn das Büro-Skript (swAktion „freiton“, wie die Klingel beim Angerufenen), im Handy-Büro diese Seite selbst.
let freiAudio = null;
function freiEinmal() { if (imBuero) { try { WA.player.state.saveVariable("swAktion", { was: "freiton", t: Date.now() }, { public: false, persist: false }); } catch (e) {} return; }
  try { freiAudio = freiAudio || new Audio("toene/freiton.wav"); freiAudio.currentTime = 0; freiAudio.play().catch(() => {}); } catch (e) {} }
function freiton(an) { if (an && !freiTakt) { freiEinmal(); freiTakt = setInterval(freiEinmal, 5000); } else if (!an && freiTakt) { clearInterval(freiTakt); freiTakt = null; try { freiAudio && freiAudio.pause(); } catch (e) {} } }
async function api(pfad, opt = {}) { const r = await fetch(B + pfad, { ...opt, headers: H() }); const d = await r.json().catch(() => ({})); if (r.status === 401) throw new Error("Bitte zuerst im Handy-Büro anmelden."); if (!r.ok) throw new Error(d.error || "Fehler"); return d; }
function ziel(a) { return a.raum + "&zurueck=" + (imBuero ? "buero" : "handy"); }
function gehe(url) { if (weg) return; weg = true; clearInterval(takt); freiton(false);
  try { if (imBuero && typeof WA !== "undefined" && WA.nav) return WA.nav.goToPage(url); } catch (e) { /* weiter unten */ }
  try { window.top.location.href = url; } catch (e) { location.href = url; } }
function zurueck() { freiton(false); if (imBuero) { try { WA.player.state.saveVariable("swAktion", { was: "allesZu", t: Date.now() }, { public: false, persist: false }); } catch (e) {} } else location.href = "handy.html"; }
// ---- Variante A (23.10.2026, Sam): Gespräch direkt hier, ohne Karte – Ton per WebRTC von Gerät zu Gerät (verschlüsselt).
// Unser Server reicht nur die Verbindungsdaten weiter (/anruf/:id/signal). STUN (Cloudflare/Google) sieht nur die IP-Adressen, keinen Ton.
// Nur wenn der Server modus „web“ meldet (Test Sam + Leutrim), sonst wie bisher der WorkAdventure-Gesprächsraum.
const STUN = [{ urls: "stun:stun.cloudflare.com:3478" }, { urls: "stun:stun.l.google.com:19302" }];
let pc = null, mikro = null, sigAb = 0, sigTakt = null, iceWarte = [], holt = false, gStart = 0, uhrTakt = null, sperre = null, stumm = false;
async function mikroHolen() { if (!mikro) mikro = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false }); return mikro; }
const signal = d => fetch(B + "/" + encodeURIComponent(ID) + "/signal", { method: "POST", headers: H(), body: JSON.stringify({ d }) }).catch(() => {});
function gespraechUI(a) {
  $("inhalt").innerHTML = `<div class="gs">${esc(kuerzel(a.mit))}</div><h1>${esc(a.mit)}</h1><p id="zust">Verbinde …</p><div id="diagT" style="margin:-18px 0 18px;font-size:12.5px;opacity:.8"></div><audio id="ton" autoplay playsinline></audio>
    <button id="tonAn" hidden style="margin:-12px 0 20px;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;background:#fff;color:#0f766e">🔊 Tippen zum Hören</button>
    <div class="knoepfe"><div><button id="stumm" style="background:rgba(255,255,255,.2)">🎙</button><small id="stummT">Stumm</small></div><div><button class="nein" id="auflegen">📵</button><small>Auflegen</small></div></div><div class="fe" id="fe"></div>`;
  $("tonAn").onclick = () => { $("ton").play().then(() => { $("tonAn").hidden = true; tonFehler = ""; }).catch(() => {}); };
  $("stumm").onclick = () => { stumm = !stumm; if (mikro) mikro.getAudioTracks().forEach(t => { t.enabled = !stumm; }); $("stumm").textContent = stumm ? "🔇" : "🎙"; $("stummT").textContent = stumm ? "Stumm aus" : "Stumm"; $("stumm").style.background = stumm ? "#f59e0b" : "rgba(255,255,255,.2)"; };
  $("auflegen").onclick = async () => { gespraechEnde(); try { malen(await api("/" + ID + "/ende", { method: "POST", body: "{}" })); } catch (e) { zurueck(); } };
}
function zustand() {
  const z = pc ? pc.connectionState : "closed", el = $("zust"); if (!el) return;
  if (z === "connected") { if (!gStart) { gStart = Date.now(); uhrTakt = setInterval(() => { const s = Math.floor((Date.now() - gStart) / 1000); if ($("zust")) $("zust").textContent = "🟢 " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }, 1000); } }
  else if (z === "disconnected") el.textContent = "Verbindung wackelt …";
  else if (z === "failed") el.textContent = "⚠️ Keine Verbindung möglich (Netz blockiert) – bitte über WLAN nochmal versuchen";
}
async function gespraechStarten(a) {
  if (pc) return;
  AKTUELL = a;
  try { await mikroHolen(); } catch (e) { mikroFehler = String(e && e.name || e).slice(0, 60); $("fe").textContent = "🎙 Kein Zugriff aufs Mikrofon – bitte im Browser erlauben."; }
  pc = new RTCPeerConnection({ iceServers: STUN });
  if (mikro) mikro.getTracks().forEach(t => pc.addTrack(t, mikro)); else pc.addTransceiver("audio", { direction: "recvonly" });
  pc.ontrack = e => { const el = $("ton"); if (!el) return; el.srcObject = e.streams[0] || new MediaStream([e.track]); el.play().then(() => { $("tonAn").hidden = true; tonFehler = ""; }).catch(e => { tonFehler = "blockiert:" + (e && e.name); $("tonAn").hidden = false; }); };
  pc.onicecandidate = e => { if (e.candidate) signal({ ice: e.candidate.toJSON() }); };
  pc.onconnectionstatechange = zustand;
  sigTakt = setInterval(abholen, 700); diagN = 0; diagTakt = setInterval(diag, 4000);
  if (a.rolle === "von") { const o = await pc.createOffer(); await pc.setLocalDescription(o); signal({ sdp: pc.localDescription.toJSON() }); }
  abholen();
  try { sperre = await navigator.wakeLock.request("screen"); } catch (e) { /* nicht überall */ } // Bildschirm bleibt an – sonst bricht iOS ab
}
async function abholen() {
  if (holt || !pc) return; holt = true;
  try {
    const d = await (await fetch(B + "/" + encodeURIComponent(ID) + "/signal?ab=" + sigAb, { headers: H() })).json(); sigAb = d.bis || sigAb;
    for (const m of d.neu || []) { if (!m || !pc) continue;
      if (m.sdp) { await pc.setRemoteDescription(m.sdp); for (const c of iceWarte.splice(0)) await pc.addIceCandidate(c).catch(() => {});
        if (m.sdp.type === "offer") { const an = await pc.createAnswer(); await pc.setLocalDescription(an); signal({ sdp: pc.localDescription.toJSON() }); } }
      else if (m.ice) { if (pc.remoteDescription) await pc.addIceCandidate(m.ice).catch(() => {}); else iceWarte.push(m.ice); } }
    if (["beendet", "abgelehnt", "verpasst"].includes(d.status)) { gespraechEnde(); laden(); }
  } catch (e) { /* nächstes Mal */ }
  holt = false;
}
// Diagnose (23.10.2026, „wir hören uns nicht“): alle 4 s die ersten 2 Minuten Zustand + Netzwege + Bytes an den Server (pm2-Log)
let diagTakt = null, diagN = 0, mikroFehler = "", tonFehler = "", bytesVorher = 0;
async function diag() {
  if (!pc || ++diagN > 30) { clearInterval(diagTakt); diagTakt = null; return; }
  const d = { rolle: AKTUELL && AKTUELL.rolle, handy: /iPhone|Android|Mobile/i.test(navigator.userAgent), mikro: mikro ? "ok" : (mikroFehler || "fehlt"), ton: tonFehler || "ok",
    pc: pc.connectionState, ice: pc.iceConnectionState, sig: pc.signalingState, lokal: [], fern: [], paar: "", rein: 0, raus: 0 };
  try { const st = await pc.getStats(); const kand = {};
    st.forEach(r => { if (r.type === "local-candidate") { kand[r.id] = r.candidateType + "/" + r.protocol; d.lokal.push(r.candidateType + "/" + r.protocol); }
      if (r.type === "remote-candidate") { kand[r.id] = r.candidateType + "/" + r.protocol; d.fern.push(r.candidateType + "/" + r.protocol); }
      if (r.type === "inbound-rtp" && r.kind === "audio") d.rein = r.bytesReceived || 0; if (r.type === "outbound-rtp" && r.kind === "audio") d.raus = r.bytesSent || 0; });
    st.forEach(r => { if (r.type === "candidate-pair" && r.state === "succeeded" && r.nominated) d.paar = (kand[r.localCandidateId] || "?") + " ↔ " + (kand[r.remoteCandidateId] || "?"); });
  } catch (e) { d.stats = String(e).slice(0, 80); }
  d.lokal = [...new Set(d.lokal)]; d.fern = [...new Set(d.fern)];
  if ($("zust") && pc.connectionState === "connected") { const kommt = d.rein > bytesVorher; bytesVorher = d.rein; const t = $("diagT"); if (t) t.textContent = kommt ? "Ton kommt an ✓" : "⚠️ Es kommt kein Ton an"; }
  fetch(B + "/" + encodeURIComponent(ID) + "/diag", { method: "POST", headers: H(), body: JSON.stringify(d) }).catch(() => {});
}
let AKTUELL = null;
function gespraechEnde() { if (diagTakt) { diag(); clearInterval(diagTakt); diagTakt = null; }
  clearInterval(sigTakt); clearInterval(uhrTakt); sigTakt = uhrTakt = null;
  try { pc && pc.close(); } catch (e) {} pc = null;
  try { mikro && mikro.getTracks().forEach(t => t.stop()); } catch (e) {} mikro = null;
  try { sperre && sperre.release(); } catch (e) {} sperre = null;
}
function malen(a) {
  if (a.modus === "web" && a.status === "laeuft") { freiton(false); if (!pc) { gespraechUI(a); gespraechStarten(a); } return; }
  if (pc) gespraechEnde();
  if (a.modus === "web" && a.status === "klingelt" && a.rolle === "von" && !mikro) mikroHolen().catch(() => {}); // Mikrofon-Frage schon beim Klingeln
  document.body.className = a.status === "klingelt" ? "klingelt" : "";
  freiton(a.status === "klingelt" && a.rolle !== "an" && !weg);
  const kopf = `<div class="gs">${esc(kuerzel(a.mit))}</div>`;
  if (a.status === "laeuft") { $("inhalt").innerHTML = kopf + `<h1>${esc(a.mit)}</h1><p>Verbinde mit dem Gesprächsraum …</p>`; return gehe(ziel(a)); }
  if (a.status === "klingelt" && a.rolle === "an") $("inhalt").innerHTML = kopf + `<h1>${esc(a.von)}</h1><p>ruft an …</p><div class="knoepfe"><div><button class="nein" id="nein">✕</button><small>Ablehnen</small></div><div><button class="ja" id="ja">📞</button><small>Annehmen</small></div></div><div class="fe" id="fe"></div>`;
  else if (a.status === "klingelt") $("inhalt").innerHTML = kopf + `<h1>${esc(a.an)}</h1><p>Es klingelt …</p><div class="knoepfe"><div><button class="nein" id="nein">✕</button><small>Auflegen</small></div></div>`;
  else { $("inhalt").innerHTML = kopf + `<h1>${esc(a.mit)}</h1><p>${a.status === "abgelehnt" ? (a.rolle === "von" ? "hat gerade keine Zeit." : "Abgelehnt.") : a.status === "verpasst" ? "nicht erreicht." : "Gespräch beendet."}</p><div class="knoepfe"><div><button class="nein" id="zu" style="background:rgba(255,255,255,.2)">✓</button><small>Schließen</small></div></div>`;
    clearInterval(takt); $("zu").onclick = zurueck; return; }
  if ($("ja")) $("ja").onclick = async () => { try { if (a.modus === "web") await mikroHolen().catch(() => {}); /* Mikrofon im Tipp freigeben (iPhone) */ malen(await api("/" + ID + "/annehmen", { method: "POST", body: "{}" })); } catch (e) { $("fe").textContent = e.message; } };
  if ($("nein")) $("nein").onclick = async () => { try { malen(await api("/" + ID + "/ablehnen", { method: "POST", body: "{}" })); } catch (e) { zurueck(); } };
}
async function laden() { try { malen(await api("/" + encodeURIComponent(ID))); } catch (e) { clearInterval(takt); $("inhalt").innerHTML = `<div class="gs">📵</div><h1>${esc(e.message)}</h1><p></p><div class="knoepfe"><div><button class="nein" id="zu" style="background:rgba(255,255,255,.2)">✓</button><small>Schließen</small></div></div>`; $("zu").onclick = zurueck; } }
laden(); takt = setInterval(laden, 2000);
</script>
</body>
</html>
