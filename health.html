<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health &amp; Wellbeing</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; background:#0f766e; color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header .unter { font-size:12.5px; opacity:.85; margin-top:2px; }
  main { padding:14px; display:flex; flex-direction:column; gap:12px; }
  .karte { background:#fff; border:1.5px solid #e2e8f0; border-radius:12px; padding:14px; }
  .gross { font-size:28px; font-weight:800; color:#0f766e; }
  .balken { height:10px; background:#e2e8f0; border-radius:5px; overflow:hidden; margin-top:8px; position:relative; }
  .balken > div { height:100%; background:linear-gradient(90deg,#14b8a6,#0d9488); }
  .ziel { position:absolute; top:-3px; width:2px; height:16px; background:#f59e0b; }
  .klein { font-size:12.5px; color:#64748b; margin-top:6px; }
  h2 { font-size:14px; margin:0 0 8px; }
  .aufgabe { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid #f1f5f9; }
  .aufgabe:first-of-type { border-top:0; }
  .haken { width:22px; height:22px; border-radius:50%; border:2px solid #cbd5e1; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .aufgabe.fertig .haken { background:#0d9488; border-color:#0d9488; }
  .aufgabe.fertig .t { text-decoration:line-through; color:#64748b; }
  .t { font-size:14px; font-weight:600; } .h { font-size:12px; color:#64748b; }
  .p { margin-left:auto; font-size:12px; font-weight:700; color:#0f766e; white-space:nowrap; }
  a.knopf { display:block; text-align:center; background:#0d9488; color:#fff; text-decoration:none; font-weight:700; border-radius:10px; padding:11px; }
  .leer { color:#64748b; text-align:center; padding:28px 0; }
</style>
<script src="glas.js?v=1791506622"></script>
</head>
<body>
<header><h1>❤️ Health &amp; Wellbeing</h1><div class="unter" id="unter">Fitnessraum</div></header>
<main id="inhalt"><div class="leer">Lade …</div></main>
<script>
// Health & Wellbeing am Empfang im Fitnessraum (08.10.2026, Sam) — zeigt den eigenen Stand aus dem Dashboard
// (nur lesen). Abhaken passiert im Dashboard, weil die Punkte zu einer Prämie führen.
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe";
const NAME = new URLSearchParams(location.search).get("name") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DASH = '<a class="knopf" href="https://swdigitaltest.de/dashboard.html" target="_blank" rel="noopener">Im Dashboard abhaken ↗</a>';
const liste = (titel, a) => a.length ? `<div class="karte"><h2>${titel}</h2>${a.map(x => `<div class="aufgabe${x.erledigt ? " fertig" : ""}"><div class="haken">${x.erledigt ? "✓" : ""}</div>
  <div><div class="t">${esc(x.titel)}${x.uebungDesTages ? " ⭐" : ""}</div><div class="h">${esc(x.hinweis || "")}${x.nachweis ? " · 📷 mit Nachweis" : ""}</div></div><div class="p">+${x.punkte}</div></div>`).join("")}</div>` : "";
(async () => {
  try {
    const r = await fetch("https://swdigitaltest.de/buero-praesenz/health?name=" + encodeURIComponent(NAME), { headers: { "X-Buero-Key": KEY } });
    const s = await r.json(); if (!r.ok) throw new Error(s.error || "Fehler");
    document.getElementById("unter").textContent = "Fitnessraum" + (s.vorname ? " · " + s.vorname : "");
    if (!s.aktiv) { document.getElementById("inhalt").innerHTML = `<div class="karte"><div class="t">Du hast die 6-Monats-Challenge noch nicht gestartet.</div>
      <div class="klein">Tägliche Übungen, Punkte sammeln – ab ${s.zielProzent} % wartet eine Prämie.</div></div><a class="knopf" href="https://swdigitaltest.de/dashboard.html" target="_blank" rel="noopener">Im Dashboard starten ↗</a>`; return; }
    const offen = s.heute.filter(a => !a.erledigt).length;
    document.getElementById("inhalt").innerHTML = `<div class="karte"><div class="gross">${s.prozent.toLocaleString("de-DE")} %</div>
      <div class="balken"><div style="width:${Math.min(100, s.prozent)}%"></div><span class="ziel" style="left:${s.zielProzent}%"></span></div>
      <div class="klein">${s.punkte} von ${s.maxPunkte} Punkten · Tag ${s.tag} von ${s.gesamtTage} · Ziel ${s.zielProzent} % ${s.freigeschaltet ? "· 🎉 Prämie freigeschaltet!" : ""}</div></div>
      ${s.beendet ? '<div class="karte"><div class="t">Deine Challenge ist beendet.</div></div>' : `<div class="klein" style="margin:0 2px">${offen ? `Heute noch ${offen} Aufgabe${offen === 1 ? "" : "n"} offen.` : "Heute ist alles erledigt – stark! 💪"}</div>`}
      ${liste("Heute", s.heute)}${liste("Diese Woche", s.wochenziele)}${DASH}`;
  } catch (e) { document.getElementById("inhalt").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
})();
</script>
</body>
</html>
