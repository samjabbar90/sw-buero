<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Info</title>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .pille { height:100%; width:100%; display:flex; align-items:center; justify-content:center; background:rgba(30,41,59,.9); border-radius:999px; padding:0 4px; color:#e2e8f0; font-size:13px; white-space:nowrap; }
  .teil { display:flex; align-items:center; gap:6px; padding:0 12px; height:28px; }
  .teil + .teil { border-left:1px solid rgba(255,255,255,.14); }
  b { color:#fff; font-weight:700; }
  button { font:inherit; border:0; cursor:pointer; color:inherit; background:transparent; }
  #tuer { border-radius:999px; }
  #tuer:hover { background:rgba(255,255,255,.08); }
  #fokus { background:#0d9488; color:#fff; font-weight:700; border-radius:999px; margin-left:4px; border-left:0 !important; }
  #fokus.an { background:#b45309; }
  /* News (08.10., Sam: Nr. 1 – Knopf in der Info-Leiste, rote Zahl = neu) */
  #news { position:relative; background:#0d9488; color:#fff; font-weight:700; border-radius:999px; margin-left:4px; border-left:0 !important; }
  /* Feierabend (09.10.): nur bei eingeschalteter Kernarbeitszeit (?kz=1) */
  #feierabend { background:#334155; color:#fff; font-weight:700; border-radius:999px; margin-left:4px; border-left:0 !important; }
  #feierabend:hover { background:#475569; }
  #news .zahl { position:absolute; top:-5px; right:-4px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:#ef4444; color:#fff; font-size:10px; line-height:16px; text-align:center; }
</style>
</head>
<body>
<div class="pille">
  <span class="teil">🕐 <b id="uhr">–</b></span>
  <button class="teil" id="tuer" style="display:none" title="Tippen: frei → besetzt → zu">–</button>
  <span class="teil" id="online" style="display:none" title="Heute zum ersten Mal im Büro">🟢 online seit <b id="seit">–</b>&nbsp;·&nbsp;<span id="dauer"></span></span>
  <span class="teil" title="Kollegen im Büro">👥 <b id="leute">–</b></span>
  <button class="teil" id="fokus" style="display:none" title="Fokus: 25 Min Tür auf „besetzt“">🎯</button>
  <button class="teil" id="feierabend" style="display:none" title="Arbeitszeit prüfen und Feierabend machen">🚪 Feierabend</button>
  <button class="teil" id="news" title="News öffnen">📰<span class="zahl" id="newsZahl" style="display:none"></span></button>
</div>
<script>
// Info-Leiste unten mittig (07.10.2026, Sam: Layout 2 statt Fenster oben rechts): Uhrzeit, eigene Tür (Tippen schaltet
// frei → besetzt → zu), Kollegen im Büro, Fokus (25 Min Tür auf „besetzt“, danach zurück + Pause-Hinweis). Nichts wird gespeichert.
const FOKUS_MIN = 25;
let meineVar = null, vorFokus = null;
const $ = id => document.getElementById(id);
const STATUS = { frei: '🟢 Tür <b>frei</b>', besetzt: '🟡 Tür <b>besetzt</b>', zu: '🔴 Tür <b>zu</b>' };

function fokusBis() { try { return Number(localStorage.getItem('swFokusBis') || 0); } catch { return 0; } }
function zeichnen() {
  $('uhr').textContent = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  try { $('leute').textContent = String([...WA.players.list()].length + 1); } catch { $('leute').textContent = '–'; }
  if (!meineVar) return;
  $('tuer').innerHTML = STATUS[WA.state[meineVar] || 'frei'] || STATUS.frei;
  const bis = fokusBis(), b = $('fokus');
  if (bis > Date.now()) { b.className = 'teil an'; b.textContent = '🎯 noch ' + Math.ceil((bis - Date.now()) / 60000) + ' Min ✕'; }
  else { b.className = 'teil'; b.textContent = '🎯'; if (bis) fokusEnde(true); }
}
function fokusEnde(abgelaufen) {
  try { localStorage.removeItem('swFokusBis'); } catch { /* egal */ }
  if (meineVar && WA.state[meineVar] === 'besetzt') WA.state.saveVariable(meineVar, vorFokus || 'frei');
  if (abgelaufen) { try { const m = WA.ui.displayActionMessage({ message: '☕ Fokuszeit vorbei – Zeit für eine kurze Pause!', callback: () => {} }); setTimeout(() => { try { m.remove(); } catch {} }, 10000); } catch {} }
}
$('fokus').addEventListener('click', () => {
  if (fokusBis() > Date.now()) { fokusEnde(false); return zeichnen(); }
  vorFokus = WA.state[meineVar] || 'frei';
  try { localStorage.setItem('swFokusBis', String(Date.now() + FOKUS_MIN * 60000)); } catch { /* egal */ }
  if (vorFokus !== 'zu') WA.state.saveVariable(meineVar, 'besetzt');
  zeichnen();
});
$('tuer').addEventListener('click', () => {
  const naechster = { frei: 'besetzt', besetzt: 'zu', zu: 'frei' }[WA.state[meineVar] || 'frei'] || 'frei';
  WA.state.saveVariable(meineVar, naechster);
});

// News: ungelesene zählen (gelesen = seit dem letzten Öffnen von news.html in diesem Browser, gleicher Speicher)
const NEWS_KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe";
async function newsZaehlen() {
  try {
    const news = await (await fetch("https://swdigitaltest.de/buero-praesenz/news", { headers: { "X-Buero-Key": NEWS_KEY } })).json();
    let gesehen = ""; try { gesehen = localStorage.getItem("swNewsGesehen") || ""; } catch { /* egal */ }
    const n = news.filter(x => !gesehen || String(x.am) > gesehen).length, z = $('newsZahl');
    z.textContent = n > 9 ? '9+' : String(n); z.style.display = n ? '' : 'none';
  } catch { /* nächster Versuch */ }
}
$('news').addEventListener('click', async () => {
  try { await WA.nav.openCoWebSite('https://samjabbar90.github.io/sw-buero/news.html?t=' + Date.now()); } catch { /* ältere Version */ }
  setTimeout(newsZaehlen, 4000);
});
newsZaehlen(); setInterval(newsZaehlen, 60000);
// Online seit (09.10., Sam: Layout 1): erstes Betreten heute laut Dashboard + wie lange schon
let seitMin = null;
async function onlineLaden() {
  try { const d = await (await fetch("https://swdigitaltest.de/buero-praesenz/online?name=" + encodeURIComponent(WA.player.name || ""), { headers: { "X-Buero-Key": NEWS_KEY } })).json();
    if (d && d.seit) { $('seit').textContent = d.seit; seitMin = d.seitMin; $('online').style.display = ''; onlineDauer(); } } catch { /* später */ }
}
function onlineDauer() { if (seitMin == null) return; const j = new Date(), m = j.getHours() * 60 + j.getMinutes() - seitMin; if (m >= 0) $('dauer').textContent = Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' h'; }
setInterval(onlineDauer, 30000);
if (new URLSearchParams(location.search).has('kz')) { $('feierabend').style.display = '';
  $('feierabend').addEventListener('click', () => { try { WA.player.state.saveVariable('swAktion', { was: 'feierabend', t: Date.now() }, { public: false, persist: false }); } catch { /* ältere Version */ } }); }

WA.onInit().then(async () => {
  try { await WA.players.configureTracking({ players: true, movement: false }); } catch { /* egal */ }
  try {
    let k = await (await fetch(WA.room.mapURL)).json();
    if (!k.layers && k.mapUrl) k = await (await fetch(new URL(k.mapUrl, WA.room.mapURL).toString())).json();
    const ich = String(WA.player.name || '').trim().split(/\s+/)[0].toLowerCase();
    const lauf = ls => ls.forEach(l => { if (l.type === 'group') lauf(l.layers || []); if (l.type === 'objectgroup') (l.objects || []).forEach(o => {
      const p = n => ((o.properties || []).find(x => x.name === n) || {}).value;
      if (p('tuerVariable') && String(p('besitzer')).toLowerCase() === ich) meineVar = p('tuerVariable');
    }); });
    lauf(k.layers || []);
  } catch { /* ohne Tür */ }
  if (meineVar) { $('tuer').style.display = ''; $('fokus').style.display = ''; WA.state.onVariableChange(meineVar).subscribe(zeichnen); }
  try { WA.players.onPlayerEnters.subscribe(zeichnen); WA.players.onPlayerLeaves.subscribe(zeichnen); } catch { /* egal */ }
  zeichnen(); setInterval(zeichnen, 20000);
  onlineLaden(); setInterval(onlineLaden, 5 * 60000);
});
</script>
</body>
</html>
