<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA · Assistenz</title>
<!-- NOVA (18.10.2026, Sam): persönliche KI-Assistentin im Vorzimmer von Sams Büro (Hologramm). Leertaste am Empfang – NUR Sam
     (main.ts novaPlatz + Server services/nova.js). Chat mit Claude Haiku. Aufbau wie ron.html. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f5; color: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255, 255, 255, .55); }
  header h1 { margin: 0; font-size: 15px; flex: 1; } header .u { font-size: 11.5px; color: #4b5563; font-weight: 400; display: block; }
  .av { width: 64px; height: 64px; border-radius: 50%; flex: none; position: relative; animation: atmen 4.5s ease-in-out infinite; }
  .av .holo { width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 34px; background: radial-gradient(circle, #99f6e4, #14b8a6); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #14b8a6, 0 0 18px #2dd4bf; }
  .av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgba(20, 184, 166, 0); }
  .av.denkt::after { animation: denken 1.2s ease-in-out infinite; }
  @keyframes atmen { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1px) scale(1.025); } }
  @keyframes denken { 0%, 100% { border-color: rgba(20, 184, 166, .15); transform: scale(1); } 50% { border-color: rgba(20, 184, 166, .9); transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .av, .av.denkt::after { animation: none; } }
  main { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .karte { background: rgba(255, 255, 255, .6); border: 1px solid rgba(255, 255, 255, .7); border-radius: 12px; padding: 10px 12px; }
  .karte h2 { margin: 0 0 6px; font-size: 13px; }
  .m { font-size: 11.5px; color: #4b5563; }
  #verlauf { display: flex; flex-direction: column; gap: 7px; max-height: 58vh; overflow-y: auto; padding: 2px; }
  .b { max-width: 86%; padding: 8px 11px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .b.nova { background: rgba(255, 255, 255, .85); align-self: flex-start; } .b.du { background: #ccfbf1; color: #134e4a; align-self: flex-end; }
  .eingabe { display: flex; gap: 6px; margin-top: 8px; }
  .eingabe textarea { flex: 1; font: inherit; font-size: 13.5px; border: 1.5px solid rgba(17, 24, 39, .2); border-radius: 10px; padding: 8px 10px; resize: none; min-height: 40px; background: rgba(255, 255, 255, .8); color: #111827; }
  .senden { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0 16px; background: #0f766e; color: #fff; cursor: pointer; } .senden:disabled { opacity: .5; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; } .chips button { font: inherit; font-size: 11.5px; border: 1px solid #5eead4; background: #fff; color: #115e59; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .leise { font: inherit; font-size: 12px; background: none; border: none; color: #6b7280; text-decoration: underline; cursor: pointer; }
  .fehler { color: #b91c1c; font-size: 12.5px; }
  :root.glas body { background: rgba(255, 255, 255, .15) !important; color: #111827 !important; text-shadow: none !important; }
  :root.glas body:hover, :root.glas body:focus-within { background: rgba(255, 255, 255, .88) !important; }
  :root.glas header { background: rgba(255, 255, 255, .45) !important; color: #111827 !important; }
  :root.glas .karte { background: rgba(255, 255, 255, .5) !important; color: #111827 !important; }
  :root.glas .m { color: #4b5563 !important; } :root.glas textarea { background: rgba(255, 255, 255, .8) !important; color: #111827 !important; color-scheme: light; }
</style>
<script src="glas.js?v=1792088168"></script>
</head>
<body>
<header><div class="av" id="av"><div class="holo">🤖</div></div><h1>NOVA · deine Assistentin<span class="u">nur für dich, Sam – sonst kann niemand mit ihr sprechen</span></h1></header>
<main>
  <div class="karte"><h2>💬 Sprich mit NOVA</h2>
    <div id="verlauf"><div class="m">Lädt …</div></div>
    <div class="chips" id="chips"></div>
    <div class="eingabe"><textarea id="text" rows="1" placeholder="z. B. „Schreib mir eine kurze Mail an …“"></textarea><button class="senden" id="los">Senden</button></div>
    <div class="fehler" id="fe"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span class="m" id="kosten"></span><button class="leise" id="neu">Neu anfangen</button></div>
  </div>
</main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/nova";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
async function api(pfad, body) {
  const opt = body === undefined ? {} : { method: "POST", body: JSON.stringify(body) };
  const r = await fetch(API + pfad, { ...opt, headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(/ausweis/.test(d.error || "") ? "Bitte das Büro kurz neu entsperren." : d.error || "Fehler " + r.status); return d;
}
let S = null, sendet = false;
function zeichnen() {
  const c = S.chat || [];
  $("verlauf").innerHTML = c.length ? c.map(m => `<div class="b ${m.rolle === "nova" ? "nova" : "du"}">${esc(m.text)}</div>`).join("")
    : '<div class="b nova">Hallo Sam! Ich bin NOVA ✨ deine Assistentin. Nur du kannst mit mir sprechen. Was kann ich für dich tun?</div>';
  $("verlauf").scrollTop = $("verlauf").scrollHeight;
  $("chips").innerHTML = c.length ? "" : ["Hilf mir, meinen Tag zu planen", "Schreib mir eine kurze Mail", "Gib mir 3 Ideen für die Kanzlei"].map(t => `<button data-t="${esc(t)}">${esc(t)}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { $("text").value = b.dataset.t; senden(); });
}
async function laden() { try { S = await api(""); $("fe").textContent = ""; zeichnen(); } catch (e) { $("verlauf").innerHTML = `<div class="fehler">${esc(e.message)}</div>`; } }
async function senden() {
  const t = $("text").value.trim(); if (!t || sendet || !S) return; sendet = true; $("los").disabled = true; $("fe").textContent = "";
  S.chat = [...(S.chat || []), { rolle: "du", text: t }, { rolle: "nova", text: "… NOVA denkt nach …" }]; zeichnen(); $("text").value = ""; $("av").classList.add("denkt");
  try { const r = await api("/chat", { text: t }); if (r.usd) $("kosten").textContent = "letzte Antwort ≈ " + (r.usd * 100 * 0.86).toFixed(2).replace(".", ",") + " Cent"; }
  catch (e) { $("fe").textContent = e.message; }
  sendet = false; $("los").disabled = false; $("av").classList.remove("denkt"); laden();
}
$("los").onclick = senden;
$("text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); senden(); } };
$("neu").onclick = async () => { if (!confirm("Den Chat mit NOVA leeren?")) return; try { await api("/neu", {}); laden(); } catch (e) { $("fe").textContent = e.message; } };
(async () => { for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100));
  try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch { /* ohne WA */ }
  if (!ausweis()) { $("verlauf").innerHTML = '<div class="fehler">Bitte zuerst das Büro entsperren (Anmelden), dann noch einmal die Leertaste drücken.</div>'; return; }
  laden(); })();
</script>
</body>
</html>
