<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Mein Menü</title>
<!-- Mini-Profilkarte (23.10.2026, Sam: Layout 3): Klick auf den eigenen Namen in der Leiste rechts öffnet links daneben diese Karte –
     oben Bild, Name, „online seit … · Tür …“, darunter 6 Kacheln: Kalender, Sammlungen, Zeit, Ideen, Profil, Feierabend.
     Die Knöpfe melden über swAktion ans Büro-Skript (gleiche Aktionen wie früher die Knöpfe oben); danach geht die Karte zu.
     ?name=&foto=&seit=<ms>&tuer=frei|zu|fokus -->
<script src="https://play.workadventu.re/iframe_api.js"></script>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent !important; color-scheme:dark; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:#fff; }
  .k { background:rgba(31,35,41,.97); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:10px; box-shadow:0 6px 20px rgba(0,0,0,.45); }
  .kopf { display:flex; gap:9px; align-items:center; }
  .bild { width:38px; height:38px; border-radius:50%; background:#5DCAA5 center/cover no-repeat; color:#04342C; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .n { font-size:13.5px; font-weight:600; } .s { font-size:11px; color:rgba(255,255,255,.7); margin-top:1px; }
  .zu { margin-left:auto; border:0; background:rgba(255,255,255,.12); color:#fff; border-radius:8px; width:24px; height:24px; cursor:pointer; font-size:12px; align-self:flex-start; }
  .g { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .g button { border:0; background:rgba(255,255,255,.08); color:#fff; border-radius:10px; padding:9px 0 7px; font:inherit; font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .g button:hover { background:rgba(255,255,255,.18); }
  .g svg { width:20px; height:20px; fill:none; stroke:#fff; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
</style>
</head>
<body>
<div class="k">
  <div class="kopf"><div class="bild" id="bild"></div><div><div class="n" id="name"></div><div class="s" id="status"></div></div><button class="zu" id="zu" title="Schließen">✕</button></div>
  <div class="g" id="g"></div>
</div>
<script>
const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const name = q.get("name") || "", foto = q.get("foto") || "", seit = Number(q.get("seit")) || 0, tuer = q.get("tuer") || "";
$("name").textContent = name;
if (/^https:\/\//.test(foto)) $("bild").style.backgroundImage = "url(" + JSON.stringify(foto) + ")"; else $("bild").textContent = name.split(/\s+/).map(t => t[0] || "").join("").slice(0, 2).toUpperCase();
const uhr = ms => new Date(ms).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
const TUER = { frei: "🟢 Tür frei", zu: "🔴 Tür zu", fokus: "🟣 Fokus" };
$("status").textContent = [seit ? "online seit " + uhr(seit) : "", TUER[tuer] || ""].filter(Boolean).join(" · ");
const SYM = { kalender: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>', pokedex: '<rect x="3" y="7" width="13" height="13" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/>',
  arbeitszeit: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', ideen: '<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',
  meinProfil: '<circle cx="12" cy="8" r="4"/><path d="M5 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/>', feierabend: '<path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/>' };
const KNOEPFE = [["kalender", "Kalender"], ["pokedex", "Sammlungen"], ["arbeitszeit", "Zeit"], ["ideen", "Ideen"], ["meinProfil", "Profil"], ["feierabend", "Feierabend"]];
$("g").innerHTML = KNOEPFE.map(([a, t]) => `<button data-a="${a}"><svg viewBox="0 0 24 24">${SYM[a]}</svg>${t}</button>`).join("");
const aktion = was => { try { WA.player.state.saveVariable("swAktion", { was, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); } };
document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => aktion(b.dataset.a)); // das Büro-Skript schließt die Karte dabei selbst
$("zu").onclick = () => aktion("meinMenueZu");
document.addEventListener("keydown", e => { if (e.key === "Escape") aktion("meinMenueZu"); });
</script>
</body>
</html>
