<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rangliste</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#f8fafc; color:#0f172a; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; background:#0f766e; color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; } header .u { font-size:12.5px; opacity:.85; margin-top:2px; }
  main { padding:12px; display:flex; flex-direction:column; gap:8px; }
  .z { display:flex; align-items:center; gap:10px; background:#fff; border:1.5px solid #e2e8f0; border-radius:10px; padding:9px 12px; }
  .z.ich { border-color:#0d9488; background:#ecfeff; }
  .n { width:140px; font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .b { flex:1; height:8px; background:#e2e8f0; border-radius:4px; position:relative; } .b > div { height:100%; border-radius:4px; background:#0d9488; }
  .z:first-child .b > div { background:#f59e0b; }
  .ziel { position:absolute; top:-4px; width:2px; height:16px; background:#f59e0b; }
  .p { width:58px; text-align:right; font-weight:700; color:#0f766e; font-size:13px; }
  .leer { color:#64748b; text-align:center; padding:28px 0; }
</style>
</head>
<body>
<header><h1>🏆 Rangliste</h1><div class="u" id="u">Health &amp; Wellbeing</div></header>
<main id="liste"><div class="leer">Lade …</div></main>
<script>
// Ganze Rangliste (08.10.2026, Sam: Tafel im Fitnessraum, Leertaste) — alle, die bei Health & Wellbeing mitmachen
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", M = ["🥇", "🥈", "🥉"];
const NAME = new URLSearchParams(location.search).get("name") || "";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
(async () => {
  try {
    const r = await fetch("https://swdigitaltest.de/buero-praesenz/health/rangliste?name=" + encodeURIComponent(NAME), { headers: { "X-Buero-Key": KEY } });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || "Fehler");
    document.getElementById("u").textContent = `Health & Wellbeing · ${d.liste.length} machen mit · Ziel ${d.zielProzent} %`;
    document.getElementById("liste").innerHTML = d.liste.length ? d.liste.map((x, i) => `<div class="z${x.ich ? " ich" : ""}"><span class="n">${i < 3 ? M[i] : (i + 1) + "."} ${esc(x.name)}${x.ich ? " (du)" : ""}${x.geschafft ? " 🎉" : ""}</span>
      <span class="b"><div style="width:${Math.min(100, x.prozent)}%"></div><span class="ziel" style="left:${d.zielProzent}%"></span></span><span class="p">${x.prozent.toLocaleString("de-DE")} %</span></div>`).join("")
      : '<div class="leer">Noch macht niemand mit – starte die Challenge im Dashboard.</div>';
  } catch (e) { document.getElementById("liste").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
})();
</script>
</body>
</html>
