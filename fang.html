<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gefangen!</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; color-scheme:dark; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .karte { position:absolute; inset:10px; border-radius:22px; background:radial-gradient(circle at 50% 38%, #fde68a 0%, #f59e0b 30%, #7c2d12 75%, #1c1917 100%);
    border:3px solid #fff; box-shadow:0 10px 30px rgba(0,0,0,.45); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; text-align:center;
    animation:rein .45s cubic-bezier(.2,1.4,.4,1) both; overflow:hidden; }
  .karte.erneut { background:radial-gradient(circle at 50% 38%, #bae6fd 0%, #0ea5e9 32%, #1e3a8a 75%, #0f172a 100%); }
  .strahlen { position:absolute; width:520px; height:520px; left:50%; top:38%; margin:-260px 0 0 -260px; opacity:.35;
    background:repeating-conic-gradient(rgba(255,255,255,.9) 0 8deg, transparent 8deg 22deg); animation:dreh 7s linear infinite; }
  .ball { position:relative; width:150px; height:150px; margin-top:-6px; }
  .ball img { width:150px; height:150px; image-rendering:pixelated; animation:huepf 1.2s ease-in-out infinite; filter:drop-shadow(0 6px 4px rgba(0,0,0,.4)); }
  h1 { position:relative; margin:6px 12px 2px; font-size:22px; text-shadow:0 2px 3px rgba(0,0,0,.45); }
  .unter { position:relative; font-size:15.5px; font-weight:600; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .stand { position:relative; margin-top:10px; background:rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.55); border-radius:999px; padding:6px 16px; font-weight:800; font-size:16px; }
  .funke { position:absolute; width:10px; height:10px; background:#fff; clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%); animation:funke 1.4s ease-out forwards; }
  @keyframes rein { from { transform:scale(.3) rotate(-8deg); opacity:0; } to { transform:none; opacity:1; } }
  @keyframes dreh { to { transform:rotate(360deg); } }
  @keyframes huepf { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  @keyframes funke { from { transform:translate(0,0) scale(1.4); opacity:1; } to { transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0; } }
</style>
</head>
<body>
<div class="karte" id="k"><div class="strahlen"></div><div class="ball"><img id="b" alt=""></div><h1 id="t"></h1><div class="unter" id="u"></div><div class="stand" id="s"></div></div>
<script>
// Fang-Anzeige (18.10.2026, Sam): „Du hast … gefangen“ bzw. „erneut gefangen“, darunter wie oft, und der Stand im Sammelbuch
const q = new URLSearchParams(location.search), nr = Number(q.get("nr")) || 25, name = q.get("name") || "Pokémon";
const neu = q.get("neu") === "1", anzahl = Number(q.get("anzahl")) || 1, arten = Number(q.get("arten")) || 0;
document.getElementById("b").src = "pokemon/" + String(nr).padStart(3, "0") + ".png?v=1";
document.getElementById("t").textContent = neu ? "✨ Neu! Du hast " + name + " gefangen!" : "Du hast " + name + " erneut gefangen!";
document.getElementById("u").textContent = neu ? "Das ist dein erstes " + name + "." : "Du hast " + name + " jetzt " + anzahl + "×.";
document.getElementById("s").textContent = "📕 " + arten + " / 151 im Sammelbuch";
if (!neu) document.getElementById("k").classList.add("erneut");
const k = document.getElementById("k");
for (let i = 0; i < 26; i++) { const f = document.createElement("div"); f.className = "funke"; const w = Math.random() * Math.PI * 2, r = 90 + Math.random() * 120;
  f.style.left = "50%"; f.style.top = "38%"; f.style.setProperty("--dx", Math.cos(w) * r + "px"); f.style.setProperty("--dy", Math.sin(w) * r + "px"); f.style.animationDelay = (Math.random() * .5) + "s";
  f.style.background = ["#fff", "#fde047", "#fca5a5", "#a5f3fc"][i % 4]; k.appendChild(f); }
</script>
</body>
</html>
