<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Büro gesperrt</title>
<!-- Büro-Schloss (09.10.2026, Sam: „nach dem Abmelden oder Schließen vom Fenster kommt man direkt wieder rein“):
     jedes Öffnen des Büros ist gesperrt, bis man E-Mail-Code oder Büro-PIN eingibt. Das Büro-Skript (main.ts) öffnet diese Seite
     bildschirmfüllend und wartet auf die Spieler-Variable „swSchloss“ = { sitzung, t }. -->
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:rgba(10,12,18,.94); color:#e2e8f0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; }
  .karte { width:100%; max-width:380px; background:rgba(30,34,44,.96); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:26px 24px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .schloss { font-size:44px; text-align:center; } h1 { margin:6px 0 4px; font-size:21px; text-align:center; }
  p.u { margin:0 0 18px; font-size:13px; text-align:center; color:#94a3b8; }
  label { display:block; font-size:12px; font-weight:700; color:#94a3b8; margin:12px 0 5px; }
  input { width:100%; font:inherit; font-size:15px; padding:10px 12px; border-radius:10px; border:1.5px solid rgba(255,255,255,.18); background:rgba(0,0,0,.35); color:#fff; }
  input:focus { outline:none; border-color:#5eead4; }
  button { width:100%; font:inherit; font-size:14.5px; font-weight:700; border-radius:10px; padding:11px 12px; cursor:pointer; border:1.5px solid #0d9488; margin-top:10px; }
  .haupt { background:#0d9488; color:#fff; } .leicht { background:transparent; color:#5eead4; }
  button:disabled { opacity:.55; cursor:default; }
  .fehler { color:#fca5a5; font-size:13px; font-weight:600; min-height:18px; margin-top:10px; text-align:center; }
  .ok { color:#5eead4; font-size:13px; margin-top:10px; text-align:center; }
  .klein { font-size:11.5px; color:#64748b; text-align:center; margin-top:14px; line-height:1.45; }
</style>
</head>
<body>
<form class="karte" id="f" autocomplete="off">
  <div class="schloss">🔒</div>
  <h1>Büro gesperrt</h1>
  <p class="u" id="unter">Bitte kurz anmelden, um das Büro zu betreten.</p>
  <label for="ben">E-Mail (oder Benutzername bei Büro-PIN)</label>
  <input id="ben" autocomplete="username" inputmode="email" required>
  <button type="button" class="leicht" id="mail">✉️ Code per E-Mail senden</button>
  <div class="ok" id="ok"></div>
  <label for="pin">Code / Büro-PIN</label>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required>
  <button type="submit" class="haupt" id="los">🔓 Entsperren</button>
  <div class="fehler" id="fe"></div>
  <div class="klein">Der Code kommt an deine dienstliche E-Mail (10 Minuten gültig, nur einmal).<br>Alternativ: Büro-PIN im Dashboard unter „Virtuelles Büro“ erzeugen.</div>
</form>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz";
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), SITZUNG = q.get("sitzung") || "";
if (q.get("grund") === "pause") $("unter").textContent = "Du warst 30 Minuten inaktiv – das Büro wurde zur Sicherheit gesperrt.";
try { $("ben").value = localStorage.getItem("swSchlossBenutzer") || ""; } catch {}
(($("ben").value ? $("pin") : $("ben"))).focus();
async function post(pfad, daten) {
  const r = await fetch(API + pfad, { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify(daten) });
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(d.error || (r.status === 429 ? "Zu viele Versuche. Bitte 15 Minuten warten." : "Fehler " + r.status));
  return d;
}
$("mail").onclick = async () => {
  $("fe").textContent = ""; $("ok").textContent = ""; $("mail").disabled = true;
  try { await post("/ausweis/mailcode", { benutzer: $("ben").value.trim() }); $("ok").textContent = "Falls die Adresse hinterlegt ist, kommt gleich eine E-Mail mit dem Code."; $("pin").focus(); }
  catch (e) { $("fe").textContent = e.message; }
  setTimeout(() => { $("mail").disabled = false; }, 4000);
};
let laeuft = false;
$("f").onsubmit = async ev => {
  ev.preventDefault(); if (laeuft) return; laeuft = true; $("los").disabled = true; $("fe").textContent = "";
  try {
    const d = await post("/ausweis", { benutzer: $("ben").value.trim(), pin: $("pin").value.trim() });
    try { localStorage.setItem("swBueroAusweis", d.token); localStorage.setItem("swSchlossBenutzer", $("ben").value.trim()); } catch {}
    $("ok").textContent = "Willkommen, " + String(d.name || "").split(" ")[0] + "!";
    await WA.onInit();
    await WA.player.state.saveVariable("swSchloss", { sitzung: SITZUNG, t: Date.now() }, { public: false, persist: false });
  } catch (e) {
    $("fe").textContent = /ung|falsch|abgelaufen|pin/i.test(e.message) ? e.message : (e.message || "Entsperren fehlgeschlagen");
    $("pin").value = ""; laeuft = false; $("los").disabled = false;
  }
};
</script>
</body>
</html>
