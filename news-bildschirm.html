<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SW News</title>
<style>
  * { box-sizing:border-box; }
  /* füllt die Anzeige-Fläche im Rahmen randlos (Rahmen + Fuß sind Kacheln in der Karte, 08.10.) */
  html, body { margin:0; height:100%; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:linear-gradient(#0f766e,#134e4a); }
  .schirm { height:100%; color:#fff; padding:5px 8px; overflow:hidden; }
  .kopf { display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:3px; }
  .live { color:#fbbf24; font-weight:600; font-size:10px; }
  .live::before { content:"● "; animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .zeile { font-size:10.5px; line-height:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.95; }
</style>
</head>
<body>
<div class="schirm">
  <div class="kopf"><span>📰 SW News</span><span class="live">live</span></div>
  <div class="zeile" id="z1">…</div>
  <div class="zeile" id="z2"></div>
</div>
<script>
// News-Bildschirm am Empfang (08.10.2026, Sam: Variante C) — steht als Webseite direkt in der Karte und zeigt
// die 2 neuesten News (angepinnte zuerst) aus dem Dashboard; aktualisiert sich jede Minute.
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe";
async function laden() {
  try {
    const news = await (await fetch("https://swdigitaltest.de/buero-praesenz/news", { headers: { "X-Buero-Key": KEY } })).json();
    const z = news.slice(0, 2).map(n => (n.angepinnt ? "📌 " : "") + String(n.text).replace(/\s+/g, " "));
    document.getElementById("z1").textContent = z[0] || "Keine News";
    document.getElementById("z2").textContent = z[1] || "";
  } catch { /* nächster Versuch in einer Minute */ }
}
laden(); setInterval(laden, 60000);
</script>
</body>
</html>
