<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Wer ist online</title>
<!-- Leiste rechts im VBüro (23.10.2026, Sam: Layout A „Liste nach Status“): wer online ist und was gerade passiert –
     📞 telefoniert mit … · ☎ telefoniert · 💬 bei … im Zimmer · 🗣 Besprechungsraum · ☕ Pause · 📱 am Handy · Raum.
     Klick auf eine Person: 💬 Chat · 📞 Anrufen · 🚶 Hin · 👤 Profil. „›“ klappt auf die schmale Gesichter-Leiste (Layout C) zu.
     Server: /buero-praesenz/leiste (Büro-Sitzung ?s=…), alle 8 s. Knöpfe melden über swAktion ans Büro-Skript. -->
<script src="https://play.workadventu.re/iframe_api.js"></script>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; color:#fff; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #l { height:100%; background:rgba(22,24,29,.9); border:1px solid rgba(255,255,255,.14); border-radius:14px; display:flex; flex-direction:column; }
  .kopf { display:flex; align-items:center; gap:6px; padding:9px 10px 6px; font-size:12.5px; font-weight:700; }
  .kopf span { flex:1; } .kopf { cursor:grab; touch-action:none; } body.zieht .kopf { cursor:grabbing; } body.zieht #l { outline:2px solid #5eead4; } .kopf button { border:0; background:rgba(255,255,255,.12); color:#fff; border-radius:8px; width:26px; height:24px; cursor:pointer; font-size:13px; }
  .inh { flex:1; overflow-y:auto; padding:0 8px 8px; }
  .gt { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.55); margin:9px 2px 3px; }
  .p { display:flex; gap:8px; align-items:center; padding:5px 4px; border-radius:9px; cursor:pointer; }
  .p:hover { background:rgba(255,255,255,.08); }
  .av { position:relative; width:30px; height:30px; border-radius:50%; background:#5DCAA5 center/cover no-repeat; color:#04342C; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; }
  .av i { position:absolute; right:-1px; bottom:-1px; width:10px; height:10px; border-radius:50%; border:2px solid #16181d; }
  .n { font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .zumir { border:0; background:rgba(94,234,212,.18); color:#5eead4; border-radius:8px; padding:1px 7px; font:inherit; font-size:10.5px; font-weight:600; cursor:pointer; }
  .zumir:hover { background:rgba(94,234,212,.32); } .s { font-size:11px; color:rgba(255,255,255,.72); line-height:1.25; }
  /* Knöpfe Layout A (23.10.2026, Sam): runde Symbole mit Beschriftung darunter, wie beim Handy-Kontakt */
  .menue { display:flex; justify-content:space-around; padding:4px 2px 9px; }
  .menue button { border:0; background:none; color:rgba(255,255,255,.85); font:inherit; font-size:10.5px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; padding:0; width:48px; }
  .menue button span { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:filter .15s, transform .15s; }
  .menue button:hover span { filter:brightness(1.18); transform:scale(1.06); }
  .menue svg { width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  /* nicht im Büro (23.10.2026, Sam: „ohne grüne Farbe, dunkler“, „zuklicken“): grau, gedimmt, Gruppe auf-/zuklappbar mit Gesichter-Vorschau */
  .p.weg .n { color:#8b949e; } .p.weg .s { color:#5c646d; } .p.weg .av { background-color:#2c3138; color:#8b949e; filter:grayscale(1) brightness(.75); }
  .gt.klapp { cursor:pointer; display:flex; align-items:center; gap:5px; border-top:1px solid rgba(255,255,255,.1); padding-top:9px; margin-top:12px; user-select:none; }
  .gt.klapp:hover { color:#fff; } .gt.klapp b { font-weight:400; display:inline-block; width:10px; }
  .vorschau { display:flex; padding:3px 4px 6px; cursor:pointer; } .vorschau .av { width:26px; height:26px; font-size:10px; border:2px solid #16181d; margin-left:-7px; background-color:#2c3138; color:#8b949e; filter:grayscale(1) brightness(.75); } .vorschau .av:first-child { margin-left:0; }
  .leer { font-size:12px; color:rgba(255,255,255,.6); padding:8px 4px; }
  /* schmal (Layout C): nur Gesichter, Text als Tooltip */
  body.schmal .kopf span, body.schmal .gt, body.schmal .p > div, body.schmal .menue { display:none; }
  body.schmal .p.weg { display:none; } /* schmal: nur wer im Büro ist */
  body.schmal .kopf { justify-content:center; padding:8px 0 4px; } body.schmal .inh { padding:0 0 8px; } body.schmal .p { justify-content:center; padding:5px 0; }
</style>
</head>
<body>
<div id="l"><div class="kopf"><span id="titel" title="Ziehen zum Verschieben">Online</span><button id="klapp" title="Leiste schmal/breit">›</button></div><div class="inh" id="inh"><div class="leer">Lädt …</div></div></div>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", B = "https://swdigitaltest.de/buero-praesenz";
const $ = id => document.getElementById(id), q = new URLSearchParams(location.search), SITZ = q.get("s") || "";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FARBE = { gespraech: "#7F77DD", besprechung: "#378ADD", buero: "#639922", pause: "#EF9F27" };
const GRUPPE = { gespraech: "Im Gespräch", besprechung: "Besprechung", buero: "Im Büro", pause: "Pause", weg: "Nicht im Büro" };
const SYM = { chat: '<path d="M3 20l1.3-3.9A9 8 0 1 1 7.7 19L3 20"/>', anruf: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  hin: '<circle cx="13" cy="4" r="1.5"/><path d="M7 21l3-4M16 21l-2-4-3-3 1-6M6 12l2-3 4-1 3 3 3 1"/>', profil: '<circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>' };
const knopf = (a, text, farbe) => `<button data-a="${a}"><span style="background:${farbe}"><svg viewBox="0 0 24 24">${SYM[a]}</svg></span>${text}</button>`;
let daten = null, offen = "", schmal = q.get("schmal") === "1", wegZu = true;
try { wegZu = localStorage.getItem("swLeisteWegZu") !== "0"; } catch { /* Standard: zu */ }
function aktion(was, extra) { try { WA.player.state.saveVariable("swAktion", Object.assign({ was, t: Date.now() }, extra || {}), { public: false, persist: false }); } catch (e) { console.warn(e); } }
const dauer = (seit, jetzt) => { const m = Math.max(0, Math.round((jetzt - seit) / 60000)); return m < 1 ? "" : m < 60 ? " · " + m + " Min" : " · " + Math.floor(m / 60) + " Std"; };
function farbe(p) { return p.text.startsWith("☎") ? "#EF9F27" : p.text.startsWith("💬") ? "#1D9E75" : FARBE[p.gruppe] || "#639922"; }
function malen() {
  document.body.classList.toggle("schmal", schmal); $("klapp").textContent = schmal ? "‹" : "›";
  if (!daten) return;
  const l = daten.liste; $("titel").textContent = "Online · " + (daten.online ?? l.length);
  let h = "", g = "";
  for (const p of l) {
    if (p.gruppe !== g) { g = p.gruppe; const anz = l.filter(x => x.gruppe === g).length;
      if (g === "weg") { h += `<div class="gt klapp" id="wegKlapp"><b>${wegZu ? "▸" : "▾"}</b>${GRUPPE.weg} · ${anz}</div>`;
        if (wegZu) { const w = l.filter(x => x.gruppe === "weg"); h += '<div class="vorschau" id="wegVorschau">' + w.slice(0, 6).map(x => `<span class="av" style="${x.foto ? `background-image:url('${esc(x.foto)}')` : ""}" title="${esc(x.name)}">${x.foto ? "" : esc(x.vorname.slice(0, 2).toUpperCase())}</span>`).join("") + (w.length > 6 ? `<span class="av">+${w.length - 6}</span>` : "") + "</div>"; break; } }
      else h += `<div class="gt">${GRUPPE[g] || ""} · ${anz}</div>`; }
    const zeit = (p.gruppe === "gespraech" || p.gruppe === "besprechung") && p.seit ? dauer(p.seit, daten.jetzt) : "";
    h += `<div class="p${p.gruppe === "weg" ? " weg" : ""}" data-id="${esc(p.id)}" title="${esc(p.name + " – " + p.text)}"><span class="av" style="${p.foto ? `background-image:url('${esc(p.foto)}')` : ""}">${p.foto ? "" : esc(p.vorname.slice(0, 2).toUpperCase())}${p.gruppe === "weg" ? "" : `<i style="background:${farbe(p)}"></i>`}</span>
      <div style="min-width:0"><div class="n">${esc(p.vorname)}${p.ich ? " (du)" : ""}${p.ich ? '<button class="zumir" title="Blick auf mich">📍 Zu mir</button>' : ""}</div><div class="s">${esc(p.text)}${zeit}</div></div></div>`;
    if (offen === p.id && !p.ich) h += `<div class="menue">${daten.chat && p.chat ? knopf("chat", "Chat", "#0f766e") + (p.gruppe === "weg" ? "" : knopf("anruf", "Anrufen", "#16a34a")) : ""}${p.gruppe === "weg" ? "" : knopf("hin", "Hingehen", "#2563eb")}${knopf("profil", "Profil", "#475569")}</div>`; // nicht im Büro: nur Chat + Profil
  }
  $("inh").innerHTML = h || '<div class="leer">Gerade ist niemand online.</div>';
  const wk = () => { wegZu = !wegZu; try { localStorage.setItem("swLeisteWegZu", wegZu ? "1" : "0"); } catch { /* egal */ } malen(); };
  if ($("wegKlapp")) $("wegKlapp").onclick = wk; if ($("wegVorschau")) $("wegVorschau").onclick = wk;
  document.querySelectorAll(".zumir").forEach(b => b.onclick = e => { e.stopPropagation(); aktion("zumir"); }); // 23.10.2026: früher oben in der Leiste
  document.querySelectorAll(".p").forEach(el => el.onclick = () => { if (schmal) { schmal = false; aktion("leisteRechts", { schmal: false }); } offen = offen === el.dataset.id ? "" : el.dataset.id; malen(); });
  document.querySelectorAll(".menue button").forEach(b => b.onclick = e => { e.stopPropagation(); los(b.dataset.a); });
}
async function los(a) {
  const p = daten.liste.find(x => x.id === offen); if (!p) return;
  if (a === "chat") aktion("leisteChat", { id: p.id });
  if (a === "hin") aktion("zuPerson", { name: p.name });
  if (a === "profil") aktion("leisteProfil", { name: p.name });
  if (a === "anruf") {
    try { const r = await fetch(B + "/anruf/start", { method: "POST", headers: { "X-Buero-Key": KEY, "X-Buero-Sitzung": SITZ, "Content-Type": "application/json" }, body: JSON.stringify({ an: p.id }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Anruf geht gerade nicht"); aktion("anrufOeffnen", { id: d.id }); }
    catch (e) { alert("📞 " + e.message); }
  }
  offen = ""; malen();
}
async function laden() {
  try { const r = await fetch(B + "/leiste", { headers: { "X-Buero-Key": KEY, "X-Buero-Sitzung": SITZ } }); if (!r.ok) throw new Error(r.status === 401 ? "Bitte das Büro neu laden." : "Gerade nicht erreichbar"); daten = await r.json(); malen(); }
  catch (e) { if (!daten) $("inh").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
// Frei verschieben (23.10.2026, Sam): Kopfzeile ziehen. Live über den Abstand des WorkAdventure-Fensters; beim Loslassen meldet die Seite
// die Lage ans Büro-Skript (swAktion „leisteLage“), das sie dauerhaft merkt (swLeisteRechtsLage { r, o }) und die Leiste dort neu öffnet.
const START = location.href.split("#")[0]; let ich = null;
WA.onInit().then(async () => { try { ich = (await WA.ui.website.getAll()).find(w => String(w.url || "").split("#")[0] === START) || null; } catch { /* alt */ } });
document.querySelector(".kopf").addEventListener("pointerdown", e => {
  if (e.button !== 0 || e.target.closest("button")) return; e.preventDefault(); const k = e.currentTarget; k.setPointerCapture(e.pointerId);
  let lage = {}; try { lage = WA.player.state.swLeisteRechtsLage || {}; } catch { /* neu */ }
  const r0 = Number(lage.r ?? 8), o0 = Number(lage.o ?? 72), x0 = e.screenX, y0 = e.screenY, zw = (v, a, z) => Math.min(z, Math.max(a, v));
  const SW = window.outerWidth || screen.availWidth || 1600, SH = window.outerHeight || screen.availHeight || 900;
  let r = r0, o = o0, bewegt = false; document.body.classList.add("zieht");
  const weiter = m => { const dx = m.screenX - x0, dy = m.screenY - y0; if (Math.abs(dx) + Math.abs(dy) > 3) bewegt = true;
    r = Math.round(zw(r0 - dx, 0, SW - window.innerWidth - 8)); o = Math.round(zw(o0 + dy, 0, SH - window.innerHeight - 120));
    try { if (ich && ich.margin) { ich.margin.right = r + "px"; ich.margin.top = o + "px"; } } catch { /* nicht live */ } };
  const los = () => { k.removeEventListener("pointermove", weiter); k.removeEventListener("pointerup", los); k.removeEventListener("pointercancel", los);
    document.body.classList.remove("zieht"); if (bewegt) aktion("leisteLage", { r, o }); };
  k.addEventListener("pointermove", weiter); k.addEventListener("pointerup", los); k.addEventListener("pointercancel", los);
});
$("klapp").onclick = () => { schmal = !schmal; offen = ""; malen(); aktion("leisteRechts", { schmal }); };
WA.onInit().then(() => { laden(); setInterval(laden, 8000); }).catch(() => { laden(); setInterval(laden, 8000); });
</script>
</body>
</html>
