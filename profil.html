<script>
// Daten kommen vom SW-internen Portal (GET /buero-praesenz/profil) — nur mit Büro-Ausweis (einmal pro Gerät Benutzername + Büro-PIN),
// derselbe Ausweis wie bei „Meine Ideen“. Gezeigt wird nur das Büro-Profil, nie Anschrift, Vertrag, Notfallkontakt.
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz";
const q = new URLSearchParams(location.search), NAME = q.get("name") || "", ICH = q.get("ich") === "1", TORE = Number(q.get("tore")) || 0;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = { holen: () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } }, setzen: t => { try { t ? localStorage.setItem("swBueroAusweis", t) : localStorage.removeItem("swBueroAusweis"); } catch {} } };
async function api(pfad) {
  const r = await fetch(API + pfad, { headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis.holen(), "X-Buero-Name": encodeURIComponent(window.__waName || "") } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && /ausweis/.test(d.error || "")) { ausweis.setzen(""); throw new Error("ausweis"); }
  if (!r.ok) throw new Error(d.error || "Fehler"); return d;
}
function ausweisFormular(meldung) {
  $("kopf").textContent = "Büro-Ausweis";
  $("seite").innerHTML = `<div class="box"><div style="font-size:14px">Einmal pro Gerät: Profile sehen nur angemeldete Kollegen.</div>
    <div style="font-size:12px;opacity:.75;margin-top:4px">Die Büro-PIN erzeugst du im SW-internen Portal auf der Startseite unter 🔑 Büro-PIN.</div>
    <label>Benutzername</label><input id="ben" autocomplete="username">
    <label>Büro-PIN</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7">

  $("los").onclick = async () => {
    $("los").disabled = true; $("fe").textContent = "";
    try {
      const r = await fetch(API + "/ausweis", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: $("ben").value.trim(), pin: $("pin").value.trim() }) });

}
let P = null, reiter = "ueber";
function zeile(titel, wert) { return wert ? `<div class="z"><b>${esc(titel)}</b>${esc(wert)}</div>` : ""; }
function zeigen() {
  const p = P, v = String(p.name || "").split(/\s+/)[0];

  const REITER = [["ueber", "Über mich"], ["zust", "Zuständig"], ["kontakt", "Kontakt"], ...((p.zeitQuellen || []).length ? [["zeit", "⏱ Zeit"]] : []), ...(p.ich ? [["fb", "💬 Feedback"], ["gesp", "🗂 Gespräche"], ["danke", "💛 Danke"]] : [])];

    <div class="name">${esc(p.name)}</div><div class="rolle">${esc([p.rolle, (p.abteilungen || []).join(", ")].filter(Boolean).join(" · "))}</div>
    ${abz.length ? `<div class="abz">${abz.map(a => `<span>${esc(a)}</span>`).join("")}</div>` : ""}
    <div id="liveBox"></div>
    <div class="reiter">${REITER.map(([k, t]) => `<button data-r="${k}" class="${k === reiter ? "an" : ""}">${t}</button>`).join("")}</div>

  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { reiter = b.dataset.r; zeigen(); });
  liveLaden();
  if (reiter === "zeit") zeitLaden();
  if (reiter === "fb") feedbackLaden(); if (reiter === "gesp") gespraecheLaden(); if (reiter === "danke") dankeLaden();
  const hin = $("hin"); if (hin) hin.onclick = () => { try { WA.player.state.saveVariable("swAktion", { was: "zuPerson", name: p.name, buero: NAME, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); } };
}
// Live-Kasten (11.10.2026, Sam): woran die Person gerade im SW-internen Portal arbeitet — nur mit Recht „Live-Anzeige“ und Freigabe
// für diese Person; sonst bleibt der Kasten leer. Mit „arbeiten“ auch der Verlauf von heute. Aktualisiert sich jede Minute.
const minSeit = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 60 ? m + " Min" : Math.floor(m / 60) + " Std " + (m % 60) + " Min"; };
async function liveLaden() {
  const box = $("liveBox"); if (!box) return;
  let d; try { d = await api("/live?" + (P && P.ich ? "ich=1" : "name=" + encodeURIComponent(NAME))); } catch { return; }
  if (!d || !d.pfad) { box.innerHTML = ""; return; }
  const zeit = t => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  box.innerHTML = `<div style="margin:12px 14px 0;background:rgba(20,184,166,.13);border:1px solid rgba(94,234,212,.4);border-radius:10px;padding:10px 12px">
    <div style="display:flex;justify-content:space-between;font-size:11.5px">${d.live ? '<span style="color:#fca5a5;font-weight:700">● Live im SW-internen Portal</span><span style="opacity:.8">seit ' + minSeit(d.seit) + "</span>"
      : '<span style="opacity:.75">zuletzt im SW-internen Portal vor ' + minSeit(d.zuletzt) + "</span><span></span>"}</div>
    <div style="font-size:14px;font-weight:700;margin:4px 0 2px">${esc(d.pfad)}</div>${d.mandant ? `<div style="font-size:13px;font-weight:600;color:#fde68a">👔 ${esc(d.mandant)}</div>` : ""}${d.detail ? `<div style="font-size:12.5px;color:#5eead4">${esc(d.detail)}</div>` : ""}
    ${(d.verlauf || []).length ? '<div style="margin-top:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:6px;font-size:11.5px;opacity:.75;line-height:1.6">Heute davor:<br>'
      + d.verlauf.map(v => esc(zeit(v.von) + " " + v.pfad + (v.mandant ? " · " + v.mandant : "") + (v.detail ? " · " + v.detail : "") + " · " + minSeit(Date.now() - (v.bis - v.von)))).join("<br>") + "</div>" : ""}</div>`;
  clearTimeout(liveLaden.t); liveLaden.t = setTimeout(liveLaden, 60000);
}
// Reiter „💬 Feedback“ + „🗂 Gespräche“ (10.10.2026, Sam: Idee A) — nur im eigenen Profil, nur lesen. Feedback = Gespräche mit der
// Leitung (Noten, Stärken, Ziele), Gespräche = alle abgeschlossenen Gespräche, an denen man teilnahm (Meeting-Notizen, Mandantengespräche …)
const FB_KAT = { fachkompetenz: "Fachkompetenz", fristen: "Fristen", mandanten: "Mandanten", qualitaet: "Qualität", team: "Teamarbeit", initiative: "Initiative" };
const dDE = s => s ? String(s).slice(0, 10).split("-").reverse().join(".") : "";

  const box = $("gespBox"); if (!box) return;

    const noten = n.length ? '<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">' + n.map(([k, v]) => `<span style="font-size:11.5px;padding:2px 8px;border-radius:999px;background:${farbe(v)}">${v} ${esc(FB_KAT[k] || k)}</span>`).join("") + "</div>" : "";

      .map(([t, v]) => `<div style="font-size:12.5px;margin-top:3px;white-space:pre-wrap">${fett(t + ":")} ${esc(v)}</div>`).join("");

      <div style="font-size:11.5px;opacity:.7">von ${esc(f.erstelltVon || "")}</div>${noten}${texte}
      ${f.naechstes ? `<div style="font-size:11.5px;opacity:.7;margin-top:5px">Nächstes Gespräch: ${dDE(f.naechstes)}</div>` : ""}</div>`;
  }).join("");
}
// Reiter „💛 Danke“ (11.10.2026): was Kollegen einem an der Danke-Wand geschrieben haben (an mich + ans ganze Team)
async function dankeLaden() {
  const box = $("gespBox"); if (!box) return;

async function gespraecheLaden() {

    <div style="font-size:11.5px;opacity:.7">${dDE(g.datum)}${g.nachgetragen ? " · nachgetragen" : ""} · ${esc(g.teilnehmer.map(t => t.name).join(", "))}</div><div data-detail="${esc(g.id)}"></div></div>`).join("");

      d.innerHTML = a.felder.map(f => { const v = (g.felder || {})[f.k]; if (leer(v)) return "";

        return `<div style="font-size:12.5px;margin-top:5px;white-space:pre-wrap">${fett(esc(f.label.split(" (")[0]) + ":")} ${esc(txt)}</div>`; }).join("")
        + ((g.aufgaben || []).length ? `<div style="font-size:12.5px;margin-top:6px">${fett("Aufgaben:")} ` + g.aufgaben.map(x => esc(x.text) + (x.bearbeiterName ? " (" + esc(x.bearbeiterName) + (x.frist ? ", " + dDE(x.frist) : "") + ")" : "")).join(" · ") + "</div>" : "");

// Reiter „⏱ Zeit“ (09.10.2026, Sam): Kachel antippen = nur diese Quelle (nochmal = alle), Tag / Woche / Monat + Datum, Zeile antippen = Tagesansicht
const Z = { art: "woche", basis: new Date(), quelle: "alle" };
const iso = d => d.toLocaleDateString("sv-SE"), std = v => v == null ? "–" : (Math.round(v * 100) / 100).toFixed(2).replace(".", ",");
async function zeitLaden() {
  const box = $("zeitBox"); if (!box) return; const b = new Date(Z.basis); let von, bis;

  catch (e) { box.innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; return; }

    : von.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + "–" + bis.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
  let h = `<div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:8px">${["tag", "woche", "monat"].map(a => `<button class="zk${Z.art === a ? " an" : ""}" data-za="${a}">${{ tag: "Tag", woche: "Woche", monat: "Monat" }[a]}</button>`).join("")}
    <input type="date" id="zDatum" value="${iso(Z.art === "tag" ? von : new Date(Z.basis))}" style="width:auto;font-size:12px;padding:4px 6px"><span style="flex:1"></span><button class="zk" data-zs="-1">‹</button><b style="font-size:12.5px">${titel}</b><button class="zk" data-zs="1">›</button></div>`;
  // Guthaben / Minusstunden (10.10.2026): System-Zeit minus Soll seit 30.07. bis gestern — wie beim Überstunden-Antrag
  if (d.saldo) {
    const hm = ms => { const m = Math.round(Math.abs(ms) / 60000); return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0"); };
    if (d.saldo.verfuegbar) { const plus = d.saldo.saldoMs >= 0;
      h += `<div style="border-radius:10px;padding:9px 12px;margin-bottom:8px;background:${plus ? "rgba(22,163,74,.22)" : "rgba(220,38,38,.22)"};border:1px solid ${plus ? "rgba(74,222,128,.45)" : "rgba(248,113,113,.45)"}">
        <div style="font-size:11px;opacity:.8">${plus ? "Überstunden-Guthaben" : "Minusstunden"}</div>
        <div style="font-size:20px;font-weight:800;color:${plus ? "#86efac" : "#fca5a5"}">${plus ? "+" : "−"}${hm(d.saldo.saldoMs)} Std</div>
        <div style="font-size:11px;opacity:.75">${d.saldo.stichtag ? "Startwert " + (d.saldo.uebertragMs < 0 ? "−" : "+") + hm(d.saldo.uebertragMs) + " am " + d.saldo.stichtag.split("-").reverse().join(".") + " · " : ""}Ist ${hm(d.saldo.istMs)} · Soll ${hm(d.saldo.sollMs)} · seit ${d.saldo.seit.split("-").reverse().join(".")} bis gestern${d.saldo.geplantMs ? ` · davon ${hm(d.saldo.geplantMs)} Std schon zum Abfeiern beantragt` : ""}</div></div>`; }
    else h += `<div style="font-size:11.5px;opacity:.7;margin-bottom:8px">Guthaben: ${esc(d.saldo.hinweis || "nicht verfügbar")}</div>`;
  }
  h += `<div style="display:grid;grid-template-columns:repeat(${ALLE.length},minmax(0,1fr));gap:6px;margin-bottom:4px">` + ALLE.map(q => { const an = Z.quelle === q[0], aus = Z.quelle !== "alle" && !an;
    return `<div data-zq="${an ? "alle" : q[0]}" style="cursor:pointer;background:${q[2]};border-radius:10px;padding:8px 10px;opacity:${aus ? .35 : 1};outline:${an ? "2px solid #fbbf24" : "none"}"><div style="font-size:11px;opacity:.85">${q[1]}</div><div style="font-size:18px;font-weight:800">${std(summe[q[0]])} Std</div></div>`; }).join("") + "</div>";
  h += `<div style="font-size:11px;opacity:.65;margin-bottom:6px">${Z.quelle === "alle" ? "Kachel antippen = nur diese Quelle · Tag antippen = Einzelheiten" : "Nur " + Q[0][1] + " · Kachel nochmal antippen = alle"}</div>`;
  if (Z.art === "tag") {
    const t = iso(von);
    if (hat("datev")) { const bu = (d.datev && d.datev.buchungen) || [];
      h += `<div style="font-weight:800;color:#93c5fd;margin:6px 0 4px">DATEV · ${bu.length} Buchung${bu.length === 1 ? "" : "en"}</div>` + (bu.length ? bu.map(x => `<div class="z" style="padding:7px 10px"><b style="text-transform:none;letter-spacing:0;font-size:12px;color:#fff">${std(x.std)} Std · ${esc(x.mandant || "ohne Mandant")}</b>${esc(x.auftrag)}${x.kommentar ? `<div style="font-size:12px;opacity:.75;margin-top:2px">${esc(x.kommentar)}</div>` : ""}</div>`).join("") : '<div class="leer" style="padding:6px">Keine DATEV-Buchung an diesem Tag.</div>'); }
    if (hat("buero")) { const be = d.buero && d.buero[t];
      h += `<div style="font-weight:800;color:#5eead4;margin:10px 0 4px">Virtuelles Büro</div>` + (be ? `<div style="font-size:12.5px;margin-bottom:4px">${be.von} – ${be.bis} · ${std(be.std)} Std, davon ${std(be.pause)} Std Pause</div><div style="display:flex;flex-wrap:wrap;gap:4px">${(be.raeume || []).map(r => `<span style="font-size:11px;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.08)">${r.von}–${r.bis} ${esc(r.bereich)} (${r.min} Min)</span>`).join("")}</div>` : '<div class="leer" style="padding:6px">An diesem Tag nicht im Büro.</div>'); }
    if (hat("system")) { const sv = wert("system", t); h += `<div style="font-weight:800;color:#c4b5fd;margin:10px 0 4px">System-Zeiterfassung</div><div style="font-size:12.5px">${sv ? std(sv) + " Std aktiv am Rechner" : "Keine System-Zeit an diesem Tag."}</div>`; }
  } else {
    h += '<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tr><th style="text-align:left;opacity:.7;font-size:11px;padding:4px">Tag</th>' + Q.map(q => `<th style="text-align:right;font-size:11px;padding:4px;color:${q[3]}">${q[1]}</th>`).join("") + "</tr>";
    tage.forEach(t => { const v = Q.map(q => wert(q[0], iso(t))); if ((t.getDay() === 0 || t.getDay() === 6) && !v.some(Boolean)) return;
      const dv = Z.quelle === "alle" && d.quellen.includes("datev") ? (wert("datev", iso(t)) || 0) : null, max = Math.max(...ALLE.map(q => wert(q[0], iso(t)) || 0)), rot = dv !== null && ALLE.length > 1 && max - dv >= 1;
      h += `<tr data-zt="${iso(t)}" style="cursor:pointer;border-top:1px solid rgba(255,255,255,.08)"><td style="padding:5px 4px">${t.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" })}${rot ? ' <span style="color:#fca5a5" title="DATEV deutlich weniger">⚠</span>' : ""}</td>` + v.map(x => `<td style="text-align:right;padding:5px 4px;font-variant-numeric:tabular-nums">${x ? std(x) : "–"}</td>`).join("") + "</tr>"; });
    h += "</table>";
  }
  const hin = []; if (d.datev) hin.push(d.datev.quelle === "datev" ? "DATEV tagesaktuell" : "DATEV aus Excel-Upload"); if (d.buero) hin.push("Büro: letzte 30 Tage");
  h += `<div style="font-size:11px;opacity:.65;margin-top:6px">${esc(hin.join(" · "))}</div>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-za]").forEach(x => x.onclick = () => { Z.art = x.dataset.za; zeitLaden(); });
  box.querySelectorAll("[data-zq]").forEach(x => x.onclick = () => { Z.quelle = x.dataset.zq; zeitLaden(); });
  box.querySelectorAll("[data-zt]").forEach(x => x.onclick = () => { Z.art = "tag"; Z.basis = new Date(x.dataset.zt + "T12:00:00"); zeitLaden(); });
  $("zDatum").onchange = e => { if (e.target.value) { Z.art = "tag"; Z.basis = new Date(e.target.value + "T12:00:00"); zeitLaden(); } };
  box.querySelectorAll("[data-zs]").forEach(x => x.onclick = () => { const n = +x.dataset.zs, nb = new Date(Z.basis); if (Z.art === "monat") nb.setMonth(nb.getMonth() + n); else if (Z.art === "tag") nb.setDate(nb.getDate() + n); else nb.setDate(nb.getDate() + 7 * n); Z.basis = nb; zeitLaden(); });
}
async function laden() {
  if (!ausweis.holen()) return ausweisFormular();
  try { P = await api("/profil?" + (ICH ? "ich=1" : "name=" + encodeURIComponent(NAME))); zeigen(); }
  catch (e) { if (e.message === "ausweis") return ausweisFormular("Dein Ausweis ist nicht mehr gültig – bitte neu anmelden."); $("seite").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
laden();
</script>
<script>(async()=>{for(let i=0;i<50&&typeof WA==="undefined";i++)await new Promise(r=>setTimeout(r,100));try{await WA.onInit();window.__waName=WA.player.name||"";}catch(e){}})();</script>
