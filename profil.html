  /* übrige Reiter + Live-Kasten + Ausweis-Formular im hellen Glas (13.10.2026) */

<body>
<header><span style="font-size:18px">👤</span><h1 id="kopf">Profil</h1></header>
<div id="seite"><div class="leer">Lade …</div></div>
<script>
// Daten kommen vom SW-internen Portal (GET /buero-praesenz/profil) — nur mit Büro-Ausweis (einmal pro Gerät Benutzername + Büro-PIN),
// derselbe Ausweis wie bei „Meine Ideen“. Gezeigt wird nur das Büro-Profil, nie Anschrift, Vertrag, Notfallkontakt.
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz";
const q = new URLSearchParams(location.search), NAME = q.get("name") || "", ICH = q.get("ich") === "1", TORE = Number(q.get("tore")) || 0;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = { holen: () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } }, setzen: t => { try { t ? localStorage.setItem("swBueroAusweis", t) : localStorage.removeItem("swBueroAusweis"); } catch {} } };
async function api(pfad) {
  const r = await fetch(API + pfad, { headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis.holen(), "X-Buero-Name": encodeURIComponent(window.__waName || "") } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && /ausweis/.test(d.error || "")) { ausweis.setzen(""); throw new Error("ausweis"); }
  if (!r.ok) throw new Error(d.error || "Fehler"); return d;
}
function ausweisFormular(meldung) {
  $("kopf").textContent = "Büro-Ausweis";
  $("seite").innerHTML = `<div class="box"><div style="font-size:14px">Einmal pro Gerät: Profile sehen nur angemeldete Kollegen.</div>
    <div style="font-size:12px;opacity:.75;margin-top:4px">Die Büro-PIN erzeugst du im SW-internen Portal auf der Startseite unter 🔑 Büro-PIN.</div>
    <label>Benutzername</label><input id="ben" autocomplete="username">
    <label>Büro-PIN</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7">
    <div class="fehler" id="fe">${esc(meldung || "")}</div><div class="knoepfe" style="padding:6px 0 0"><button class="haupt" id="los">Ausweis speichern</button></div></div>`;
  $("los").onclick = async () => {
    $("los").disabled = true; $("fe").textContent = "";
    try {
      const r = await fetch(API + "/ausweis", { method: "POST", headers: { "X-Buero-Key": KEY, "Content-Type": "application/json" }, body: JSON.stringify({ benutzer: $("ben").value.trim(), pin: $("pin").value.trim() }) });
      const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || (r.status === 429 ? "Zu viele Versuche – bitte 15 Minuten warten." : "Fehler"));
      ausweis.setzen(d.token); laden();
    } catch (e) { $("fe").textContent = e.message; $("los").disabled = false; }
  };
}
let P = null, reiter = "ueber";
function zeile(titel, wert) { return wert ? `<div class="z"><b>${esc(titel)}</b>${esc(wert)}</div>` : ""; }
function zeigen() {
  const p = P, v = String(p.name || "").split(/\s+/)[0];
  $("kopf").textContent = p.ich ? "Mein Profil" : "Profil von " + v;
  const initialen = String(p.name || "?").split(/\s+/).map(t => t[0] || "").join("").slice(0, 2).toUpperCase();
  const abz = [p.seit && "seit " + p.seit + " im Team", p.schulungen && "🎓 " + p.schulungen + " Schulung" + (p.schulungen === 1 ? "" : "en"), p.ideen && "💡 " + p.ideen + " Idee" + (p.ideen === 1 ? "" : "n"), TORE && "⚽ " + TORE + " Tor" + (TORE === 1 ? "" : "e")].filter(Boolean);
  let inhalt = "";
  if (reiter === "ueber") inhalt = zeile("Über mich", p.ueber) + zeile("Hobbys", p.hobbys) + zeile("Sprachen", p.sprachen) + zeile("Mein Kaffee", p.kaffee) + zeile("Geburtstag", p.geburtstag)
    || `<div class="leer">${p.ich ? "Dein Büro-Profil ist noch leer.<br>Es wird von der Leitung gepflegt." : "Das Büro-Profil von " + esc(v) + " ist noch leer."}</div>`;
  if (reiter === "zust") inhalt = `<div class="z"><b>Mandanten</b><span class="gross">${p.mandanten || 0}</span> ${p.mandanten === 1 ? "Mandant" : "Mandanten"} in Betreuung</div>`
    + zeile("Abteilungen", (p.abteilungen || []).join(", ")) + zeile("Spezialgebiet", p.spezial);
  if (reiter === "kontakt") inhalt = zeile("Durchwahl", p.durchwahl) + zeile("Bürozeiten", p.buerozeiten) || `<div class="leer">Noch keine Kontaktangaben hinterlegt.</div>`;
  if (reiter === "zeit") inhalt = '<div id="zeitBox"><div class="leer">Lade …</div></div>';
  if (reiter === "fb" || reiter === "gesp" || reiter === "danke") inhalt = '<div id="gespBox"><div class="leer">Lade …</div></div>';
  const REITER = [["ueber", "Über mich"], ["zust", "Zuständig"], ["kontakt", "Kontakt"], ...((p.zeitQuellen || []).length ? [["zeit", "⏱ Zeit"]] : []), ...(p.ich ? [["fb", "💬 Feedback"], ["gesp", "🗂 Gespräche"], ["danke", "💛 Danke"]] : [])];
  $("seite").innerHTML = `<div class="banner"><div class="firma">SW DIGITAL TAX</div></div>
    <div class="foto" style="${p.foto ? "background-image:url('" + p.foto + "')" : ""}">${p.foto ? "" : esc(initialen)}</div>
    <div class="name">${esc(p.name)}</div><div class="rolle">${esc([p.rolle, (p.abteilungen || []).join(", ")].filter(Boolean).join(" · "))}</div>
    ${abz.length ? `<div class="abz">${abz.map(a => `<span>${esc(a)}</span>`).join("")}</div>` : ""}
    <div id="liveBox"></div>
    <div class="reiter">${REITER.map(([k, t]) => `<button data-r="${k}" class="${k === reiter ? "an" : ""}">${t}</button>`).join("")}</div>
    <div class="inhalt">${inhalt}</div>
    ${p.ich ? "" : `<div class="knoepfe">${p.durchwahl ? `<a class="haupt" href="tel:${esc(p.durchwahl)}">📞 Anrufen</a>` : ""}<button id="hin">🚶 Zu ${esc(v)} gehen</button></div>`}`;
  document.documentElement.classList.add("hell"); // 13.10.2026 (Sam): ganzes Profil in hellem Glas (G4), nicht nur der Zeit-Reiter
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { reiter = b.dataset.r; zeigen(); });
  liveLaden();
  if (reiter === "zeit") zeitLaden();
  if (reiter === "fb") feedbackLaden(); if (reiter === "gesp") gespraecheLaden(); if (reiter === "danke") dankeLaden();
  const hin = $("hin"); if (hin) hin.onclick = () => { try { WA.player.state.saveVariable("swAktion", { was: "zuPerson", name: p.name, buero: NAME, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); } };
}
// Live-Kasten (11.10.2026, Sam): woran die Person gerade im SW-internen Portal arbeitet — nur mit Recht „Live-Anzeige“ und Freigabe
// für diese Person; sonst bleibt der Kasten leer. Mit „arbeiten“ auch der Verlauf von heute. Aktualisiert sich jede Minute.
const minSeit = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 60 ? m + " Min" : Math.floor(m / 60) + " Std " + (m % 60) + " Min"; };
async function liveLaden() {
  const box = $("liveBox"); if (!box) return;
  let d; try { d = await api("/live?" + (P && P.ich ? "ich=1" : "name=" + encodeURIComponent(NAME))); } catch { return; }
  if (!d || !d.pfad) { box.innerHTML = ""; return; }
  const zeit = t => new Date(t).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  box.innerHTML = `<div class="zh-live" style="margin:12px 14px 0;border-radius:10px;padding:10px 12px">
    <div style="display:flex;justify-content:space-between;font-size:11.5px">${d.live ? '<span style="color:#b91c1c;font-weight:700">● Live im SW-internen Portal</span><span style="opacity:.8">seit ' + minSeit(d.seit) + "</span>"
      : '<span style="opacity:.75">zuletzt im SW-internen Portal vor ' + minSeit(d.zuletzt) + "</span><span></span>"}</div>
    <div style="font-size:14px;font-weight:700;margin:4px 0 2px">${esc(d.pfad)}</div>${d.mandant ? `<div style="font-size:13px;font-weight:600;color:#374151">👔 ${esc(d.mandant)}</div>` : ""}${d.detail ? `<div style="font-size:12.5px;color:#0f766e">${esc(d.detail)}</div>` : ""}
    ${(d.verlauf || []).length ? '<div style="margin-top:8px;border-top:1px solid rgba(17,24,39,.12);padding-top:6px;font-size:11.5px;color:#374151;line-height:1.6">Heute davor:<br>'
      + d.verlauf.map(v => esc(zeit(v.von) + " " + v.pfad + (v.mandant ? " · " + v.mandant : "") + (v.detail ? " · " + v.detail : "") + " · " + minSeit(Date.now() - (v.bis - v.von)))).join("<br>") + "</div>" : ""}</div>`;
  clearTimeout(liveLaden.t); liveLaden.t = setTimeout(liveLaden, 60000);
}
// Reiter „💬 Feedback“ + „🗂 Gespräche“ (10.10.2026, Sam: Idee A) — nur im eigenen Profil, nur lesen. Feedback = Gespräche mit der
// Leitung (Noten, Stärken, Ziele), Gespräche = alle abgeschlossenen Gespräche, an denen man teilnahm (Meeting-Notizen, Mandantengespräche …)
const FB_KAT = { fachkompetenz: "Fachkompetenz", fristen: "Fristen", mandanten: "Mandanten", qualitaet: "Qualität", team: "Teamarbeit", initiative: "Initiative" };
const dDE = s => s ? String(s).slice(0, 10).split("-").reverse().join(".") : "";
const fett = t => `<b style="display:inline;text-transform:none;letter-spacing:0;font-size:12.5px;color:inherit">${t}</b>`;
async function feedbackLaden() {
  const box = $("gespBox"); if (!box) return;
  let l; try { l = await api("/gesp/gespraeche/feedback/meine"); } catch (e) { box.innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; return; }
  if (!l.length) { box.innerHTML = '<div class="leer">Noch kein Feedbackgespräch.</div>'; return; }
  box.innerHTML = l.map((f, i) => {
    const n = Object.entries(f.bewertungen || {}).filter(([, v]) => v);
    const farbe = v => v <= 2 ? "rgba(16,185,129,.3)" : v === 3 ? "rgba(245,158,11,.3)" : "rgba(239,68,68,.3)";
    const noten = n.length ? '<div style="display:flex;gap:4px;flex-wrap:wrap;margin:6px 0">' + n.map(([k, v]) => `<span style="font-size:11.5px;padding:2px 8px;border-radius:999px;background:${farbe(v)}">${v} ${esc(FB_KAT[k] || k)}</span>`).join("") + "</div>" : "";
    const texte = [["Stärken", f.staerken], ["Entwicklung", f.entwicklung], ["Ziele", f.ziele], ["Notizen", f.notizen]].filter(x => x[1])
      .map(([t, v]) => `<div style="font-size:12.5px;margin-top:3px;white-space:pre-wrap">${fett(t + ":")} ${esc(v)}</div>`).join("");
    return `<div class="z" style="${i ? "opacity:.8" : ""}">${fett(dDE(f.datum) + (f.anlass ? " · " + esc(f.anlass) : ""))}
      <div style="font-size:11.5px;opacity:.7">von ${esc(f.erstelltVon || "")}</div>${noten}${texte}
      ${f.naechstes ? `<div style="font-size:11.5px;opacity:.7;margin-top:5px">Nächstes Gespräch: ${dDE(f.naechstes)}</div>` : ""}</div>`;
  }).join("");
}
// Reiter „💛 Danke“ (11.10.2026): was Kollegen einem an der Danke-Wand geschrieben haben (an mich + ans ganze Team)
async function dankeLaden() {
  const box = $("gespBox"); if (!box) return;

  const hin = []; if (d.tage) hin.push("Soll und ± mit System-Zeit, bis gestern"); if (d.datev) hin.push(d.datev.quelle === "datev" ? "DATEV tagesaktuell" : "DATEV aus Excel-Upload"); if (d.buero) hin.push("Büro: letzte 30 Tage");
  h += `<div class="zh-m" style="margin-top:2px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.45)">${esc(hin.join(" · "))}</div>`;
  box.innerHTML = h;
  box.querySelectorAll("[data-za]").forEach(x => x.onclick = () => { Z.art = x.dataset.za; Z.notiz = ""; if (Z.art !== "tag") Z.quelle = "alle"; zeitLaden(); });
  box.querySelectorAll("[data-zq]").forEach(x => x.onclick = () => { Z.quelle = x.dataset.zq; zeitLaden(); });
  box.querySelectorAll("[data-zt]").forEach(x => x.onclick = () => { Z.art = "tag"; Z.basis = new Date(x.dataset.zt + "T12:00:00"); Z.wo = "alle"; Z.raum = ""; Z.notiz = ""; zeitLaden(); });
  box.querySelectorAll("[data-wo]").forEach(x => x.onclick = () => { Z.wo = x.dataset.wo; Z.raum = ""; zeitLaden(); });
  box.querySelectorAll("[data-notiz]").forEach(x => x.onclick = () => { Z.notiz = Z.notiz === x.dataset.notiz ? "" : x.dataset.notiz; zeitLaden(); });
  box.querySelectorAll("[data-goeffnen]").forEach(x => x.onclick = () => { try { WA.player.state.saveVariable("swAktion", { was: "gespraechOeffnen", id: x.dataset.goeffnen, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); } });
  if ($("zRaum")) $("zRaum").onchange = e => { Z.raum = e.target.value; zeitLaden(); };
  $("zDatum").onchange = e => { if (e.target.value) { Z.art = "tag"; Z.basis = new Date(e.target.value + "T12:00:00"); Z.wo = "alle"; Z.raum = ""; Z.notiz = ""; zeitLaden(); } };
  box.querySelectorAll("[data-zs]").forEach(x => x.onclick = () => { const n = +x.dataset.zs, nb = new Date(Z.basis); if (Z.art === "monat") nb.setMonth(nb.getMonth() + n); else if (Z.art === "tag") nb.setDate(nb.getDate() + n); else nb.setDate(nb.getDate() + 7 * n); Z.basis = nb; Z.wo = "alle"; Z.raum = ""; Z.notiz = ""; zeitLaden(); });
}
async function laden() {
  if (!ausweis.holen()) return ausweisFormular();
  try { P = await api("/profil?" + (ICH ? "ich=1" : "name=" + encodeURIComponent(NAME))); zeigen(); }
  catch (e) { if (e.message === "ausweis") return ausweisFormular("Dein Ausweis ist nicht mehr gültig – bitte neu anmelden."); $("seite").innerHTML = '<div class="leer">' + esc(e.message) + "</div>"; }
}
laden();
</script>
