<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ron · Onboarding</title>
<!-- Ron (14.10.2026, Sam): Onboarding-Agent im Anbau (Zimmer R4 „Prüfstation“), Leertaste an seinem Tisch. Ron prüft und berichtet nur.
     Oben der Tagesbericht (ohne KI), darunter die Mandanten mit Ampel und Prüfhinweisen, unten der Chat (Claude Haiku). Server: services/ron.js -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef2f5; color: #111827; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255, 255, 255, .55); }
  header h1 { margin: 0; font-size: 15px; flex: 1; } header .u { font-size: 11.5px; color: #4b5563; font-weight: 400; display: block; }
  .av { width: 64px; height: 64px; border-radius: 50%; flex: none; position: relative; animation: atmen 4.5s ease-in-out infinite; }
  .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 0 0 3px #fff, 0 0 0 5px #c2410c; }
  .av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid rgba(249, 115, 22, 0); }
  .av.denkt::after { animation: denken 1.2s ease-in-out infinite; }
  @keyframes atmen { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-1px) scale(1.025); } }
  @keyframes denken { 0%, 100% { border-color: rgba(249, 115, 22, .15); transform: scale(1); } 50% { border-color: rgba(249, 115, 22, .9); transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { .av, .av.denkt::after { animation: none; } }
  main { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
  .karte { background: rgba(255, 255, 255, .6); border: 1px solid rgba(255, 255, 255, .7); border-radius: 12px; padding: 10px 12px; }
  .karte h2 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .zahlen { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .zahl { background: rgba(255, 255, 255, .75); border-radius: 10px; padding: 8px; text-align: center; } .zahl b { display: block; font-size: 22px; color: #0f766e; } .zahl span { font-size: 11px; color: #4b5563; }
  .zeile { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid rgba(17, 24, 39, .08); font-size: 13px; }
  .zeile:last-child { border: 0; }
  .ampel { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 4px; } .gruen { background: #22c55e; } .gelb { background: #f59e0b; } .rot { background: #ef4444; }
  .hw { font-size: 12px; color: #92400e; margin-top: 2px; } .hw.rot { color: #b91c1c; background: none; }
  .m { font-size: 11.5px; color: #4b5563; }
  #verlauf { display: flex; flex-direction: column; gap: 7px; max-height: 34vh; overflow-y: auto; padding: 2px; }
  .b { max-width: 86%; padding: 8px 11px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .b.ron { background: rgba(255, 255, 255, .85); align-self: flex-start; } .b.du { background: #ffedd5; color: #7c2d12; align-self: flex-end; }
  .eingabe { display: flex; gap: 6px; margin-top: 8px; }
  .eingabe textarea { flex: 1; font: inherit; font-size: 13.5px; border: 1.5px solid rgba(17, 24, 39, .2); border-radius: 10px; padding: 8px 10px; resize: none; min-height: 40px; background: rgba(255, 255, 255, .8); color: #111827; }
  .senden { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0 16px; background: #c2410c; color: #fff; cursor: pointer; } .senden:disabled { opacity: .5; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; } .chips button { font: inherit; font-size: 11.5px; border: 1px solid #fdba74; background: #fff; color: #9a3412; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  .leise { font: inherit; font-size: 12px; background: none; border: none; color: #6b7280; text-decoration: underline; cursor: pointer; }
  .fehler { color: #b91c1c; font-size: 12.5px; }
  :root.glas body { background: rgba(255, 255, 255, .15) !important; color: #111827 !important; text-shadow: none !important; }
  :root.glas body:hover, :root.glas body:focus-within { background: rgba(255, 255, 255, .88) !important; }
  :root.glas header { background: rgba(255, 255, 255, .45) !important; color: #111827 !important; }
  :root.glas .karte { background: rgba(255, 255, 255, .5) !important; color: #111827 !important; }
  :root.glas .m { color: #4b5563 !important; } :root.glas textarea { background: rgba(255, 255, 255, .8) !important; color: #111827 !important; color-scheme: light; }
</style>
<script src="glas.js?v=1792073655"></script>
</head>
<body>
<header><div class="av" id="av"><img src="ron-foto.jpg" alt="Ron"></div><h1>Ron · Onboarding<span class="u">prüft neue Mandanten und berichtet – schickt selbst nichts raus</span></h1></header>
<main>
  <div class="karte"><h2>📋 Heute</h2><div class="zahlen" id="zahlen"><div class="m">Lädt …</div></div></div>
  <div id="listen"></div>
  <div class="karte"><h2>💬 Frag Ron</h2>
    <div id="verlauf"></div>
    <div class="chips" id="chips"></div>
    <div class="eingabe"><textarea id="text" rows="1" placeholder="z. B. „Wer wartet am längsten?“"></textarea><button class="senden" id="los">Senden</button></div>
    <div class="fehler" id="fe"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px"><span class="m" id="kosten"></span><button class="leise" id="neu">Neu anfangen</button></div>
  </div>
</main>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
const KEY = "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", API = "https://swdigitaltest.de/buero-praesenz/ron";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ausweis = () => { try { return localStorage.getItem("swBueroAusweis") || ""; } catch { return ""; } };
async function api(pfad, body) {
  const opt = body === undefined ? {} : { method: "POST", body: JSON.stringify(body) };
  const r = await fetch(API + pfad, { ...opt, headers: { "X-Buero-Key": KEY, "X-Buero-Ausweis": ausweis(), "X-Buero-Name": encodeURIComponent(window.__waName || ""), "Content-Type": "application/json" } });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(/ausweis/.test(d.error || "") ? "Bitte das Büro kurz neu entsperren." : d.error || "Fehler " + r.status); return d;
}
let S = null, sendet = false;
function ampel(x) { return x.hinweise.some(h => h.s === "rot") ? "rot" : x.hinweise.length ? "gelb" : "gruen"; }
function liste(titel, l, info) {
  if (!l.length) return "";
  return `<div class="karte"><h2>${titel} <span class="m">(${l.length})</span></h2>` + l.map(x => `<div class="zeile"><span class="ampel ${ampel(x)}"></span><div style="flex:1"><b>${esc(x.name)}</b>${x.mdtNr ? ` <span class="m">${esc(x.mdtNr)}</span>` : ""}${x.sprache === "EN" ? ' <span class="m">EN</span>' : ""}
    <div class="m">${info(x)}</div>${x.hinweise.map(h => `<div class="hw ${h.s === "rot" ? "rot" : ""}">• ${esc(h.t)}</div>`).join("")}</div></div>`).join("") + "</div>";
}
function zeichnen() {
  const b = S.bericht, h = b.heute;
  $("zahlen").innerHTML = [[h.aufnahmen, "neue Aufnahmen"], [h.gesendet, "gesendet"], [h.fertig, "fertig"], [h.inDatev, "in DATEV verbunden"]].map(([z, t]) => `<div class="zahl"><b>${z}</b><span>${t}</span></div>`).join("");
  $("listen").innerHTML = liste("⏳ Wartet auf den Mandanten", b.wartet, x => `${x.schritte} von 5 Schritten · seit ${x.tage} Tag${x.tage === 1 ? "" : "en"}${x.geoeffnet ? "" : " · Link noch nicht geöffnet"}${x.erinnert ? " · " + x.erinnert + "× erinnert" : ""}`)
    + liste("🏛 Fertig – noch nicht in DATEV", b.fertigOhneDatev, x => "alle Schritte erledigt")
    + liste("📝 In Aufnahme (noch nicht gesendet)", b.inAufnahme, x => `seit ${x.tage} Tag${x.tage === 1 ? "" : "en"}`)
    + (!b.wartet.length && !b.fertigOhneDatev.length && !b.inAufnahme.length ? `<div class="karte m">Gerade ist nichts offen. ${b.erledigt30 ? b.erledigt30 + " Mandant(en) in den letzten 30 Tagen fertig verbunden." : ""}</div>` : "");
  const c = S.chat || [];
  $("verlauf").innerHTML = c.length ? c.map(m => `<div class="b ${m.rolle === "ron" ? "ron" : "du"}">${esc(m.text)}</div>`).join("")
    : `<div class="b ron">Hi ${esc(String(S.ich || "").split(/\s+/)[0])}! Ich bin Ron 🧑‍🦰 Ich behalte alle Onboardings im Blick und sage dir, wo etwas fehlt. Frag mich einfach.</div>`;
  $("verlauf").scrollTop = $("verlauf").scrollHeight;
  $("chips").innerHTML = c.length ? "" : ["Wer wartet am längsten?", "Was fehlt bei den fertigen?", "Wen sollte ich heute anrufen?"].map(t => `<button data-t="${esc(t)}">${esc(t)}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { $("text").value = b.dataset.t; senden(); });
}
async function laden() { try { S = await api(""); $("fe").textContent = ""; zeichnen(); } catch (e) { $("zahlen").innerHTML = `<div class="fehler">${esc(e.message)}</div>`; } }
async function senden() {
  const t = $("text").value.trim(); if (!t || sendet) return; sendet = true; $("los").disabled = true; $("fe").textContent = "";
  S.chat = [...(S.chat || []), { rolle: "du", text: t }, { rolle: "ron", text: "… Ron schaut nach …" }]; zeichnen(); $("text").value = ""; $("av").classList.add("denkt");
  try { const r = await api("/chat", { text: t }); if (r.usd) $("kosten").textContent = "letzte Antwort ≈ " + (r.usd * 100 * 0.86).toFixed(2).replace(".", ",") + " Cent"; }
  catch (e) { $("fe").textContent = e.message; }
  sendet = false; $("los").disabled = false; $("av").classList.remove("denkt"); laden();
}
$("los").onclick = senden;
$("text").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); senden(); } };
$("neu").onclick = async () => { if (!confirm("Den Chat mit Ron leeren?")) return; try { await api("/neu", {}); laden(); } catch (e) { $("fe").textContent = e.message; } };
(async () => { for (let i = 0; i < 30 && typeof WA === "undefined"; i++) await new Promise(r => setTimeout(r, 100));
  try { await Promise.race([WA.onInit(), new Promise(r => setTimeout(r, 2500))]); window.__waName = WA.player.name || ""; } catch { /* ohne WA */ }
  if (!ausweis()) { $("zahlen").innerHTML = '<div class="fehler">Bitte zuerst das Büro entsperren (Anmelden), dann noch einmal die Leertaste drücken.</div>'; return; }
  laden(); setInterval(() => { if (!sendet && !document.activeElement.matches("textarea")) laden(); }, 60000); })();
</script>
</body>
</html>
