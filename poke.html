<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; color-scheme:dark; }
  canvas { width:100%; height:100%; cursor:pointer; display:block; }
  canvas.zuck { animation:zuck .5s ease-in-out; }
  canvas.weg { animation:weg .45s ease-in forwards; }
  @keyframes zuck { 0%,100% { transform:translateY(0); } 40% { transform:translateY(-4%) rotate(-3deg); } 70% { transform:translateY(0) rotate(2deg); } }
  @keyframes weg { to { transform:scale(.1) rotate(200deg); opacity:0; } }
</style>
<script src="https://play.workadventu.re/iframe_api.js"></script>
</head>
<body>
<canvas id="c" width="44" height="44"></canvas><div id="raid" style="display:none;position:absolute;left:0;right:0;top:0;text-align:center;font:800 9px system-ui;color:#fff;text-shadow:0 1px 2px #000">RAID</div>
<script>
// Pokémon in der Karte (18.10.2026, Sam: „nicht so leuchten, versteckt, aber noch zu finden“): halb im Busch, im hohen Gras
// oder im Schatten, etwas blasser, ohne Hüpfen; nur ab und zu ein kurzes Zucken. Anklicken = fangen (Spieler-Variable „swAktion“).
const q = new URLSearchParams(location.search), nr = Number(q.get("nr")) || 25, i = q.get("i") || "0", art = q.get("v") || "busch";
const c = document.getElementById("c"), g = c.getContext("2d"), bild = new Image();
bild.src = "pokemon/" + String(nr).padStart(3, "0") + ".png?v=2"; // 17.10.2026: offizielle Bilder von pokemon.com (Sam), 192×192
const Q = matchMedia("(pointer:coarse)").matches ? 2 : 3; c.width = c.height = 44 * Q; // 3-fache Auflösung für scharfe Bilder (Handy 2-fach, spart Speicher)
if (art === "raid") { c.width = 72 * Q; c.height = 72 * Q; document.getElementById("raid").style.display = "block"; }
bild.onload = () => {
  g.scale(Q, Q); g.imageSmoothingQuality = "high";
  if (art === "raid") { g.imageSmoothingEnabled = true; const gr = g.createRadialGradient(36, 40, 4, 36, 40, 34); gr.addColorStop(0, "rgba(239,68,68,.45)"); gr.addColorStop(1, "rgba(239,68,68,0)"); g.fillStyle = gr; g.fillRect(0, 0, 72, 72); g.drawImage(bild, 0, 0, bild.width, bild.height, 8, 10, 56, 56); return; } // Raid-Boss groß und sichtbar
  if (art === "blume") { g.imageSmoothingEnabled = true; g.save(); g.globalAlpha = .5; g.filter = "brightness(.8)"; g.drawImage(bild, 0, 0, bild.width, bild.height, 12, 6, 20, 20); g.restore(); for (const [x, y, f] of [[16, 30, "#f472b6"], [26, 32, "#facc15"], [21, 36, "#f9a8d4"]]) { g.fillStyle = f; g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); } g.strokeStyle = "#3f7f2e"; g.lineWidth = 2; g.beginPath(); g.moveTo(21, 40); g.lineTo(21, 44); g.stroke(); return; } // Mew getarnt als Blume
  g.imageSmoothingEnabled = true;
  g.save(); g.globalAlpha = .82; g.filter = art === "schatten" ? "brightness(.62) saturate(.55)" : "brightness(.7) saturate(.6)"; // 18.10.2026 (Sam): nicht leuchten, gedämpft wie die Umgebung
  if (art === "schatten") g.drawImage(bild, 0, 0, bild.width, bild.height, 9, 12, 26, 26);
  else g.drawImage(bild, 0, 0, bild.width, bild.height * 44 / 64, 6, 4, 32, 22); // nur der obere Teil schaut heraus
  g.restore();
  const kreis = (x, y, r, f) => { g.fillStyle = f; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  if (art === "busch") { for (const [x, y, r, f] of [[12, 34, 10, "#3f7f2e"], [32, 34, 10, "#3f7f2e"], [22, 29, 11, "#4c9636"], [17, 37, 8, "#4c9636"], [28, 38, 8, "#3f7f2e"]]) kreis(x, y, r, f); }
  // Abends/nachts wird die Karte dunkler – das Pokémon samt Versteck mit abdunkeln (sonst leuchtet es)
  const std = Number(new Date().toLocaleString("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", hour12: false })) || 12;
  const dunkel = std >= 20 || std < 6 ? .55 : std >= 18 || std < 7 ? .32 : .08;
  setTimeout(() => { g.save(); g.globalCompositeOperation = "source-atop"; g.fillStyle = "rgba(8,14,40," + dunkel + ")"; g.fillRect(0, 0, 44, 44); g.restore(); }, 0);
  if (art === "gras") { g.strokeStyle = "#3f7f2e"; g.lineWidth = 2; for (let k = 0; k < 16; k++) { g.beginPath(); g.moveTo(6 + k * 2, 42); g.lineTo(4 + k * 2 + ((k * 7) % 5), 25 - ((k * 5) % 6)); g.stroke(); } }
};
c.title = "Klick: fangen!";
const zucken = () => { c.classList.remove("zuck"); void c.offsetWidth; c.classList.add("zuck"); setTimeout(zucken, 12000 + Math.random() * 14000); };
setTimeout(zucken, 4000 + Math.random() * 10000);
WA.onInit().then(() => {
  c.onclick = () => { c.classList.add("weg"); c.onclick = null;
    try { WA.player.state.saveVariable("swAktion", { was: "pokeFang", nr, i, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); }
    try { window.blur(); } catch { /* egal */ } };
});
</script>
</body>
</html>
