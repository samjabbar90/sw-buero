<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; color-scheme:dark; }
  img { width:100%; height:100%; image-rendering:pixelated; cursor:pointer; display:block; animation:huepf 1.6s ease-in-out infinite; filter:drop-shadow(0 2px 1px rgba(0,0,0,.35)); }
  img.weg { animation:weg .45s ease-in forwards; }
  @keyframes huepf { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6%); } }
  @keyframes weg { to { transform:scale(.1) rotate(200deg); opacity:0; } }
</style>
<script src="https://play.workadventu.re/iframe_api.js"></script>
</head>
<body>
<img id="b" alt="">
<script>
// Pokémon in der Karte (18.10.2026, Sam): anklicken = fangen. Meldet den Fang ans Büro-Skript (Spieler-Variable „swAktion“).
const q = new URLSearchParams(location.search), nr = Number(q.get("nr")) || 25, i = q.get("i") || "0";
const b = document.getElementById("b"); b.src = "pokemon/" + String(nr).padStart(3, "0") + ".png?v=1"; b.title = "Klick: fangen!";
WA.onInit().then(() => {
  b.onclick = () => { b.classList.add("weg"); b.onclick = null;
    try { WA.player.state.saveVariable("swAktion", { was: "pokeFang", nr, i, t: Date.now() }, { public: false, persist: false }); } catch (e) { console.warn(e); }
    try { window.blur(); } catch { /* egal */ } };
});
</script>
</body>
</html>
