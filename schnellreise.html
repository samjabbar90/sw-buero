<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schnellreise</title>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script src="glas.js?v=1792085662"></script>
<style>
  :root { --bg: #eef2f5; --karte: rgba(255,255,255,.9); --text: #111827; --leise: #4b5563; --akzent: #0f766e; color-scheme: light; } /* 14.10.2026 (Sam): helle Optik wie Mein Profil */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); padding: 14px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(17,24,39,.2); background: #fff; color: var(--text); font-size: 15px; margin-bottom: 12px; }
  h2 { font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--leise); margin: 14px 0 6px; }
  .liste { display: grid; gap: 6px; }
  .zeile { display: flex; gap: 6px; } .zeile > button:first-child { flex: 1; } .zoom { width: auto !important; flex: none; justify-content: center; padding: 10px 12px !important; }
  button { text-align: left; width: 100%; padding: 10px 12px; border: 1px solid rgba(17,24,39,.1); border-radius: 10px; background: var(--karte); color: var(--text); font-size: 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  button:hover { border-color: var(--akzent); }
  .leer { color: var(--leise); font-size: 13px; }
  .punkt { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }
  /* 14.10.2026 (Sam): schlichte Symbole statt Tür, Gesichter bei Büros, Gruppen einklappbar */
  .sym { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: rgba(15,118,110,.12); color: #0f766e; }
  .sym svg { width: 17px; height: 17px; }
  .gesicht { width: 30px; height: 30px; border-radius: 50%; flex: none; background: #475569 center/cover no-repeat; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; color: #fff; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(17,24,39,.12); }
  .gesicht.leer2 { background: rgba(148,163,184,.18); color: #94a3b8; }
  details { border-top: 1px solid rgba(17,24,39,.1); } details:first-of-type { border-top: 0; }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--leise); padding: 12px 2px 8px; font-weight: 700; user-select: none; }
  summary::-webkit-details-marker { display: none; } summary .pf { transition: transform .15s; font-size: 10px; } details[open] summary .pf { transform: rotate(90deg); }
  .stern { width: auto !important; flex: none; padding: 10px 11px !important; color: #94a3b8; font-size: 15px; } .stern.an { color: #d97706; } /* Favoriten (15.10.2026) */
  summary .anz { margin-left: auto; font-weight: 600; letter-spacing: 0; text-transform: none; font-size: 12px; opacity: .8; }
</style>
</head>
<body>
<div style="display:flex;gap:8px;align-items:flex-start;padding-right:44px"><input id="suche" placeholder="Raum oder Kollege suchen …" autocomplete="off" style="flex:1">
<button id="schliessen" type="button" aria-label="Schließen" style="flex:none;width:42px;height:42px;border-radius:10px;border:1px solid #3f4651;background:#3f4651;color:#fff;font-size:20px;cursor:pointer">✕</button></div>
<h2>Kollegen im Büro</h2>
<div class="liste" id="leute"><div class="leer">Lädt …</div></div>
<h2>Räume <span style="font-weight:400;font-size:12px;opacity:.7;text-transform:none;letter-spacing:0">· 👁 = nur ansehen (Kamera zoomt hin, du bleibst stehen)</span></h2>
<div class="liste" id="raeume"><div class="leer">Lädt …</div></div>
<script>
// Schnellreise (06.10.2026): Räume aus der Karte + Kollegen im Büro; Klick = sofort dort (WA.player.teleport).
// Ziel ist immer ein freies Feld (ohne Kollision) nahe der Raummitte bzw. neben dem Kollegen.
const T = 32;
let karte = null, kollision = null, raeume = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function freiesFeld(px, py, box) {
  // nächstes Feld ohne Kollision (Breitensuche), optional innerhalb eines Rechtecks
  const W = karte.width, H = karte.height, sx = Math.floor(px / T), sy = Math.floor(py / T);
  const drin = (x, y) => x >= 0 && y >= 0 && x < W && y < H && (!box || (x >= box.x0 && x <= box.x1 && y >= box.y0 && y <= box.y1));
  const gesehen = new Set([sx + ',' + sy]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (drin(x, y) && !kollision[y * W + x]) return { x: x * T + T / 2, y: y * T + T / 2 };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const k = (x + dx) + ',' + (y + dy); if (!gesehen.has(k) && drin(x + dx, y + dy)) { gesehen.add(k); q.push([x + dx, y + dy]); } }
  }
  return { x: px, y: py };
}
function reisen(ziel) { WA.player.teleport(ziel.x, ziel.y); WA.ui.modal.closeModal(); }
// 11.10.2026 (Sam: „bei Reise immer vor einem Zimmer, nie in ein Zimmer“): vom Raum aus über begehbare Felder suchen — das erste
// Feld mit mindestens 1 Feld Abstand außerhalb des Raums liegt direkt vor der Tür (der Weg führt ja durch die Tür hinaus)
// feste Ziele, wo der eingetragene Bereich kleiner ist als der Raum (Feld vor der Tür)
const VOR_DER_TUER = { "Fitnessraum": [73, 15] };
function vorDemRaum(r) {
  if (VOR_DER_TUER[r.name]) { const [fx, fy] = VOR_DER_TUER[r.name]; return { x: fx * T + T / 2, y: fy * T + T / 2 }; }
  const W = karte.width, H = karte.height, x0 = r.x / T, y0 = r.y / T, x1 = (r.x + r.w) / T - 1, y1 = (r.y + r.h) / T - 1;
  const innen = (x, y) => x >= x0 && x <= x1 && y >= y0 && y <= y1, nah = (x, y) => x >= x0 - 1 && x <= x1 + 1 && y >= y0 - 1 && y <= y1 + 1;
  const frei = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !kollision[y * W + x];
  const start = freiesFeld(r.x + r.w / 2, r.y + r.h / 2, { x0, y0, x1, y1 }), sx = Math.floor(start.x / T), sy = Math.floor(start.y / T);
  const gesehen = new Set([sx + ',' + sy]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    if (!nah(x, y)) return { x: x * T + T / 2, y: y * T + T / 2 };
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy, k = nx + ',' + ny; if (!gesehen.has(k) && frei(nx, ny)) { gesehen.add(k); q.push([nx, ny]); } }
  }
  return freiesFeld(r.x + r.w / 2, r.y + r.h + T); // kein Weg gefunden: unterhalb des Raums
}
// Anzeige-Namen (14.10.2026, Sam) – die Bereiche in der Karte behalten ihre Namen (Türen, Live-Anzeige, Reservierungen hängen daran)
const PERSON = { "Zimmer 1": "Tanja R.", "Zimmer 2": "Christiane S.", "Zimmer 3": "Jana J.", "Zimmer 4": "Kubilay A.", "Zimmer 5": "Bin W.", "Zimmer 6": "Onur K.",
  "Zimmer 7": "Dilber A.", "Zimmer 8": "Fatih K.", "Zimmer 9": "Kerstin C.", "Zimmer 10": "Angelika T.", "Zimmer 11": "", "Zimmer 12": "", "Zimmer 13": "Ilona S.",
  "Zimmer 14": "Julien M.", "Zimmer 15": "Bahjat D.", "Zimmer 16": "", "Büro Leutrim": "Leutrim S.", "Büro Katharina": "Katharina K.", "Büro Ferhat": "Ferhat F.",
  "Büro Angelina": "Angelina M.", "Büro Sam": "Sam J.", "Büro Noura": "Noura A.", "Büro Emre": "Emre A.", "Büro Kadir": "Kadir K.", "Büro Attila": "Attila K." };
const NAME = { "Besprechung Glas": "Besprechungszimmer 1", "Besprechung 11": "Besprechungszimmer 2", "Pause": "Pausenraum", "Lernzimmer": "Schulungsraum" };
const SVG = p => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
const ICON = {
  besprechung: SVG('<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'),
  schulung: SVG('<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>'),
  pause: SVG('<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/>'),
  fitness: SVG('<path d="M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M6.5 6.5v11M17.5 6.5v11"/>'),
  hilfe: SVG('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><path d="m4.93 4.93 4.24 4.24M14.83 14.83l4.24 4.24M14.83 9.17l4.24-4.24M4.93 19.07l4.24-4.24"/>'),
  mandant: SVG('<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>'),
  abteilung: SVG('<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>'),
  ort: SVG('<path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>'),
};
const STAEDTE = ["Paris", "Berlin", "Lissabon", "New York", "Amsterdam", "Moskau"];
function art(n) {
  if (/^(Büro |Zimmer \d)/.test(n)) return "buero";
  if (/^Besprechung/.test(n)) return "besprechung";
  if (n === "Lernzimmer") return "schulung";
  if (STAEDTE.includes(n) || /Donna|Mandanten/.test(n)) return "mandant";
  if (/^Pause|Lounge|Terrasse|Küche/.test(n)) return "pause";
  if (/Fitness/.test(n)) return "fitness";
  if (/Helpcenter/.test(n)) return "hilfe";
  if (/abschluss|IT-|Social|Ron|Mina|Agent|Onboarding/i.test(n)) return "abteilung";
  return "ort";
}
const GRUPPEN = [["besprechung", "Besprechung & Schulung"], ["buero", "Büros"], ["gemeinsam", "Gemeinsame Räume"], ["mandant", "Mandanten-Etage"], ["abteilung", "Abteilungen & Anbau"], ["ort", "Weitere Orte"]];
const gruppeVon = a => a === "besprechung" || a === "schulung" ? "besprechung" : a === "pause" || a === "fitness" || a === "hilfe" ? "gemeinsam" : a;
function anzeige(x) { if (x.name in PERSON) return PERSON[x.name] ? PERSON[x.name] + " Büro" : "Leeres Büro (" + x.name + ")"; return NAME[x.name] || x.name; }
// Gesichter aus dem SW-internen Portal (Kurzname „Vorname N.“ oder eindeutiger Vorname)
let GES = [];
function gesichtVon(name) { const n = String(name || "").toLowerCase().trim(); if (!n) return null;
  const g = GES.find(x => x.kurz.toLowerCase() === n || x.name.toLowerCase() === n); if (g) return g.foto;
  const v = n.split(/\s+/)[0], t = GES.filter(x => x.name.toLowerCase().split(/\s+/)[0] === v); return t.length === 1 ? t[0].foto : null; }
const initialen = n => String(n || "?").split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
const gesicht = (f, n) => f ? '<span class="gesicht" style="background-image:url(&quot;' + esc(f) + '&quot;)"></span>' : '<span class="gesicht">' + esc(initialen(n)) + '</span>';
function bild(x) {
  const a = art(x.name);
  if (a === "buero") { const p = PERSON[x.name]; if (p === "") return '<span class="gesicht leer2">–</span>'; const n = p || x.name.replace(/^Büro |^Zimmer /, ""); return gesicht(gesichtVon(n), n); }
  return '<span class="sym">' + ICON[a] + '</span>';
}
// Favoriten (15.10.2026, Sam): ☆ an jeder Zeile, oben eigene Gruppe „Favoriten“. Gespeichert je Person (Spieler-Variable, auf jedem Gerät gleich).
let fav = []; try { fav = JSON.parse(localStorage.getItem("swReiseFav") || "[]"); } catch {}
function favSpeichern() { try { localStorage.setItem("swReiseFav", JSON.stringify(fav)); } catch {} try { WA.player.state.saveVariable("swReiseFav", fav, { public: false, persist: true }); } catch {} }
let zu = new Set(); try { zu = new Set(JSON.parse(localStorage.getItem("swReiseZu") || "[]")); } catch {}
const raumVon = (px, py) => raeume.filter(r => px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h).sort((a, b) => a.w * a.h - b.w * b.h)[0];

function zeichnen() {
  const s = document.getElementById('suche').value.trim().toLowerCase();
  const passt = n => !s || n.toLowerCase().includes(s);
  const r = raeume.filter(x => passt(x.name) || passt(anzeige(x)));
  const zeile = x => '<div class="zeile"><button data-raum="' + raeume.indexOf(x) + '">' + bild(x) + '<span>' + esc(anzeige(x)) + '</span></button><button class="stern' + (fav.includes(x.name) ? ' an' : '') + '" data-fav="' + esc(x.name) + '" title="' + (fav.includes(x.name) ? 'Aus den Favoriten nehmen' : 'Als Favorit merken') + '">' + (fav.includes(x.name) ? '★' : '☆') + '</button><button class="zoom" data-zoom="' + raeume.indexOf(x) + '" title="Nur ansehen – Kamera zoomt hin">👁</button></div>';
  const favs = fav.map(n => r.find(x => x.name === n)).filter(Boolean);
  const favHtml = favs.length ? '<details data-g="fav" open><summary><span class="pf">▶</span>⭐ Favoriten<span class="anz">' + favs.length + '</span></summary><div class="liste" style="padding-bottom:10px">' + favs.map(zeile).join('') + '</div></details>' : '';
  document.getElementById('raeume').innerHTML = r.length ? favHtml + GRUPPEN.map(([g, titel]) => {
    const teil = r.filter(x => gruppeVon(art(x.name)) === g).sort((a, b) => anzeige(a).startsWith("Leeres") - anzeige(b).startsWith("Leeres") || anzeige(a).localeCompare(anzeige(b), 'de'));
    if (!teil.length) return '';
    return '<details data-g="' + g + '"' + (s || !zu.has(g) ? ' open' : '') + '><summary><span class="pf">▶</span>' + titel + '<span class="anz">' + teil.length + '</span></summary><div class="liste" style="padding-bottom:10px">' + teil.map(zeile).join('') + '</div></details>';
  }).join('') : '<div class="leer">Kein Raum gefunden</div>';
  document.querySelectorAll('details[data-g]').forEach(d => d.addEventListener('toggle', () => { if (s) return; d.open ? zu.delete(d.dataset.g) : zu.add(d.dataset.g); try { localStorage.setItem("swReiseZu", JSON.stringify([...zu])); } catch {} }));
  const leute = [...WA.players.list()].filter(p => passt(p.name)).sort((a, b) => a.name.localeCompare(b.name, 'de'));
  document.getElementById('leute').innerHTML = leute.length ? leute.map(p => '<button data-spieler="' + esc(p.playerId) + '">' + gesicht(gesichtVon(p.name), p.name) + '<span style="flex:1">' + esc(p.name) + '</span><span class="punkt"></span></button>').join('') : '<div class="leer">Gerade niemand außer dir</div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.fav) { const n = b.dataset.fav; fav = fav.includes(n) ? fav.filter(x => x !== n) : [...fav, n]; favSpeichern(); return zeichnen(); }
  if (b.dataset.raum) { const r = raeume[+b.dataset.raum]; reisen(vorDemRaum(r)); }
  // 11.10.2026 (Sam: „direkt zoomen, wenn ich etwas sehen will, z. B. das Social-Media-Büro“): Kamera fährt auf den Raum, Figur bleibt stehen
  if (b.dataset.zoom) { const r = raeume[+b.dataset.zoom], rand = 6 * T; try { WA.camera.set(r.x + r.w / 2, r.y + r.h / 2, Math.max(r.w + rand, 14 * T), Math.max(r.h + rand, 10 * T), false, true); } catch { /* ältere Version */ } WA.ui.modal.closeModal(); }
  if (b.dataset.spieler) { const p = [...WA.players.list()].find(x => String(x.playerId) === b.dataset.spieler); if (p) { const r = raumVon(p.position.x, p.position.y); reisen(r ? vorDemRaum(r) : freiesFeld(p.position.x + T, p.position.y)); } }
});
document.getElementById('suche').addEventListener('input', zeichnen);

WA.onInit().then(async () => {
  await WA.players.configureTracking({ players: true, movement: true });
  try { const v = WA.player.state.swReiseFav; if (Array.isArray(v)) fav = v; } catch {}
  let k = await (await fetch(WA.room.mapURL)).json();
  if (!k.layers && k.mapUrl) k = await (await fetch(new URL(k.mapUrl, WA.room.mapURL).toString())).json();
  karte = k;
  const alle = []; (function lauf(ls) { ls.forEach(l => { if (l.type === 'group') lauf(l.layers); else alle.push(l); }); })(k.layers);
  kollision = (alle.find(l => l.name === 'collisions') || { data: [] }).data;
  alle.filter(l => l.type === 'objectgroup').forEach(l => l.objects.forEach(o => {
    if ((o.class === 'area' || o.type === 'area') && o.name && o.name !== 'start' && !o.name.startsWith('zu-')) raeume.push({ name: o.name, x: o.x, y: o.y, w: o.width, h: o.height });
  }));
  // Plätze innerhalb eines Raums (z. B. „Mina“ im Social-Media-Büro) sind keine eigenen Reiseziele; doppelte Namen (Fitnessraum) nur einmal
  raeume = raeume.filter(a => !raeume.some(b => b !== a && b.w * b.h > a.w * a.h && a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h));
  raeume = raeume.filter((a, i) => raeume.findIndex(b => b.name === a.name) === i);
  zeichnen();
  // Gesichter nachladen (Büro-Ausweis aus dem Büro-Schloss; ohne Ausweis bleiben Anfangsbuchstaben)
  try { const aw = localStorage.getItem("swBueroAusweis") || ""; if (aw) { const g = await fetch("https://swdigitaltest.de/buero-praesenz/gesichter", { headers: { "X-Buero-Key": "a21b2aa2a42fe6189b05773c07bbc9ad78e38b34ba3bb6fe", "X-Buero-Ausweis": aw } }); if (g.ok) { GES = await g.json(); zeichnen(); } } } catch {}
  WA.players.onPlayerEnters.subscribe(zeichnen); WA.players.onPlayerLeaves.subscribe(zeichnen);
  document.getElementById('suche').focus();
});
// eigener Schließen-Knopf (12.10.2026): das ✕ von WorkAdventure ist am Handy blass und schwer zu treffen
document.getElementById("schliessen").onclick = () => { try { WA.ui.modal.closeModal(); } catch (e) { /* ältere Version */ } };
</script>
</body>
</html>
