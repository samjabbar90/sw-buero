<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Ausweis</title>
<!-- 15.10.2026 (Leutrim: Ideen/Kalender/Gespräch gehen nicht): Das Büro-Skript läuft in einem eigenen, abgeschotteten Rahmen – was es im
     Browser-Speicher ablegt, sehen die Büro-Fenster nicht. Nach der Anmeldung über die Anmeldeseite legt das Skript den Ausweis in die private
     Spieler-Variable swAusweisNeu; diese unsichtbare Seite (gleicher Rahmen wie alle Fenster) übernimmt ihn in den Speicher und schließt sich. -->
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<script>
(async () => {
  try {
    await WA.onInit();
    const t = WA.player.state.swAusweisNeu;
    if (t) { try { localStorage.setItem("swBueroAusweis", String(t)); } catch (e) {} WA.player.state.saveVariable("swAusweisNeu", "", { public: false, persist: false }); }
    const alle = await WA.ui.website.getAll(); const ich = alle.find(w => /ausweis-sync\.html/.test(String(w.url || ""))); if (ich) ich.close();
  } catch (e) { /* ältere Version */ }
})();
</script>
</body>
</html>
