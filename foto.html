<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Foto</title>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
  img { display:block; width:100%; height:100%; object-fit:cover; box-sizing:border-box; border:2px solid #fff; border-radius:8px; background:#fff; }
</style>
</head>
<body>
<!-- Profilfoto über der Figur (07.10.2026, Sam: „wie bei Gather“). Adresse des Bildes kommt im #-Teil vom Büro-Skript. -->
<img id="b" alt="">
<script>
  try { document.getElementById('b').src = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* ohne Foto */ }
</script>
</body>
</html>
