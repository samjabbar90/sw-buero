<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  html, body { margin:0; height:100%; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .k { background:#1e293b; border:1px solid #334155; border-radius:18px; padding:28px 24px; max-width:380px; text-align:center; }
  .i { font-size:46px; } h1 { font-size:20px; margin:8px 0; } p { font-size:14px; color:#94a3b8; line-height:1.5; margin:0 0 18px; }
  a { display:block; background:#0d9488; color:#fff; text-decoration:none; font-weight:700; padding:13px; border-radius:10px; }
</style>
</head>
<body>
<div class="k">
  <div class="i">💤</div>
  <h1>Du wurdest aus dem Büro abgemeldet</h1>
  <p>Du warst 15 Minuten nicht am Rechner. Damit niemand online angezeigt wird, der nicht da ist, wurdest du automatisch abgemeldet.</p>
  <a href="https://play.workadventu.re/@/swdigitaltax/sw-digital-tax/buero" target="_top">🏢 Wieder ins Büro</a>
</div>
<script>
if (new URLSearchParams(location.search).get("grund") === "gesperrt") {
  document.querySelector("h1").textContent = "Du wurdest aus dem Büro abgemeldet";
  document.querySelector("p").textContent = "Das Büro war 10 Minuten gesperrt und wurde nicht entsperrt. Damit niemand online angezeigt wird, der nicht da ist, wurdest du automatisch abgemeldet.";
}
</script>
</body>
</html>
